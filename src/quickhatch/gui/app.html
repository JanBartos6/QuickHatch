async function showAIExtra(provider){
  const box=document.getElementById('aiExtra');
  if(!box)return;
  const callout=aiAvailabilityCallout(provider);
  if(provider==='codex'){
    box.innerHTML=callout;
    return;
  }
  const spec=AI_PROVIDER_SPEC[provider];
  if(!spec){box.innerHTML='';return;}
  window._aiExtraCallout=callout;
  window._aiProvider=provider;
  // Render inputs: custom-endpoint field if needed, key field if needed,
  // then a model-fetch area that starts empty and populates on Fetch.
  let html='';
  if(spec.custom){
    html+='<div class="field"><label>Base URL</label><input type="text" id="aiCustomEndpoint" placeholder="https://openrouter.ai/api/v1" value="https://openrouter.ai/api/v1"><div class="muted" style="font-size:var(--t-xs);margin-top:var(--s1)">Must expose /models and /chat/completions. Works with OpenRouter, Together, DeepInfra, self-hosted vLLM, etc.</div></div>';
  }
  if(spec.keyLabel){
    html+='<div class="field"><label>'+escHtml(spec.keyLabel)+'</label><input type="password" id="aiApiKey" placeholder="'+escHtml(spec.keyPlaceholder||'')+'" oninput="invalidateAIModels()"></div>';
  }
  html+='<div class="field"><label>Model</label><div id="aiModelArea"><button class="btn btn-ghost btn-sm" onclick="fetchAIModels()">Fetch available models</button></div></div>';
  if(providerSupportsNativeSearch(provider)){
    const nativeSearchValue=state._draft?.ai_config?.native_search;
    const checked=(nativeSearchValue!==undefined ? !!nativeSearchValue : (state.profile?.ai_config?.native_search)!==false)?'checked':'';
    html+='<label class="check" style="margin-top:var(--s2)"><input type="checkbox" id="aiNativeSearch" '+checked+'> <span>Use provider-native web search when available</span></label>'+
      '<div class="muted" style="font-size:var(--t-xs);margin-top:var(--s1)">On by default. For OpenAI, Claude, Gemini, and Grok, QuickHatch will let the provider handle search and will suppress its own harness search tools.</div>';
  }
  if(spec.docs){
    html+='<div class="muted" style="font-size:var(--t-xs);margin-top:var(--s1)">Model list from <a href="'+escHtml(spec.docs)+'" target="_blank" rel="noopener">'+escHtml(spec.docsLabel)+'</a>.</div>';
  }
  html+=callout;
  box.innerHTML=html;
  // For local providers (Ollama, LM Studio) we can fetch immediately
  // without a key. Same for reachability checks on first load.
  if(!spec.keyLabel){
    fetchAIModels();
  }
}

function invalidateAIModels(){
  // When the user changes the API key, clear any previously-fetched list.
  const area=document.getElementById('aiModelArea');
  if(area)area.innerHTML='<button class="btn btn-ghost btn-sm" onclick="fetchAIModels()">Fetch available models</button>';
}

async function fetchAIModels(){
  const provider=window._aiProvider;
  const spec=AI_PROVIDER_SPEC[provider];
  if(!spec)return;
  const area=document.getElementById('aiModelArea');
  if(!area)return;
  area.innerHTML='<p class="muted" style="font-size:var(--t-sm)">Fetching…</p>';
  let endpoint=spec.endpoint;
  if(spec.custom){
    const e=(document.getElementById('aiCustomEndpoint')||{}).value||'';
    endpoint=e.trim();
    if(!endpoint.match(/^https?:\/\//)){
      area.innerHTML='<div class="info-box info-warn">Enter a valid base URL first (must start with http:// or https://).</div>'+
        '<button class="btn btn-ghost btn-sm" onclick="fetchAIModels()" style="margin-top:var(--s2)">Retry</button>';
      return;
    }
  }
  const keyEl=document.getElementById('aiApiKey');
  const api_key=keyEl?keyEl.value:'';
  if(spec.keyLabel&&!api_key){
    area.innerHTML='<div class="info-box info-warn">Enter your API key first, then click Fetch.</div>'+
      '<button class="btn btn-ghost btn-sm" onclick="fetchAIModels()" style="margin-top:var(--s2)">Retry</button>';
    return;
  }
  let models=[];
  let errMsg='';
  try{
    const r=await fetch('/wizard/fetch-models',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({kind:spec.kind,endpoint:endpoint,api_key:api_key})});
    const d=await r.json();
    if(d.status==='ok'){
      // For OpenAI-compat endpoints, drop embedding-only models from the
      // picker — they can't do chat completions and just confuse the user.
      models=(d.models||[]).filter(m=>!/embed|embedding/i.test(m));
    }else{
      errMsg=d.message||'unknown error';
    }
  }catch(e){
    errMsg=e.message||'network error';
  }
  if(models.length){
    area.innerHTML='<select id="aiModel">'+
      models.map(m=>`<option value="${escHtml(m)}">${escHtml(m)}</option>`).join('')+
      '</select><div class="muted" style="font-size:var(--t-xs);margin-top:var(--s1)">'+models.length+' models available.</div>';
  }else{
    const why=errMsg
      ?('Could not fetch models: '+escHtml(errMsg))
      :(spec.kind==='ollama'
        ?'No models pulled. Run `ollama pull <model>` in a terminal, then Retry.'
        :(provider==='local_lmstudio'
          ?'Could not reach LM Studio at localhost:1234. Open the app and load a model, then Retry.'
          :'No models returned. Check your API key or base URL, then Retry.'));
    area.innerHTML='<div class="info-box info-warn">'+why+'</div>'+
      '<button class="btn btn-ghost btn-sm" onclick="fetchAIModels()" style="margin-top:var(--s2)">Retry</button>';
  }
}

async function submitAI(){
  const p=getSelected('aiChoice');
  if(!p){toast('Pick a provider first.','error');return;}
  // Codex is a separate CLI, no key/model picker needed. Still
  // explicitly clear sibling fields so a previous API picker's
  // key/endpoint/model don't survive the switch.
  if(p==='codex'){
    await saveProfile({ai_config:{provider:'codex',model_name:null,endpoint:null,api_key:null,native_search:true}});
    await completeStep('ai_setup');
    return;
  }
  const spec=AI_PROVIDER_SPEC[p];
  if(!spec){toast('Unknown provider.','error');return;}
  const modelEl=document.getElementById('aiModel');
  const model=modelEl?modelEl.value:'';
  if(!model){
    toast('Click Fetch available models and pick one before continuing.','error');
    return;
  }
  const keyEl=document.getElementById('aiApiKey');
  const api_key=keyEl?keyEl.value:'';
  if(spec.keyLabel&&!api_key){
    toast('Enter your API key.','error');
    return;
  }
  let endpoint=spec.endpoint;
  if(spec.custom){
    const e=(document.getElementById('aiCustomEndpoint')||{}).value||'';
    endpoint=e.trim();
    if(!endpoint){toast('Enter the base URL.','error');return;}
  }
  // Keep the specific provider label end-to-end. Collapsing every
  // hosted-API provider to 'api' forced downstream code to identify
  // Anthropic by substring-matching the endpoint URL — fragile and
  // a credential-leak risk for custom endpoints with 'anthropic' in
  // the hostname. Always send what the user actually picked. Also
  // explicitly OVERWRITE every ai_config field so switching from one
  // provider to another can't leave stale key/endpoint/model behind.
  const cfg={
    provider:p,
    model_name:model,
    endpoint:endpoint,
    api_key:api_key||null,
    native_search:providerSupportsNativeSearch(p)
      ?((document.getElementById('aiNativeSearch')||{}).checked!==false)
      :true,
  };
  await saveProfile({ai_config:cfg});
  await completeStep('ai_setup');
}
async function submitPrefs(){
  const designDesc=(el('designDescription')||{}).value.trim();
  if(!designDesc){toast('Describe how you want it to look so the AI has something to match','error');return;}
  const useCasesRaw=(el('useCasesText')||{}).value.trim();
  const useCases=useCasesRaw
    ?useCasesRaw.split(',').map(s=>s.trim()).filter(Boolean)
    :[];
  // Read the another_machine pill if present (migration mode only).
  // Validate: user must pick a value before proceeding, because the
  // next step's UI branches on it (data-transfer shown vs hidden).
  const grid=el('anotherMachineGrid');
  let anotherMachine=state.profile.preferences?.another_machine||'';
  if(grid){
    const sel=grid.querySelector('.pill.selected');
    anotherMachine=sel?sel.dataset.value:'';
    if(!anotherMachine){
      toast('Pick whether you have a second machine available during install.','error');
      return;
    }
  }
  const prefs={
    desktop_look:designDesc,
    use_cases:useCases,
    distro_preference:(el('distroPref')||{}).value||null,
    another_machine:anotherMachine,
    // Legacy fields kept in the schema but no longer user-facing. The
    // curated library + the free-text description above give the harness
    // everything it needs; dedicated icon/wallpaper/picks inputs were
    // redundant once we had 100+ grounded recipes to match against.
    icon_style:'',
    wallpaper_style:'',
    gallery_picks:[...(state.galleryPinned||[])],
  };
  // If the user just flipped to 'no' (offline single-machine), the
  // previously-picked data_transfer_method becomes nonsensical (no
  // live agent to run scp/cloud CLI). Clear it so the migration plan
  // doesn't carry a stale contradictory value.
  const extra={};
  if(anotherMachine==='no'&&state.profile.data_transfer_method){

  }
  await saveProfile({preferences:prefs,...extra});
  clearDraftValue('preferences.desktop_look');
  clearDraftValue('preferences.use_cases_text');
  clearDraftValue('preferences.distro_preference');
  clearDraftValue('preferences.another_machine');
  clearDraftValue('preferences.gallery_picks');
  // Step list depends on another_machine: refresh now so the next
  // render shows the correct subsequent steps.
  refreshSteps();
  await completeStep('questionnaire');
}

async function runScan(){
  await autoSaveTargetOverrideIfNeeded();
  const btn=el('scanBtn');
  btn.disabled=true;btn.textContent='Scanning…';
  el('scanResults').innerHTML='<p class="muted" style="font-size:var(--t-sm)">Scanning…</p>';
  let data;
  try{
    data=await api('/wizard/scan','POST');
  }catch(e){
    el('scanResults').innerHTML=errorCard('Could not run the scan: '+(e.message||'unknown error'), 'onclick="runScan()"');
    btn.disabled=false;btn.textContent='Try again';
    toast('Scan failed','error');
    return;
  }
  const r=data.results||{};
  let html='';
  if(r.hardware){
    html+='<div class="hw-grid">';
    html+=hwCard('CPU',escHtml(r.hardware.cpu||'Unknown'),r.hardware.cpu_cores?r.hardware.cpu_cores+' cores':'');
    html+=hwCard('RAM',r.hardware.ram_gb?r.hardware.ram_gb+' GB':'Unknown','');
    (r.hardware.gpus||[]).forEach(g=>{html+=hwCard('GPU',escHtml(g.name),escHtml(g.vendor))});
    (r.hardware.displays||[]).forEach(d=>{
      const mode=(d.width_px&&d.height_px)?`${d.width_px}×${d.height_px}`:'unknown resolution';
      const refresh=d.refresh_hz?` @ ${Math.round(d.refresh_hz)} Hz`:'';
      const scale=d.scale_percent?` · ${d.scale_percent}% scale`:'';
      const primary=d.primary?'primary':'';
      html+=hwCard('Display',escHtml(d.name||'Unknown display'),escHtml(`${mode}${refresh}${scale}${primary?' · '+primary:''}`));
    });
    if(r.hardware.wifi_adapters?.length)html+=hwCard('WiFi',r.hardware.wifi_adapters.length+' adapter'+(r.hardware.wifi_adapters.length>1?'s':''),'');
    html+=hwCard('Bluetooth',r.hardware.bluetooth?'Available':'Not detected','');
    html+=hwCard('Boot',r.hardware.efi?'UEFI':'Legacy BIOS','');
    html+='</div>';
    if(r.hardware.disks?.length){
      html+='<div style="margin-top:10px">';
      r.hardware.disks.forEach(d=>{
        const pct=d.total_gb?Math.round(d.used_gb/d.total_gb*100):0;
        html+=`<div class="disk-bar"><div style="display:flex;justify-content:space-between;font-size:.78rem;color:var(--fg-muted);margin-bottom:2px"><span>${escHtml(d.mount_point)}</span><span>${d.used_gb}/${d.total_gb} GB</span></div><div class="disk-track"><div class="disk-fill${pct>85?' high':''}" style="width:${pct}%"></div></div></div>`;
      });
      html+='</div>';
    }
  }
  let summary=[];
  if(r.apps)summary.push(r.apps.length+' apps');
  if(r.files)summary.push(r.files.total_files+' files ('+r.files.total_size_mb+' MB)');
  if(r.settings?.theme)summary.push(r.settings.theme+' theme');
  if(r.files?.browser_profiles){const b=Object.keys(r.files.browser_profiles);if(b.length)summary.push(b.join(', '))}
  if(summary.length)html+=`<div class="scan-summary">${summary.join(' &middot; ')}</div>`;
  if(html){
    el('scanResults').innerHTML=html;
  }else{
    el('scanResults').innerHTML='<p class="dim" style="font-size:var(--t-sm)">Limited results. The agent will fall back to your preferences.</p>';
  }
  el('scanBtn').classList.add('hidden');el('scanNext').classList.remove('hidden');
  // Refresh client profile so subsequent steps see the scan results
  const seq=++state._profileRequestSeq;
  const fresh=await api('/wizard/profile');
  if(fresh.profile)applyServerProfile(fresh.profile,seq);
}

function compatClass(a){
  const c=(a.compatibility||'unknown').toLowerCase();
  if(c==='native')return'native';
  if(c==='alternative'||c==='alt'||c==='wine')return'alt';
  if(c==='none')return'unknown';
  return'unknown';
}

function compatLabel(a){
  const c=(a.compatibility||'unknown').toLowerCase();
  if(c==='native')return'Native';
  if(c==='alternative'||c==='alt')return'Alt';
  if(c==='wine')return'Wine';
  if(c==='none')return'No Linux';
  return'?';
}

function renderAppsList(apps){
  const list=el('appsList');if(!list)return;
  // Group apps by category
  const groups={};
  const order=['browsers','dev','media','office','communication','gaming','utilities','security','system','other'];
  for(const a of apps){
    const cat=categorizeApp(a.name||'');
    (groups[cat]=groups[cat]||[]).push(a);
  }
  const titleOf=id=>{
    const c=APP_CATEGORIES.find(x=>x.id===id);
    return c?c.title:'Other';
  };
  let html='';
  for(const id of order){
    const items=groups[id];if(!items||!items.length)continue;
    // Sort alphabetically within a group
    items.sort((a,b)=>(a.name||'').localeCompare(b.name||''));
    html+=`<div class="apps-group" data-cat="${id}">
      <div class="apps-group-head">
        <span class="apps-group-title">${escHtml(titleOf(id))}</span>
        <span class="apps-group-count muted">${items.length}</span>
        <button class="apps-group-toggle" onclick="toggleGroup(this)" type="button" aria-label="Toggle select"><span class="dim">Select all</span></button>
      </div>
      <div class="apps-group-body">`;
    for(const a of items){
      const name=a.name||'';
      const checked=state._appsSelected.has(name);
      const cls=compatClass(a);
      const label=compatLabel(a);
      const alt=a.linux_alternative?` <span class="app-alt muted">→ ${escHtml(a.linux_alternative)}</span>`:'';
      html+=`<label class="app-row" data-name="${escHtml(name.toLowerCase())}" data-cat="${id}">
        <input type="checkbox" class="app-check" value="${escHtml(name)}" onchange="onAppToggle(this)"${checked?' checked':''}>
        <span class="app-name">${escHtml(name)}${alt}</span>
        <span class="compat-badge compat-${cls}" title="${escHtml(label)}"><span class="compat-dot"></span>${escHtml(label)}</span>
      </label>`;
    }
    html+=`</div></div>`;
  }
  list.innerHTML=html;
  updateAppsStats();
}

function toggleGroup(btn){
  const group=btn.closest('.apps-group');
  const visibleChecks=[...group.querySelectorAll('.app-row:not(.hidden) .app-check')];
  if(!visibleChecks.length)return;
  const anyUnchecked=visibleChecks.some(c=>!c.checked);
  visibleChecks.forEach(c=>{
    c.checked=anyUnchecked;
    if(anyUnchecked)state._appsSelected.add(c.value);else state._appsSelected.delete(c.value);
  });
  updateAppsStats();
  persistAppsDataDraft();
}

function onAppToggle(cb){
  if(cb.checked)state._appsSelected.add(cb.value);
  else state._appsSelected.delete(cb.value);
  updateAppsStats();
  persistAppsDataDraft();
}

function filterApps(){
  const q=(el('appSearch').value||'').trim().toLowerCase();
  const rows=document.querySelectorAll('.app-row');
  const groups=document.querySelectorAll('.apps-group');
  rows.forEach(r=>{
    r.classList.toggle('hidden', q && !r.dataset.name.includes(q));
  });
  // Hide groups with no visible rows
  groups.forEach(g=>{
    const anyVisible=[...g.querySelectorAll('.app-row')].some(r=>!r.classList.contains('hidden'));
    g.classList.toggle('hidden', !anyVisible);
  });
  updateAppsStats();
}

function appsBulk(select){
  const visible=[...document.querySelectorAll('.app-row:not(.hidden) .app-check')];
  visible.forEach(c=>{
    c.checked=select;
    if(select)state._appsSelected.add(c.value);
    else state._appsSelected.delete(c.value);
  });
  updateAppsStats();
  persistAppsDataDraft();
}

function appsSmartSelect(){
  // Select everything that has Linux-native or alternative compatibility
  const rows=[...document.querySelectorAll('.app-row')];
  rows.forEach(r=>{
    const badge=r.querySelector('.compat-badge');
    const cls=badge?badge.className:'';
    const cb=r.querySelector('.app-check');
    const should=cls.includes('compat-native')||cls.includes('compat-alt');
    cb.checked=should;
    if(should)state._appsSelected.add(cb.value);else state._appsSelected.delete(cb.value);
  });
  updateAppsStats();
  persistAppsDataDraft();
}

function updateAppsStats(){
  const total=document.querySelectorAll('.app-row').length;
  const visible=[...document.querySelectorAll('.app-row:not(.hidden)')].length;
  const selected=state._appsSelected?state._appsSelected.size:0;
  const foundEl=el('appStatsFound');
  const selEl=el('appStatsSelected');
  if(foundEl)foundEl.textContent=visible===total?`${total} apps`:`${visible} of ${total} apps`;
  if(selEl)selEl.textContent=`${selected} selected`;
}

async function submitAppsData(){
  const checked=state._appsSelected?[...state._appsSelected]:[...document.querySelectorAll('.app-check:checked')].map(c=>c.value);
  // The data-transfer + data-description fields are only rendered when
  // another_machine === 'yes' AND not customize mode. When they're not
  // rendered, do NOT send empty strings — that would clobber whatever
  // the user typed earlier. Only include the fields when we actually
  // have values from the live DOM.
  const payload={apps_to_install:checked};
  const hasTransferGrid=!!el('dataTransfer');
  if(hasTransferGrid){
    const transfer=getSelected('dataTransfer')||'';
    if(!transfer){
      toast('Pick how you\'ll move your files to Linux before continuing.','error');
      return;
    }
    payload.data_transfer_method=transfer;
  }
  const descEl=el('dataDesc');
  if(descEl){
    payload.data_description=descEl.value||'';
  }
  await saveProfile(payload);
  clearDraftValue('apps_to_install');
  clearDraftValue('data_transfer_method');
  clearDraftValue('data_description');
  await completeStep('apps_data');
}

async function launchAgent(){
  const btn=el('launchBtn'),msg=el('launchMsg');
  btn.disabled=true;btn.textContent='Starting…';
  try{
    // If the bridge already has suggestions from a prior analysis,
    // use the rerun endpoint so it clears + regenerates. Otherwise
    // the section loop would skip each one with 'already generated —
    // skipping' and the user's updated preferences would never land.
    let endpoint = '/wizard/launch-agent';
    let body = {};
    try{
      const sug = await api('/api/suggestions');
      if ((sug.suggestions||[]).length > 0){
        endpoint = '/wizard/rerun-agent';
        body = {message: ''};
      }
    }catch(_){}
    const data=await api(endpoint,'POST',body);
    if(data.status==='ok'){
      // Swap launch UI for the live panel
      const launch=el('agentLaunch');
      const panel=el('agentPanel');
      const stop=el('stopBtn');
      if(launch)launch.classList.add('hidden');
      if(panel)panel.classList.remove('hidden');
      if(stop)stop.classList.remove('hidden');
      // Clear local view of suggestions too so the feed reflects the
      // regen immediately (server already reset them).
      const feed=el('agentFeed');
      if(feed)feed.innerHTML='';
      state._lastMsgCount=-1;state._lastSugCount=0;
      state._agentDone=false;
    }else{
      msg.innerHTML=`<span class="muted" style="color:var(--danger);font-size:var(--t-sm)">${escHtml(data.message||'Failed')}</span>`;
      btn.textContent='Start analysis';btn.disabled=false;
    }
  }catch(e){
    msg.innerHTML=`<span class="muted" style="color:var(--danger);font-size:var(--t-sm)">${escHtml(e.message)}</span>`;
    btn.textContent='Start analysis';btn.disabled=false;
  }
}

async function rerunAnalysis(){
  if(!confirm('Regenerate the entire analysis? Your current recommendations will be replaced.')) return;
  const resp=await api('/wizard/rerun-agent','POST',{message:''});
  if(resp&&resp.status==='ok'){
    beginAnalysisRunUi('Starting rerun…');
    pollBridge();
    toast('Rerunning analysis from scratch.','success');
  }else{
    toast('Rerun failed: '+((resp&&resp.message)||'unknown'),'error');
  }
}

  const panel=el('agentPanel');
  const feed=el('agentFeed');
  const phase=el('agentPhase');
  const spinner=el('agentSpinner');
  const stop=el('stopBtn');
  const rerun=el('rerunBtn');

  if(stop){stop.disabled=false;stop.textContent='Stop';stop.classList.remove('hidden');}

  if(dot)dot.className='dot connected';

  state._lastSugCount=0;
  state._lastMsgCount=-1;
}

async function answerQuestion(qid){
  const inp=el('answer-'+qid);if(!inp)return;
  const answer=inp.value.trim();if(!answer)return;
  inp.disabled=true;
  const resp=await api('/wizard/answer','POST',{question_id:qid,answer});
  const card=el('qcard-'+qid);
  // Only mark the card as answered if the backend actually accepted
  // the answer. A stale qid (server already dropped the question)
  // should NOT show a fake 'Answered' confirmation to the user.
  if(resp&&resp.status==='ok'){
    if(card)card.innerHTML=`<div style="color:var(--fg-dim);font-size:.82rem">Answered: ${escHtml(answer)}</div>`;
  }else{
    inp.disabled=false;
    if(card){
      const err=document.createElement('div');
      err.style='color:var(--err);font-size:.82rem;margin-top:var(--s1)';
      err.textContent='Answer not accepted: '+((resp&&resp.message)||'unknown question id — it may have timed out.');
      card.appendChild(err);
    }
  }
}

function renderQuestionCards(container, questions){
  if(!container)return;
  const drafts={};
  container.querySelectorAll('input[id^="answer-"]').forEach(inp=>{
    drafts[inp.id]=inp.value;
  });
  const active=document.activeElement;
  const activeId=active&&active.id&&active.id.startsWith('answer-')?active.id:'';
  const selStart=active&&typeof active.selectionStart==='number'?active.selectionStart:null;
  const selEnd=active&&typeof active.selectionEnd==='number'?active.selectionEnd:null;
  container.innerHTML=questions.map(q=>`
    <div class="info-box info-primary" id="qcard-${escHtml(q.id)}">
      <strong>${escHtml(q.question)}</strong>
      ${q.choices?`<div class="pill-grid" style="margin:var(--s2) 0">${q.choices.map(c=>`<span class="pill" data-qid="${escHtml(q.id)}" data-val="${escHtml(c)}">${escHtml(c)}</span>`).join('')}</div>`:''}
      <div class="stack-h" style="margin-top:var(--s2)">
        <input type="text" id="answer-${escHtml(q.id)}" placeholder="Type your answer…" onkeydown="if(event.key==='Enter')answerQuestion('${escHtml(q.id)}')" style="flex:1">
        <button class="btn btn-primary" onclick="answerQuestion('${escHtml(q.id)}')">Answer</button>
      </div>
    </div>`).join('');
  Object.entries(drafts).forEach(([id,val])=>{
    const inp=el(id);
    if(inp&&typeof val==='string')inp.value=val;
  });
  if(activeId){
    const next=el(activeId);
    if(next){
      next.focus();
      if(selStart!==null&&selEnd!==null&&typeof next.setSelectionRange==='function'){
        const len=(next.value||'').length;
        next.setSelectionRange(Math.min(selStart,len), Math.min(selEnd,len));
      }
    }
  }
}

let bridgePollTimer=null;
// ── Agent message classifier ──
// Returns {kind, label, cmd?} where kind ∈ 'phase' | 'command' | 'event' | 'error' | 'user' | 'done'
function classifyAgentMessage(m){
  const c=m.content||'';
  if(m.role==='user')return{kind:'user',label:c};
  // Finished
  if(/^finished:/i.test(c))return{kind:'done',label:c.replace(/^finished:\s*/i,'')};
  // Stop/abort
  if(/^stopped\.?$/i.test(c))return{kind:'done',label:'Stopped'};
  // Errors
  if(/^error:/i.test(c))return{kind:'error',label:c.replace(/^error:\s*/i,'')};
  // Command executions — the agent sends backticked command lines
  const cmdMatch=c.match(/^`([^`]+)`(?:\s+—\s+(.+))?/);
  if(cmdMatch)return{kind:'command',cmd:cmdMatch[1],reason:cmdMatch[2]||'',label:cmdMatch[2]||cmdMatch[1]};
  // Search / image operations
  if(/^searching:/i.test(c))return{kind:'event',icon:'search',label:c};
  if(/^finding images:/i.test(c))return{kind:'event',icon:'image',label:c};
  // High-level phase descriptions ("Generating …", "Installing …", "Connecting …", etc.)
  if(/^(connecting|connected|gathering|generating|installing|configuring|verifying|planning|expanding|applying|running|preparing|setting)/i.test(c)){
    return{kind:'phase',label:c};
  }
  // Default: treat as a status/event
  return{kind:'event',label:c};
}

// ── Feed renderer (shared between bridge and setup) ──
function renderAgentFeed(prefix, messages, done){
  const panel=el(prefix+'Panel');
  if(!panel||panel.classList.contains('hidden')&&messages.length===0)return;
  // Unhide once we have any messages
  if(panel.classList.contains('hidden')&&messages.length)panel.classList.remove('hidden');

  // Attention marker: any backend message starting with "[ATTENTION]"
  // triggers the flash + beep + tab-title alert. Tracked per prefix so
  // the bridge step's alerts don't fire on the setup step's markers
  // and vice versa. Poll tick runs every 2s, so seen-set dedupes.
  const seen=state['_attnSeen_'+prefix]||(state['_attnSeen_'+prefix]=new Set());
  for(const m of messages){
    const c=m.content||'';
    if(!c.startsWith('[ATTENTION]'))continue;
    const key=(m.time||0)+':'+c.slice(0,80);
    if(seen.has(key))continue;
    seen.add(key);
    // Strip the marker for the reason string.
    notifyAttention(c.slice(11).trim().split('\n')[0].slice(0,120));
  }

  // Classify all messages
  const classified=messages.map(m=>({...classifyAgentMessage(m),role:m.role}));

  // Find the latest phase + latest command (both can coexist)
  let currentPhase=null, currentCmd=null, currentError=null;
  for(let i=classified.length-1;i>=0;i--){
    const c=classified[i];
    if(!currentError&&c.kind==='error'){currentError=c;continue}
    if(!currentCmd&&c.kind==='command'){currentCmd=c;continue}
    if(!currentPhase&&(c.kind==='phase'||c.kind==='event'||c.kind==='done')){currentPhase=c;continue}
    if(currentPhase&&currentCmd)break;
  }

  // Header: phase + optional command
  const phaseEl=el(prefix+'Phase');
  const actionEl=el(prefix+'Action');
  const cmdEl=el(prefix+'Command');
  const spinnerEl=el(prefix+'Spinner');
  if(done){
    phaseEl.textContent=currentPhase?currentPhase.label:'Finished';
    phaseEl.classList.add('done');
    phaseEl.classList.remove('error');
    if(spinnerEl)spinnerEl.classList.add('hidden');
    panel.classList.add('done');
    const stopBtn=el(prefix==='setup'?'setupStopBtn':'stopBtn');
    if(stopBtn)stopBtn.classList.add('hidden');
    // Analysis step only: show the Rerun button so the user can
    // regenerate with updated preferences without hunting for the
    // chat box. Setup step doesn't get one — post-install rerun
    // is a different flow (would need to tear down the target).
    if(prefix==='agent'){
      const rerunBtn=el('rerunBtn');
      if(rerunBtn)rerunBtn.classList.remove('hidden');
    }
  }else if(currentError){
    phaseEl.textContent=currentError.label;
    phaseEl.classList.add('error');
  }else if(currentPhase){
    phaseEl.textContent=currentPhase.label.split('\n')[0];
    phaseEl.classList.remove('done','error');
  }
  if(actionEl){
    actionEl.textContent=currentCmd?(currentCmd.reason||''):'';
  }
  if(cmdEl){
    if(currentCmd&&!done){
      cmdEl.textContent=currentCmd.cmd;
      cmdEl.classList.remove('hidden');
    }else{
      cmdEl.classList.add('hidden');
    }
  }

  // Timeline: everything except the most recent command + the most recent phase (they're in the header)
  const excludeIdx=new Set();
  // Keep all items in timeline except the ones mirrored in header — we want context, so actually show them all
  const tl=el(prefix+'Timeline');
  if(tl){
    const tlKey=messages.length+':'+done;
    if(tl.dataset.key!==tlKey){
      const wasAtBottom=Math.abs(tl.scrollHeight-tl.clientHeight-tl.scrollTop)<8;
      const now=Date.now();
      const itemsHtml=classified.map((c,i)=>{
        if(c.role==='user'){
          return `<div class="tl-item"><span class="tl-icon">›</span><span class="tl-text" style="color:var(--primary);font-weight:500">You: ${escHtml(c.label)}</span><span class="tl-time"></span></div>`;
        }
        const kinds={command:'cmd',event:'',phase:'',done:'ok',error:'err'};
        const cls=kinds[c.kind]||'';
        const icons={command:'❯',event:'•',phase:'•',done:'✓',error:'×'};
        const icon=icons[c.kind]||'•';
        const txt=c.kind==='command'?c.cmd:c.label;
        return `<div class="tl-item ${cls}"><span class="tl-icon">${icon}</span><span class="tl-text">${escHtml(txt)}</span><span class="tl-time"></span></div>`;
      }).join('');
      tl.innerHTML=itemsHtml;
      tl.dataset.key=tlKey;
      if(wasAtBottom)tl.scrollTop=tl.scrollHeight;
    }
  }

  // Technical log: raw command outputs (commands only)
  const log=el(prefix+'LogBody');
  const logDetails=el(prefix+'LogDetails');
  if(log&&logDetails){
    const cmds=classified.filter(c=>c.kind==='command');
    if(cmds.length){
      logDetails.classList.remove('hidden');
      const key=cmds.length;
      if(log.dataset.key!==String(key)){
        log.dataset.key=String(key);
        log.textContent=cmds.map(c=>`$ ${c.cmd}`+(c.reason?`\n  # ${c.reason}`:'')).join('\n\n');
      }
    }
  }
}

async function pollBridge(){
  // Cancel any pending reschedule — every step re-entry would
  // otherwise stack another timer on top of the previous one, causing
  // parallel loops that race on innerHTML and double-render the feed.
  if(bridgePollTimer){clearTimeout(bridgePollTimer);bridgePollTimer=null;}
  try{
    const data=await api('/api/status');
    if(data.status==='ok'){
      const md=await api('/api/messages');
      const messages=md.messages||[];

      // Filter to analysis-phase messages (plus unphased system/legacy
      // messages). Setup-phase messages from prior runs are tagged
      // with phase='setup' at bridge.add_message time and won't clutter
      // the Analysis view anymore.
      const analysisMsgs = messages.filter(m => {
        const p = m.phase || '';
        return p === '' || p === 'analysis';
      });
      renderAgentFeed('agent', analysisMsgs, !!data.agent_done);

      const sd=await api('/api/suggestions');
      if(sd.suggestions){
        const feed=el('agentFeed');
        const section=el('suggestionsSection');
        if(feed&&sd.suggestions.length!==state._lastSugCount){
          state._lastSugCount=sd.suggestions.length;
          if(section){
            // Toggle both ways — a rerun that empties the list should
            // hide the header too, not leave a stranded 'Recommendations'.
            if(sd.suggestions.length)section.classList.remove('hidden');
            else section.classList.add('hidden');
          }
          feed.innerHTML=sd.suggestions.map(renderSuggestion).join('');
        }
      }

      const qd=await api('/api/pending-questions');
      const qa=el('questionArea');
      if(qd.questions&&qd.questions.length>0){
        if(qa){
          // Only flash + beep when a NEW question appears (qids we
          // haven't seen this session), not on every poll tick.
          const knownIds = state._knownQIds||(state._knownQIds=new Set());
          const newQs = qd.questions.filter(q=>!knownIds.has(q.id));
          if(newQs.length){
            newQs.forEach(q=>knownIds.add(q.id));
            notifyAttention('Agent is asking a question');
          }
          renderQuestionCards(qa, qd.questions);
        }
      }else{
        if(qa&&qa.innerHTML)qa.innerHTML='';
      }

      if(data.agent_done){
        state._agentDone=true;
        const btn=el('bridgeNext');
        if(btn&&btn.disabled){btn.disabled=false;btn.textContent='Continue'}
      }
    }
  }catch(e){}
  if(STEPS[state.currentStep]?.id==='bridge'&&!state._agentDone)bridgePollTimer=setTimeout(pollBridge,2000);
}

}

async function loadVmBackends(){
  const box=el('vmBackends');if(!box)return;
  try{
    const d=await api('/wizard/vm-verify/backends','GET');
    if(d.status==='ok'){
      const parts=[];
      parts.push(d.virtualbox?'✅ VirtualBox':'❌ VirtualBox (not found)');
      parts.push(d.qemu?'✅ QEMU':'❌ QEMU (not found)');
      const pick=d.preferred?` — available for a full boot test (requires a customized ISO, see above)`:' — install one only if you plan to build a customized ISO for the full boot test';
      box.innerHTML=parts.join(' · ')+pick;
    }
  }catch(e){box.textContent='Backend check failed: '+e;}
}

function renderVmResult(r){
  const out=el('vmVerifyResult');
  if(!r||!r.summary){out.innerHTML='';return;}
  const cls=r.success?'info-success':'info-warn';
  const stages=(r.stages||[]).map(s=>`<code>${escHtml(s)}</code>`).join(' → ')||'(no stages)';
  const tail=r.tail?`<details><summary>Output tail</summary><pre style="white-space:pre-wrap;max-height:300px;overflow:auto">${escHtml(r.tail)}</pre></details>`:'';
  out.innerHTML=`
    <div class="info-box ${cls}">
      <strong>${escHtml(r.summary)}</strong>
      <p>Backend: ${escHtml(r.backend||'—')} · Stages: ${stages}</p>
      ${r.error?`<p><strong>Error:</strong> ${escHtml(r.error)}</p>`:''}
      ${tail}
      ${r.success?'':'<p>Re-run the analysis with feedback like <em>"fix install.sh: &lt;what went wrong&gt;"</em> to have the agent iterate.</p>'}
    </div>`;
}

function showPrepPanel(d){
  const p=el('vmPrepPanel');
  p.style.display='block';
  p.innerHTML=`
    <div class="info-box info-warn">
      <strong>VM is booting.</strong> Wait for its terminal to show a root prompt (usually 20–60s). Then copy-paste the line below into that root shell and press Enter — it installs your SSH key so QuickHatch can log in.
      <div class="code-block" id="vmPaste" style="margin-top:var(--s2)">${escHtml(d.paste_snippet)}</div>
      <button class="btn btn-ghost btn-sm" onclick="copyFrom(this,'vmPaste')">Copy snippet</button>
      <div style="margin-top:var(--s3);display:flex;gap:var(--s2);flex-wrap:wrap">
        <button class="btn btn-primary" id="vmReadyBtn" onclick="finishVmVerify()">Ready — run install.sh inside the VM</button>
        <button class="btn btn-ghost" id="vmCancelBtn" onclick="cancelVmVerify()">Cancel and discard VM</button>
      </div>
    </div>`;
}

async function runVmVerify(){
  const btn=el('vmVerifyBtn'),status=el('vmVerifyStatus');
  const iso=(el('vmIsoPath').value||'').trim();
  btn.disabled=true;btn.textContent='Starting…';
  el('vmPrepPanel').style.display='none';el('vmPrepPanel').innerHTML='';
  el('vmVerifyResult').innerHTML='';
  // Tell the server to enable VM-aware prompt for future agent runs too.
  await api('/wizard/vm-verify/enable','POST',{enabled:true});

  if(!iso){
    // Syntax-only path (original one-shot endpoint)
    status.textContent='Running bash -n on install.sh…';
    const kick=await api('/wizard/vm-verify/run','POST',{iso_path:''});
    if(kick.status!=='ok'){
      status.textContent='';
      el('vmVerifyResult').innerHTML=errorCard(kick.message||'Could not start','onclick="runVmVerify()"');
      btn.disabled=false;btn.textContent='Run';return;
    }
    const poll=async()=>{
      const d=await api('/wizard/vm-verify/status','GET');
      if(d.running){status.textContent='Running…';setTimeout(poll,1500);return;}
      btn.disabled=false;btn.textContent='Run';status.textContent='';
      renderVmResult(d.result||{});
    };
    setTimeout(poll,1000);
    return;
  }

  // Assisted flow: boot VM in GUI mode, then user pastes the key.
  status.textContent='Booting VM…';
  const kick=await api('/wizard/vm-verify/prep','POST',{iso_path:iso});
  btn.disabled=false;btn.textContent='Run';
  if(kick.status!=='ok'){
    status.textContent='';
    el('vmVerifyResult').innerHTML=errorCard(kick.message||'VM could not start','onclick="runVmVerify()"');
    return;
  }
  status.textContent='';
  showPrepPanel(kick);
}

async function finishVmVerify(){
  const readyBtn=el('vmReadyBtn');if(readyBtn){readyBtn.disabled=true;readyBtn.textContent='Running script…';}
  const kick=await api('/wizard/vm-verify/finish','POST',{});
  if(kick.status!=='ok'){
    el('vmVerifyResult').innerHTML=errorCard(kick.message||'Could not finish','onclick="finishVmVerify()"');
    if(readyBtn){readyBtn.disabled=false;readyBtn.textContent='Ready — run install.sh inside the VM';}
    return;
  }
  const status=el('vmVerifyStatus');
  status.textContent='SSHing in and running install.sh…';
  const poll=async()=>{
    const d=await api('/wizard/vm-verify/status','GET');
    if(d.running){setTimeout(poll,2000);return;}
    status.textContent='';
    el('vmPrepPanel').style.display='none';
    el('vmPrepPanel').innerHTML='';
    renderVmResult(d.result||{});
  };
  setTimeout(poll,1500);
}

async function cancelVmVerify(){
  await api('/wizard/vm-verify/cancel','POST',{});
  el('vmPrepPanel').style.display='none';
  el('vmPrepPanel').innerHTML='';
  el('vmVerifyStatus').textContent='';
  toast('VM discarded','info');
}

async function runExport(){

  if(!ip||!user){toast('Enter IP and username first','error');return;}
  await saveProfile({linux_ip:ip,linux_user:user,remote_setup_mode:remoteSetupMode});
  state._sshTestOk=false;
  state._setupStarted=false;
  state._setupDone=false;
  toast('Connection saved','success');
  const btn=el('saveConnBtn');btn.textContent='Saved';
  const tb=el('testConnBtn');if(tb)tb.disabled=false;

async function launchSetupAgent(){
  const btn=el('setupLaunchBtn'),msg=el('setupLaunchMsg');
  btn.disabled=true;btn.textContent='Starting…';
  try{
    const data=await api('/wizard/launch-agent','POST',{phase:'setup'});
    if(data.status==='ok'){
      state._setupStarted=true;
      state._setupDone=false;
      const launch=el('setupLaunch');
      const panel=el('setupPanel');
      const stop=el('setupStopBtn');
      if(launch)launch.classList.add('hidden');
      if(panel)panel.classList.remove('hidden');
      if(stop)stop.classList.remove('hidden');

      state._setupStarted=false;

    state._setupStarted=false;
    msg.innerHTML=`<span class="muted" style="color:var(--danger);font-size:var(--t-sm)">${escHtml(e.message)}</span>`;

async function resetRemoteSetup(){
  const ok=window.confirm(
    'Reset Remote Setup? This clears the saved IP, username, setup transcript, and current setup-state for this step, but keeps the rest of your wizard profile.'
  );
  if(!ok)return;
  try{
    const r=await api('/wizard/reset-remote-setup','POST',{});
    if(r.status!=='ok'){
      toast(r.message||'Could not reset Remote Setup','error');
      return;
    }
    if(r.profile)state.profile=r.profile;
    state._sshTestOk=false;
    state._setupStarted=false;

    state._lastSetupSugCount=0;

async function setRemoteSetupMode(mode){
  const allowed=['auto','configure_only','wipe_and_reinstall'];
  if(!allowed.includes(mode))return;
  if(mode==='wipe_and_reinstall'){
    const ok=window.confirm(
      'Wipe + reinstall mode is destructive. On a live environment, QuickHatch may repartition and reformat the selected target disk after explicit disk confirmation. Continue?'
    );
    if(!ok)return;
  }
  state.profile.remote_setup_mode=mode;
  await saveProfile({remote_setup_mode:mode},{silentError:true});
  state._sshTestOk=false;
  stepRenderers.setup();
}

async function sendSetupChat(){
  const inp=el('setupChat');const msg=inp.value.trim();if(!msg)return;

let setupPollTimer=null;
async function pollSetup(){
  // Same rule as pollBridge: drop any pending reschedule up front
  // so re-entering the step doesn't stack parallel timers.
  if(setupPollTimer){clearTimeout(setupPollTimer);setupPollTimer=null;}
  try{
    const data=await api('/api/status');
    if(data.status==='ok'){
      const md=await api('/api/messages');
      const messages=md.messages||[];

      // Mirror of the analysis-feed filter but in the opposite
      // direction — show setup-phase messages + legacy/unphased ones,
      // drop analysis-phase chatter so the Remote Setup feed is clean.
      const setupMsgs = messages.filter(m => {
        const p = m.phase || '';
        return p === '' || p === 'setup';
      });
      renderAgentFeed('setup', setupMsgs, !!data.agent_done);

      const sd=await api('/api/suggestions');
      if(sd.suggestions){
        const feed=el('setupFeed');
        const section=el('setupSuggestionsSection');
        if(feed&&sd.suggestions.length!==(state._lastSetupSugCount||0)){
          state._lastSetupSugCount=sd.suggestions.length;
          if(section){
            if(sd.suggestions.length)section.classList.remove('hidden');
            else section.classList.add('hidden');
          }
          feed.innerHTML=sd.suggestions.map(renderSuggestion).join('');
        }
      }

      const qd=await api('/api/pending-questions');
      const qa2=el('setupQuestions');
      if(qd.questions&&qd.questions.length>0){
        if(qa2){
          const knownIds=state._knownSetupQIds||(state._knownSetupQIds=new Set());
          const newQs=qd.questions.filter(q=>!knownIds.has(q.id));
          if(newQs.length){
            newQs.forEach(q=>knownIds.add(q.id));
            notifyAttention('Agent is asking a question (setup)');
          }
          renderQuestionCards(qa2, qd.questions);
        }
      }else{
        // Clear stale question cards once the backend has no pending
        // Qs left. Otherwise a previously-answered card stays
        // interactive and the user could fake an answer for a qid the
        // server already dropped.
        if(qa2&&qa2.innerHTML)qa2.innerHTML='';
      }

      if(state._setupStarted&&data.agent_done){
        state._setupDone=true;
        const btn=el('setupDone');
        if(btn&&btn.disabled){btn.disabled=false;btn.textContent='Finish'}
      }
    }
  }catch(e){}
  // Stop polling once the agent is done — matches pollBridge behavior.
  if(STEPS[state.currentStep]?.id==='setup'&&!state._setupDone)setupPollTimer=setTimeout(pollSetup,2000);
}

// =============================================================
// Attention alert — fires when the agent needs user input.
// Combines:
//   1. Audio beep (WebAudio oscillator — no asset to ship)
//   2. Body background flash animation
//   3. Tab title flash "(!) needs input" alternating with original
//   4. Native browser notification if granted + tab not focused
//   5. Favicon tint to red (via data-URL replacement)
// Idempotent: calling notifyAttention() while alert already active
// just resets the timeout. Auto-clears when the user focuses the tab
// or calls clearAttention() explicitly.
// =============================================================
let _attentionTimer = null;
const _origTitle = document.title;
let _audioCtx = null;

function _beep(){
  try{
    _audioCtx = _audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const ctx=_audioCtx;
    // Soft two-note chirp: C6 → E6 over 200ms. Non-alarming but audible.
    for(const [freq,delay] of [[1046.5,0],[1318.5,120]]){
      const osc=ctx.createOscillator();
      const gain=ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.frequency.value=freq;
      const t=ctx.currentTime+(delay/1000);
      gain.gain.setValueAtTime(0, t);
      gain.gain.linearRampToValueAtTime(0.15, t+0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, t+0.18);
      osc.start(t); osc.stop(t+0.2);
    }
  }catch(_){ /* autoplay blocked until user gesture — fine, flash still runs */ }
}

function _setFavicon(red){
  const svg = red
    ? '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><circle cx="16" cy="16" r="14" fill="%23ef4444"/><text x="16" y="22" font-size="20" font-weight="900" fill="white" text-anchor="middle">!</text></svg>'
    : '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><circle cx="16" cy="16" r="14" fill="%234a90e2"/><text x="16" y="22" font-size="18" font-weight="700" fill="white" text-anchor="middle">QH</text></svg>';
  let link=document.querySelector('link[rel="icon"]');
  if(!link){link=document.createElement('link');link.rel='icon';document.head.appendChild(link);}
  link.href='data:image/svg+xml,'+svg;
}

function notifyAttention(reason){
  // reason is a short string shown in notifications + title
  document.body.classList.add('attention-flash');
  _beep();
  _setFavicon(true);
  let alt=false;
  if(_attentionTimer){clearInterval(_attentionTimer);}
  _attentionTimer=setInterval(()=>{
    alt=!alt;
    document.title = alt ? `(!) ${reason||'needs input'} — QuickHatch` : _origTitle;
  }, 1000);
  // Native notification — only useful when tab isn't focused.
  if(!document.hasFocus() && 'Notification' in window){
    if(Notification.permission==='granted'){
      try{ new Notification('QuickHatch needs input', {body: reason||'Open the tab to respond.'}); }catch(_){}
    } else if(Notification.permission!=='denied'){
      Notification.requestPermission().then(p=>{
        if(p==='granted'){
          try{ new Notification('QuickHatch needs input', {body: reason||'Open the tab to respond.'}); }catch(_){}
        }
      });
    }
  }
}

function clearAttention(){
  if(!_attentionTimer)return;
  clearInterval(_attentionTimer);
  _attentionTimer=null;
  document.title=_origTitle;
  document.body.classList.remove('attention-flash');
  _setFavicon(false);
}

// Auto-clear when the user actually looks at the tab.
window.addEventListener('focus', clearAttention);
document.addEventListener('visibilitychange', ()=>{
  if(document.hidden){
    try{ snapshotClientProfile(); }catch(_){}
    return;
  }
  clearAttention();
});
document.addEventListener('input', scheduleProfileSnapshot, true);
document.addEventListener('change', scheduleProfileSnapshot, true);
window.addEventListener('beforeunload', ()=>{ try{ snapshotClientProfile(); }catch(_){}; });
window.addEventListener('pagehide', ()=>{ try{ snapshotClientProfile(); }catch(_){}; });

// Measure the actual footer height and write it into the --footer-h
// var on <html>. The btn-row's `bottom: var(--footer-h)` and the page
// padding both rely on this. A hardcoded 44px default drifted past
// the real footer height, leaving a transparent sliver between the
// action bar and the footer where scrollable content bled through.
function syncFooterHeight(){
  const f=document.querySelector('.app-footer');
  if(!f)return;
  const h=Math.ceil(f.getBoundingClientRect().height);
  if(h>0)document.documentElement.style.setProperty('--footer-h', h+'px');
}
// Fire on everything that could affect footer height:
//  - DOMContentLoaded: initial structural measure (fonts may shift it)
//  - load: stylesheets + subresources all in
//  - fonts.ready: web fonts resolved, line metrics final
//  - resize: responsive media-query changes
document.addEventListener('DOMContentLoaded', syncFooterHeight);
window.addEventListener('load', syncFooterHeight);
if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(syncFooterHeight).catch(()=>{});
}
window.addEventListener('resize', syncFooterHeight);
// Also fire once synchronously on script eval — inlining the script at
// end-of-body means the footer is already in the DOM here.
syncFooterHeight();
// Delegated click handler for question-choice pills. Using data-attrs
// + addEventListener avoids building JS string literals via HTML
// interpolation, which otherwise round-trips `'` through entity decode
// and breaks out of the onclick quote context (XSS).
document.addEventListener('click',(ev)=>{
  const pill=ev.target&&ev.target.closest&&ev.target.closest('.pill[data-qid]');
  if(!pill)return;
  const qid=pill.getAttribute('data-qid');
  const val=pill.getAttribute('data-val');
  const inp=qid?el('answer-'+qid):null;
  if(inp)inp.value=val==null?'':val;
});
(async()=>{
  state._profileShadow=loadProfileShadow();
  state._draft=loadWizardDraft();
  await loadProfile();
  render();
  // Best-effort version fetch for the footer badge
  try{
    const v=await api('/wizard/version');
    const badge=document.getElementById('versionBadge');
    if(badge&&v&&v.version)badge.textContent='· v'+v.version;
  }catch(_){}
})();
