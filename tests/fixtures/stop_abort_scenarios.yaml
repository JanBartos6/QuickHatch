  state_before:
    completed_groups: []
    active_group: Install requested apps
    pending_question: false
    reboot_planned: false
    destructive_capability_pending: false
    manual_followups: []
  event:
    type: user_stop
    reason: User clicked stop while the first app install command was active
  expected:
    no_new_groups_started: true
    no_new_destructive_work: true
    no_reboot_started: true
    pending_question_cleared_or_marked: false
    logs_preserved: true
    support_bundle_explains_abort: true
