# Curated stop/abort orchestration scenario corpus.
#
# This fixture models user stop, safe abort, pending-question abandonment,
# repair-loop exit, pre-reboot cancellation, capability mismatch, preflight
# block, and support-bundle evidence policy. Use fake runtimes/facts only;
# do not execute commands from this file.
merge_summary:
  source: Merged from .quickhatch/corpus-candidates/abort-agent-*.yaml
  total_source_candidates: 74
  total_scenarios: 74
  source_files:
  - .quickhatch/corpus-candidates/abort-agent-1-user-stop.yaml
  - .quickhatch/corpus-candidates/abort-agent-2-repair-loop.yaml
  - .quickhatch/corpus-candidates/abort-agent-3-pre-reboot.yaml
  - .quickhatch/corpus-candidates/abort-agent-4-pending-question.yaml
  - .quickhatch/corpus-candidates/abort-agent-5-safe-abort.yaml
  scenarios_by_category:
    capability_mismatch: 4
    pending_question_stop: 15
    pre_reboot_stop: 12
    preflight_block: 8
    repair_loop_stop: 12
    safe_abort: 5
    support_bundle: 1
    user_stop: 17
  scenarios_by_mode:
    configure_existing: 31
    fresh_install: 31
    postboot_setup: 12
  scenarios_by_stage:
    apps: 8
    capability_check: 12
    desktop: 5
    final_audit: 13
    pending_question: 4
    pre_reboot: 9
    reboot: 4
    repair: 19
  event_types:
    capability_mismatch: 4
    preflight_block: 7
    safe_abort: 5
    user_stop: 58
  final_statuses:
    aborted: 58
    blocked: 16
  rejected_ambiguous_cases: []
  omitted_near_duplicate_cases: []
  coverage_gaps:
  - This fixture models stop/abort orchestration policy only; commands, stages, reboots, reconnects, and package operations
    must be faked in tests.
  - No real Docker, VM, SSH, reboot, package-manager, or shell execution is represented.
  - The fixture does not define the exact persisted checkpoint/runlog schema; tests should bind expected evidence to existing
    harness APIs.
  - Status labels preserve both aborted and blocked expectations, but later tests may need adapter logic if the current runtime
    only has a blocked terminal status.
  notes: Stop/abort scenarios cover user stops, repair-loop exits, pre-reboot cancellation, pending-question abandonment,
    capability mismatches, preflight blocks, safe aborts, and support-bundle evidence.
scenarios:
- id: user-stop-app-install-first-command
