  - No real compositor/display server is exercised; tests using this fixture should use fake facts and fake executors only.
  - Required vs optional cosmetic intent is not represented explicitly in this schema, so some stricter manual-followup boundaries
    remain policy-review candidates.
  - Support-bundle evidence is represented as final-audit scenarios; a later test still needs to assert exported bundle contents.
  notes: Commands are representative fixtures and must not be executed against the host.
scenarios:
- id: no-gui-kde-live-wallpaper-skip
  category: no_gui_session
  facts_profile:
    desktop: kde
    has_gui_session: false
    display: ''
    wayland: unknown
    target_user: quickhatch
    target_home: /home/quickhatch
  request:
    theme: ''
    icons: ''
    cursor: ''
    wallpaper: /home/quickhatch/Pictures/qh-wallpaper.jpg
    effects: []
  command_group:
    stage: desktop
    commands:
    - plasma-apply-wallpaperimage /home/quickhatch/Pictures/qh-wallpaper.jpg
  simulated_events:
  - type: facts_refresh
    detail: No DISPLAY, no WAYLAND_DISPLAY, no active GUI session for target user.
  expected:
    design_state:
      theme: not_requested
      icons: not_requested
      cursor: not_requested
      wallpaper: manual_followup_required
      effects: not_requested
    group_status: manual_followup
    final_status_effect: manual_followup_required
    should_execute_live_apply: false
    should_allow_persistent_config: false
  rationale: A live Plasma wallpaper apply requires an active target-user graphical session and should be deferred with a
    specific manual-follow-up reason.
- id: no-gui-kde-persistent-theme-icons-allowed
  category: no_gui_session
  facts_profile:
    desktop: kde
    has_gui_session: false
    display: ''
    wayland: unknown
    target_user: quickhatch
    target_home: /home/quickhatch
  request:
    theme: Breeze Dark
    icons: Papirus-Dark
    cursor: ''
    wallpaper: ''
    effects: []
  command_group:
    stage: desktop
    commands:
    - kwriteconfig6 --file /home/quickhatch/.config/kdeglobals --group General --key ColorScheme BreezeDark
    - kwriteconfig6 --file /home/quickhatch/.config/kdeglobals --group Icons --key Theme Papirus-Dark
  simulated_events:
  - type: command_success
    detail: Persistent KDE config writes are recorded for the target user.
  - type: facts_refresh
    detail: No active GUI session is available to verify the live visual state.
  expected:
    design_state:
      theme: persisted_but_not_live_verified
      icons: persisted_but_not_live_verified
      cursor: not_requested
      wallpaper: not_requested
      effects: not_requested
    group_status: warning
    final_status_effect: success_with_warnings
    should_execute_live_apply: false
    should_allow_persistent_config: true
  rationale: Safe persistent config can be written without a GUI session, but lack of live verification must prevent plain
    success.
