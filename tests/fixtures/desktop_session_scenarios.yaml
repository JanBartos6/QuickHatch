# Curated desktop/session/design scenario corpus.
#
# This fixture models desktop-stage orchestration, target-user session
# handling, design element verification, cosmetic failure isolation, and
# final-audit honesty. It should be used with fake facts/executors/model
# responses only; do not execute commands from this file against the host.
merge_summary:
  source: Merged from .quickhatch/corpus-candidates/desktop-session-agent-*.yaml
  total_source_candidates: 87
  total_scenarios: 78
  scenarios_by_category:
    cosmetic_failure: 8
    cursor: 4
    effects: 7
    final_audit: 8
    gnome: 4
    icons: 4
    kde: 1
    no_gui_session: 7
    theme: 7
    unknown_desktop: 5
    verification: 6
    wallpaper: 6
    wrong_user: 7
    xfce: 4
  final_status_effects:
    blocked: 1
    manual_followup_required: 40
    none: 7
    success_with_warnings: 30
  expected_design_states_covered:
    theme:
      applied_and_verified: 7
      attempted_but_failed: 4
      manual_followup_required: 19
      not_requested: 33
      persisted_but_not_live_verified: 13
      unavailable: 2
    icons:
      applied_and_verified: 3
      attempted_but_failed: 2
      manual_followup_required: 9
      not_requested: 52
      persisted_but_not_live_verified: 9
      unavailable: 3
    cursor:
      applied_and_verified: 1
      attempted_but_failed: 1
      manual_followup_required: 5
      not_requested: 63
      persisted_but_not_live_verified: 7
      unavailable: 1
    wallpaper:
      applied_and_verified: 5
      attempted_but_failed: 2
      manual_followup_required: 17
      not_requested: 49
      persisted_but_not_live_verified: 3
      unavailable: 2
    effects:
      applied_and_verified: 1
      manual_followup_required: 6
      not_requested: 64
      persisted_but_not_live_verified: 5
      unavailable: 2
  rejected_ambiguous_cases:
  - id: design-failure-kde-theme-persisted-no-live-session
    reason: Near duplicate of kde-theme-persist-no-gui with conflicting warning vs manual-followup expectation for the same
      persisted-but-unverified KDE theme state.
    source_agent: desktop-session-agent-4-design-failures
  - id: design-failure-kde-cursor-write-succeeds-unverified
    reason: Near duplicate of kde-cursor-persist-no-gui with stricter manual-followup expectation for the same persisted-but-unverified
      cursor state.
    source_agent: desktop-session-agent-4-design-failures
  - id: final-persisted-kde-theme-unverified
    reason: Near duplicate of kde-theme-persist-no-gui; final-audit manual-followup boundary is covered by final-stage-manual-followup-propagates.
    source_agent: desktop-session-agent-5-final-audit
  - id: final-persisted-wallpaper-pending-login
    reason: Near duplicate of pending-relogin-kde-persistent-wallpaper-live-skip with conflicting manual-followup vs warning
