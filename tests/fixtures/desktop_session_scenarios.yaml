    source_agent: desktop-session-agent-5-final-audit
  - id: final-live-wallpaper-verified
    reason: Exact outcome duplicate of kde-wallpaper-live-verified.
    source_agent: desktop-session-agent-5-final-audit
  - id: final-optional-icons-unavailable-warning
    reason: Near duplicate of kde-icons-live-missing-theme and design-failure-kde-icons-package-missing.
    source_agent: desktop-session-agent-5-final-audit
  - id: final-required-wallpaper-download-failed
    reason: Ambiguous because required-vs-optional wallpaper is encoded only in the id/rationale, not in the scenario schema.
