# Curated repair-loop-control scenario corpus.
#
# This fixture models orchestrator repair-loop policy only. It should be used
# with fake executors/model providers; do not execute commands from this file
# against the host. Expected outcomes focus on loop control, repair budgets,
# provider errors, required/optional status honesty, and install-spine safety.
merge_summary:
  source: Merged from .quickhatch/corpus-candidates/repair-loop-agent-*.yaml
  total_scenarios: 54
  scenarios_by_category:
    diagnostics_budget: 5
    group_scope: 6
    identical_loop: 8
    provider_error: 14
    required_optional: 11
    strategy_change: 10
  scenarios_by_stage:
    apps: 25
    desktop: 8
    final_audit: 5
    install_or_skip: 8
    postboot_driver: 8
  final_status_effects:
    blocked: 8
    manual_followup_required: 15
    none: 9
    success_with_warnings: 22
  invariants_covered:
  - identical_attempts_eventually_loop_or_budget_out
  - strategy_changes_do_not_count_as_identical_loops
  - provider_errors_preserve_progress_and_become_followup
  - required_unresolved_work_is_not_reported_as_success
  - optional_app_desktop_and_helper_failures_are_nonfatal
  - install_spine_failures_remain_blocking
  - capability_denials_are_not_repaired_by_blind_retry
  - diagnostics_are_budget_limited_without_hard_loop_detection
  - attempt_signatures_are_stage_scoped
  - final_audit_repairs_are_budget_limited_and_status_honest
  rejected_ambiguous_cases: []
  deduplicated_cases:
  - id: diagnostics-status-not-hard-loop
    reason: Exact duplicate of identical-diagnostic-status-budget-edge; same diagnostic command, repair sequence, and expected budget behavior.
    source_agent: repair-loop-agent-5-group-scope
  - id: install-spine-pacstrap-required-blocks
    reason: Near duplicate of identical-install-bootstrap-third-failure-blocks; both cover repeated pacstrap bootstrap failure blocking install_or_skip.
    source_agent: repair-loop-agent-4-required-optional
  notes: These are fake repair-loop scenarios for local pytest harnesses. Commands in this fixture must not be executed against the host.
scenarios:
- id: identical-app-repo-package-third-failure
  category: identical_loop
  stage: apps
  app_or_target: Obsidian
  initial_failure:
    command: sudo apt-get install -y obsidian
    failure_type: command
    stdout: Reading package lists... Done
    stderr: 'E: Unable to locate package obsidian'
  repair_sequence:
  - action: retry_command
    command: sudo apt-get install -y obsidian
    strategy: same
    result: failure
  - action: retry_command
    command: sudo apt-get install -y obsidian
    strategy: same
    result: failure
  expected:
    loop_detected: true
    budget_consumed_count: 2
    final_group_status: manual_followup
    final_status_effect: success_with_warnings
  rationale: An optional app retried with the identical package command and identical missing-package failure should stop as manual follow-up instead of looping.
