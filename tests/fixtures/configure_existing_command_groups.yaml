# Curated configure-existing command-group corpus.
#
# Configure-existing is an already-installed Linux system. Safe package/app,
# desktop, diagnostics, and reversible settings may be allowed or advisory even
# when they can fail naturally. Fresh-install disk/boot/fstab/package-DB and
# network/SSH-disruptive effects must block.
cases:
  - id: ce-apps-apt-install-valid
    category: apps
    facts_profile:
      family: ubuntu
      package_manager: apt
      desktop: gnome
      has_gui_session: true
      flatpak_available: true
      snap_available: true
      aur_helper: none
    command_group:
      stage: apps
      title: "Install common desktop apps with apt"
      commands:
        - "sudo apt-get update"
        - "sudo apt-get install -y vlc gimp thunderbird"
    expected:
      outcome: allow
      final_status_effect: none
      blocked_reason_category: ""
    rationale: "Package installation on an existing system is normal configure-existing app work."

  - id: ce-apps-apt-install-missing-package
    category: apps
    facts_profile:
      family: debian
      package_manager: apt
      desktop: xfce
      has_gui_session: true
      flatpak_available: false
      snap_available: false
      aur_helper: none
    command_group:
      stage: apps
      title: "Install one unavailable package"
      commands:
        - "sudo apt-get install -y keepassxc definitely-not-a-real-package"
    expected:
      outcome: allow_with_advisory
      final_status_effect: success_with_warnings
      blocked_reason_category: ""
    rationale: "A wrong package name should fail naturally or be repaired later, not hard-block preflight."

