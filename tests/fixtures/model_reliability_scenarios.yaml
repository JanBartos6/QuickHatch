# Main model regression scenario corpus.
#
# This fixture is an index for future model-reliability testing. It keeps
# high-risk planner/repair/provider behavior in one place and points to
# existing focused fixtures/tests when coverage already exists.
metadata:
  version: 1
  lane: model_reliability
  source: Curated from existing model-contract, provider-diversity, research-grounding, mode-awareness, repair-quality, and final-status lanes.
  policy: Model output is advisory until parsed, validated, grounded, capability-checked, executed, and audited by QuickHatch. Strong hosted models may use richer search features where safe; weaker/local models must degrade through retries, harness lookups, explicit uncertainty, manual follow-up, or blocking for core safety.
  total_scenarios: 50
  scenarios_by_category:
    final_status_honesty: 4
    json_contract: 5
    output_noise: 4
    planning_mode: 5
    provider_diversity: 6
    repair_quality: 6
    research_grounding: 6
    retry_loop_budget: 4
    safety_contract: 5
    uncertainty_followup: 5
  coverage_statuses:
    covered: 47
    partial: 3
  expected_behaviors:
    reject_malformed_or_unsafe_model_output: 13
    retry_or_correct_before_execution: 15
    use_harness_lookup_for_current_facts: 8
    preserve_dangerous_operation_gates: 5
    degrade_non_core_failures_to_manual_followup: 8
    keep_final_status_honest: 8
  schema:
    required_fields:
      - id
      - category
      - phase
      - provider_profile
      - setup_context
      - model_behavior
      - expected_harness_response
      - coverage
      - rationale
      - risk
    coverage_status_values:
      - covered
      - partial
      - candidate
    outcome_values:
      - accept_plan
      - retry_model
      - reject_response
      - lookup_then_plan
      - manual_followup
      - block
      - warning
      - unsupported_safe
scenarios:
  - id: json-root-array-rejected
    category: json_contract
    phase: research_plan
    provider_profile: {provider: generic, native_search: unknown}
    setup_context: {mode: configure_existing, family: arch, package_manager: pacman, stage: research_and_plan}
    model_behavior:
      pattern: "Returns a JSON array of candidate plans instead of one object."
      representative_response: '[{"action":"plan","plan":{}}]'
    expected_harness_response:
      outcome: reject_response
      final_status_effect: blocked
      runlog_events: [planner_response_invalid]
      must_not_execute: ["any command group from the array"]
    coverage:
      status: covered
      existing_tests: [tests/test_setup_model_contract.py]
      existing_fixtures: [tests/fixtures/model_contract_scenarios.yaml]
    rationale: "The contract is exactly one JSON object so the harness cannot accidentally pick one of several model guesses."
    risk: medium

  - id: json-thought-block-stripped
