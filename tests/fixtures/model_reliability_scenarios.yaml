    model_behavior:
      pattern: "Provider emits hidden reasoning tags before a valid JSON object."
      representative_response: '<thought>draft</thought>{"action":"question","question":"Which disk?","required":true}'
    expected_harness_response:
      outcome: accept_plan
      final_status_effect: none
      runlog_events: []
      must_not_execute: []
    coverage:
      status: covered
      existing_tests: [tests/test_setup_model_contract.py]
      existing_fixtures: [tests/fixtures/model_contract_scenarios.yaml]
    rationale: "Reasoning wrappers are common provider noise and should not poison otherwise valid structured output."
    risk: low

