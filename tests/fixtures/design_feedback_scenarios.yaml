# Curated design-change feedback-loop scenario corpus.
#
# This fixture models command success versus observed design success, focused
# design repair, per-element verification, wrong desktop/session handling, and
# final-audit honesty. Use fake facts/executors/model responses only; do not
# execute commands from this file against the host.
merge_summary:
  source: Merged from .quickhatch/corpus-candidates/design-feedback-agent-*.yaml
  total_source_candidates: 50
  total_scenarios: 50
  scenarios_by_category:
    cursor: 4
    effects: 2
    final_audit: 4
    icons: 3
    no_session: 6
    repair: 7
    theme: 5
    wallpaper: 4
    wrong_de: 8
    wrong_user: 7
  design_elements_covered:
    cursor:
      applied_and_verified: 10
      asset_missing: 2
      no_active_gui_session: 2
      not_requested: 31
      persisted_but_not_live_verified: 1
      wrong_desktop_environment: 1
      wrong_user_or_session: 3
    effects:
      applied_and_verified: 9
      manual_followup_required: 1
      no_active_gui_session: 2
      not_requested: 37
      wrong_user_or_session: 1
    icons:
      applied_and_verified: 10
      failed_to_apply: 2
      no_active_gui_session: 2
      not_requested: 31
      persisted_but_not_live_verified: 1
      wrong_desktop_environment: 2
      wrong_user_or_session: 2
    theme:
      applied_and_verified: 15
      failed_to_apply: 1
      no_active_gui_session: 2
      not_requested: 27
      persisted_but_not_live_verified: 2
      wrong_desktop_environment: 1
      wrong_user_or_session: 2
    wallpaper:
      applied_and_verified: 11
      asset_missing: 3
      failed_to_apply: 2
      no_active_gui_session: 3
      not_requested: 27
      persisted_but_not_live_verified: 1
      wrong_desktop_environment: 1
      wrong_user_or_session: 2
  repair_actions:
    install_asset: 5
    manual_followup: 13
    none: 16
    retry_apply: 10
    switch_de_strategy: 6
  final_status_effects:
    blocked: 3
    manual_followup_required: 19
    none: 7
    success_with_warnings: 21
  curation_notes:
  - id: final-audit-no-active-gui-all-elements
    note: No active GUI session prevents live verification but should not fatal-block
      core setup.
  - id: wallpaper-kde-missing-asset
    note: Missing requested wallpaper asset is a cosmetic/design follow-up, not a
      core setup block.
  - id: wallpaper-xfce-file-uri-missing-after-repair
    note: Malformed/missing wallpaper asset after repair should remain actionable
      manual follow-up.
  rejected_ambiguous_cases: []
  coverage_gaps:
  - No screenshot or real desktop-session verification is performed by this fixture.
  - Font and scaling feedback loops are not represented because the candidate schema
    has no dedicated font/scaling request fields.
  - Wayland/X11 differences are represented indirectly through session and command-result
    facts, not as a separate desktop enum.
scenarios:
- id: theme-kde-rc0-unchanged
  category: theme
  desktop:
    environment: kde
    has_gui_session: true
    target_user: quickhatch
    target_home: /home/quickhatch
  request:
    theme: Sweet-Dark
    icons: ''
    cursor: ''
    wallpaper: ''
    effects: []
  facts_before:
    active_theme: Breeze
    active_icons: Breeze
    active_cursor: Breeze
    active_wallpaper: /usr/share/wallpapers/Next/contents/images/1920x1080.png
    effects: []
  attempted_commands:
  - lookandfeeltool -a org.kde.sweet-dark.desktop
  command_result:
    rc: 0
    stdout: Look and feel package successfully applied.
    stderr: ''
  facts_after_attempt:
    active_theme: Breeze
    active_icons: Breeze
    active_cursor: Breeze
    active_wallpaper: /usr/share/wallpapers/Next/contents/images/1920x1080.png
    effects: []
  repair_result:
    action: none
    facts_after_repair:
      active_theme: Breeze
      active_icons: Breeze
      active_cursor: Breeze
      active_wallpaper: /usr/share/wallpapers/Next/contents/images/1920x1080.png
      effects: []
  expected:
    element_status:
      theme: failed_to_apply
      icons: not_requested
      cursor: not_requested
      wallpaper: not_requested
      effects: not_requested
    final_status_effect: manual_followup_required
  rationale: Command success is not enough; refreshed KDE facts still report the old
    theme.
