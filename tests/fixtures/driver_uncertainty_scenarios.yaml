# Curated driver/hardware uncertainty scenario corpus.
#
# This fixture models GPU driver planning, Secure Boot uncertainty, VM graphics,
# reboot-dependent verification, and final-audit honesty. Use fake facts, fake
# executors, fake reconnects, and fake model/provider responses only; do not
# execute commands from this file and do not treat any scenario as real hardware
# certification evidence.
merge_summary:
  source: Merged from .quickhatch/corpus-candidates/driver-agent-*.yaml
  total_source_candidates: 84
  total_scenarios: 72
  scenarios_by_category:
    amd: 6
    driver_failure: 9
    final_audit: 4
    headless: 6
    hybrid: 6
    intel: 6
    nvidia: 15
    reboot_required: 3
    secure_boot: 11
    vm_gpu: 6
  driver_statuses:
    blocked: 3
    installed_unverified: 16
    manual_followup_required: 34
    skipped: 6
    unsupported_safe: 1
    verified: 12
  final_status_effects:
    blocked: 3
    manual_followup_required: 39
    none: 13
    success_with_warnings: 15
    unsupported_safe: 2
  rejected_ambiguous_cases: []
  omitted_near_duplicate_cases:
  - id: nvidia-modern-rtx4070-installed-before-reboot-unverified
    reason: Near duplicate of drv4-nvidia-installed-module-pending-reboot; retained the richer pre-reboot
      facts-refresh/reboot-required variant.
  - id: drv4-nvidia-reboot-verify-success
    reason: Near duplicate of nvidia-modern-rtx3060-healthy-after-reboot; retained the NVIDIA-lane positive
      control.
  - id: final-postreboot-verification-passes
    reason: Near duplicate of nvidia-modern-rtx3060-healthy-after-reboot; retained one verified post-reboot
      positive control.
  - id: final-reboot-required-not-yet-verified
    reason: Near duplicate of drv4-nvidia-installed-module-pending-reboot; retained the reboot-verification
      lane case.
  - id: final-nvidia-installed-module-missing
    reason: Near duplicate of nvidia-modern-rtx3080-postreboot-module-missing; retained the direct module-missing
      failure case.
  - id: drv4-secureboot-module-rejected-after-reboot
    reason: Near duplicate of secureboot-nvidia-unsigned-dkms-rejected and final-secureboot-unsigned-nvidia-module;
      retained signed/unsigned Secure Boot coverage elsewhere.
  - id: drv4-secureboot-mok-enrollment-pending
    reason: Near duplicate of secureboot-nvidia-mok-enrollment-pending; retained the clearer MOK enrollment
      case.
  - id: secureboot-provider-suggests-vendor-curl-script
    reason: Near duplicate of final-vendor-curl-script-deferred; retained the final-audit risky external
      payload case.
  - id: nvidia-vendor-script-suggested-not-trusted
    reason: Near duplicate of final-vendor-curl-script-deferred; retained the final-audit risky external
      payload case.
  - id: drv4-amd-firmware-missing-after-reboot
    reason: Near duplicate of amd-missing-firmware-manual-followup; retained the direct AMD firmware failure
      case.
  - id: final-amd-firmware-missing-nonfatal
    reason: Near duplicate of amd-missing-firmware-manual-followup; retained one deterministic AMD firmware
      manual-followup case.
  - id: secureboot-nouveau-conflict-after-driver-install
    reason: Near duplicate of nvidia-nouveau-bound-after-proprietary-install and final-nouveau-conflict-after-proprietary-install;
      retained non-Secure-Boot and final-audit conflict variants.
  coverage_gaps:
  - No real hardware certification is claimed; all scenarios require fake facts/executor/model plumbing.
  - AMD firmware presence is modeled as a scenario fact even though current SetupFacts has no first-class
    firmware field.
  - Hybrid PRIME/offload verification is represented as uncertainty; exact runtime probes remain a later
    test-design decision.
  notes: 'Driver status expectations are evidence-based: package success is not real hardware certification
    without refreshed module/runtime facts.'
scenarios:
- id: nvidia-unknown-generation-arch-open-unverified
  category: nvidia
  facts_profile:
    gpu_vendors:
    - nvidia
    gpu_models:
    - NVIDIA Corporation Device 28ff
    secure_boot: disabled
    is_vm: false
    has_gui_session: true
    kernel_module_loaded: unknown
    nouveau_loaded: unknown
    nvidia_driver_installed: unknown
    amd_firmware_present: unknown
    package_manager: pacman
  driver_strategy:
    requested: true
    source: repo
    packages:
    - nvidia-open
    - nvidia-utils
    - linux-headers
    confidence: low
    notes: PCI ID is NVIDIA but generation is unknown, so open kernel module suitability is not proven.
  simulated_events:
  - type: command_success
    detail: Repo NVIDIA packages appear to install cleanly.
    rc: 0
    stdout: installed nvidia-open nvidia-utils
    stderr: ''
  - type: facts_refresh
    detail: Refreshed facts still do not prove nvidia_smi or the loaded kernel module.
    rc: 0
    stdout: nvidia_smi_state=unknown nvidia_kernel_driver=unknown
    stderr: ''
  expected:
    driver_status: installed_unverified
    final_status_effect: manual_followup_required
    should_reboot_verify: true
    should_continue_unrelated_setup: true
  rationale: Unknown NVIDIA generation may be repairable, but command success alone must not certify the
    driver.
  source_agents:
  - driver-agent-1-nvidia
