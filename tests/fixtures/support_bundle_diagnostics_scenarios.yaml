# Curated support-bundle/runlog diagnostics scenario corpus.
#
# This fixture models the evidence QuickHatch support bundles should expose
# for non-perfect outcomes. Tests must synthesize runlog events and inspect
# generated bundles only; do not execute commands from this file.
merge_summary:
  source: Merged from .quickhatch/corpus-candidates/support-bundle-agent-*.yaml
  total_source_candidates: 93
  total_scenarios: 93
  source_files:
  - .quickhatch/corpus-candidates/support-bundle-agent-1-blocked-core.yaml
  - .quickhatch/corpus-candidates/support-bundle-agent-2-followups-warnings.yaml
  - .quickhatch/corpus-candidates/support-bundle-agent-3-provider-repair.yaml
  - .quickhatch/corpus-candidates/support-bundle-agent-4-redaction-readme.yaml
  - .quickhatch/corpus-candidates/support-bundle-agent-5-final-status-replay.yaml
  scenarios_by_category:
    app_theme_driver_followup: 6
    artifact_manifest: 4
    blocked_run: 4
    capability_mismatch: 5
    desktop_no_session: 3
    executed_commands_redaction: 4
    final_audit_findings: 4
    final_audit_repair_failure: 6
    final_audit_repair_manual_followup: 2
    final_status_serialization: 5
    manual_followup_required: 3
    model_error: 1
    package_db_corruption: 3
    preflight_block: 3
    profile_facts_minimization: 2
    provider_error: 4
    reconnect_failure: 3
    redaction: 5
    repair_loop_exhaustion: 7
    replay_summary: 2
    status_summary_agreement: 4
    success_with_warnings: 4
    support_readme: 3
    support_summary: 2
    unsupported_safe: 4
  statuses:
    blocked: 27
    manual_followup_required: 24
    success_with_warnings: 17
    unknown: 18
    unsupported_safe: 7
  expected_artifacts_mentioned:
    README.txt: 4
    app-verification.json: 5
    capability-events.json: 6
    dangerous-operation-previews.json: 5
    executed-commands.sh: 5
    final-audit.json: 53
    manifest.json: 6
    manual-followups.json: 21
    preflight-events.json: 11
    profile-summary.json: 2
    replay-summary.json: 34
    setup-facts-summary.json: 7
    setup-runlog-redacted.jsonl: 65
