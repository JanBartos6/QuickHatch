  omitted_duplicate_cases: []
  coverage_gaps:
  - This fixture models expected support-bundle and runlog evidence only; commands and events are representative and must
    not be executed.
  - Some current_likely_gap values are candidate-agent hypotheses and should be verified by focused tests before runtime changes.
  - The fixture intentionally includes pre-final-audit blocked runs where the current support-summary final_status may be
    unknown without a terminal run event.
  - Capability mismatch, provider-error category, repair-exhaustion summary, and README discoverability cases may require
    new diagnostic extraction tests before implementation.
  notes: Support-bundle diagnostics scenarios are fixture data for local tests using synthetic runlog events only.
scenarios:
- id: blocked-before-final-audit-safe-abort
  category: blocked_run
  status: unknown
  representative_runlog_events:
  - event_type: setup_started
    payload:
      profile:
        install_profile: full_disk_wipe
        remote_setup_mode: ssh
  - event_type: dangerous_operation_preview
    payload:
      stage: install_or_skip
      group_id: disk-format
      preview:
        preview_id: prev-format-sda1
        operation:
          kind: format_partition
          target: /dev/sda1
        confirmation_token: FORMAT-/dev/sda1
  - event_type: blocking_question_timeout
    payload:
      stage: install_or_skip
      question_id: confirm-format-sda1
  - event_type: safe_abort
    payload:
      stage: install_or_skip
      group_id: disk-format
      reason: Dangerous operation was not confirmed with the required token.
  expected_bundle_artifacts:
  - setup-runlog-redacted.jsonl
  - support-summary.json
  - replay-summary.json
  - dangerous-operation-previews.json
  required_evidence:
  - final status is unknown or blocked because no final_audit was reached
  - safe_abort reason
  - blocking question timeout id
  - dangerous preview id, operation kind, target, and confirmation token redacted if needed
  redaction_expectations:
  - confirmation token should not be exposed as a reusable secret if future tokens become secret-bearing
  - sk-blocked-core-secret
  current_likely_gap: early safe_abort has no terminal setup_run_finished event, so support-summary final_status may remain
    unknown
  rationale: A user needs enough evidence to distinguish an intentional safety stop from a crash when a destructive confirmation
    is not completed.
  risk: high
  source_agents:
  - support-bundle-agent-1-blocked-core
- id: blocked-final-audit-missing-bootloader
  category: blocked_run
  status: blocked
  representative_runlog_events:
  - event_type: final_audit
    payload:
      result:
        passed: false
        final_status: blocked
        blockers:
        - Installed system bootloader was not verified.
        findings:
        - id: bootloader:missing
          severity: fatal
          category: bootability
          summary: Bootloader is missing or unverified.
          required_capability_kinds:
          - bootloader_install
        details:
          pre_reboot_checks_passed: false
  expected_bundle_artifacts:
  - final-audit.json
  - support-summary.json
  - replay-summary.json
  required_evidence:
  - final status blocked
  - fatal audit finding category bootability
  - blocker text
  - required capability kind bootloader_install
  redaction_expectations:
  - root_pw=blocked-final-audit-secret
  current_likely_gap: none
  rationale: A missing bootloader is a core fatal condition and the bundle should make the blocker obvious without requiring
    runlog archaeology.
  risk: high
  source_agents:
  - support-bundle-agent-1-blocked-core
- id: preflight-block-fstab-write-without-capability
