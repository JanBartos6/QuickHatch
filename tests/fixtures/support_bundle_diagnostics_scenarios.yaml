  - group id and human-readable group title
  redaction_expectations:
  - UUID should remain if not sensitive, but passwords in adjacent shell should redact
  - password=topsecret-fstab
  current_likely_gap: preflight event has group_id but not the group title; the title is only recoverable from command_group_started
  rationale: Fstab writes are dangerous but repairable with explicit authority; the bundle should identify both the command
