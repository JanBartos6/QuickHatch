# Curated reboot/reconnect orchestration scenario corpus.
#
# This fixture models reboot ownership, pre-reboot gates, checkpoint/resume
# continuity, reconnect behavior, postboot fact refresh, configure-existing
# reboot boundaries, and final-status honesty. Use fake runtimes/facts only;
# do not execute commands from this file.
merge_summary:
  source: Merged from .quickhatch/corpus-candidates/reboot-agent-*.yaml
  total_source_candidates: 60
  total_scenarios: 55
  scenarios_by_category:
    checkpoint: 11
    configure_existing: 8
    driver_reboot: 5
    final_audit: 4
    live_iso: 2
    postboot_facts: 5
    pre_reboot_gate: 11
    reconnect_failure: 5
    reconnect_success: 4
  scenarios_by_mode:
    configure_existing: 12
    fresh_install: 40
    postboot_setup: 3
  expected_outcomes:
    should_reboot:
      'false': 27
      'true': 28
    should_checkpoint_before_reboot:
      'false': 27
      'true': 28
    should_resume:
      'false': 27
      'true': 28
    final_status_effects:
      blocked: 27
      manual_followup_required: 7
      none: 20
      success_with_warnings: 1
  rejected_ambiguous_cases:
  - id: checkpoint-runlog-only-gap-manual-review
    reason: 'Ambiguous current-policy boundary: runlog evidence may be insufficient for automatic resume, but the exact checkpoint
      contract needs policy review before becoming a deterministic test case.'
  omitted_near_duplicate_cases:
  - id: postboot-target-mismatch-blocks-final
    reason: Near duplicate of reconnect-wrong-target-blocks; retained the reconnect-lane target mismatch case as the canonical
      safety boundary.
  - id: postboot-desktop-deferred-while-live
    reason: Near duplicate of postboot-apps-deferred-while-live; retained one live-facts postboot-stage deferral case plus
      final-audit live coverage.
  - id: postboot-final-audit-clean-success
    reason: Near duplicate positive control of postboot-kernel-artifacts-verified-success; retained the artifact-verified
      success case.
  - id: reconnect-network-delayed-then-ready
    reason: Near duplicate of reconnect-refused-then-success and reconnect-timeouts-then-success; retained separate refused
      and timeout sequence coverage.
  coverage_gaps:
  - No real reboot, VM, Docker, SSH, or shell execution is represented; tests must use fake runtimes and facts.
  - Durable checkpoint/resume storage is represented as expected policy, but exact implementation hooks may need a focused
    test harness.
  - Same-target verification is modeled as a boolean scenario fact; later tests should decide which local facts prove target
    continuity.
  - Configure-existing reboot severity has both warning and manual-followup variants; tests should bind each to explicit context.
  notes: This fixture models reboot/reconnect orchestration policy. Commands are representative strings only and must not
    be executed.
scenarios:
- id: preflight-all-clear-harness-reboot
