coverage_gaps:
- No runtime oracle exists yet for consuming this fixture.
- Uninstall/remove partial-success behavior is not represented.
- Service enablement failures and driver-package postboot verification are only indirectly represented.
- Alternative-app identity mapping will need explicit harness assertions before it is fully covered.
