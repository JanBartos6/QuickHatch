  source: Merged from .quickhatch/corpus-candidates/app-partial-agent-*.yaml
  total_scenarios: 40
  scenarios_by_category:
    alternative_app: 3
    facts_refresh: 4
    final_audit: 4
    multi_app_partial: 8
    provider_repair_failure: 6
    repair_loop: 3
    required_optional: 5
    source_fallback: 7
  final_statuses:
    manual_followup_required: 10
    success: 9
    success_with_warnings: 21
  invariants_covered:
    failure_isolated: 27
    final_status_honest: 40
