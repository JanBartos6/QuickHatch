# Curated final-audit repair-loop scenario corpus.
#
# This fixture models final audit repair policy, bounded focused repairs,
# fatal finding dominance, non-fatal app/desktop follow-up, unsupported-safe
# outcomes, and final-summary honesty. Use fake audit/repair/executor/facts
# plumbing only; do not execute commands from this file.
merge_summary:
  source: Merged from .quickhatch/corpus-candidates/final-audit-agent-*.yaml
  total_source_candidates: 76
  total_scenarios: 76
  scenarios_by_category:
    app_followup: 9
    desktop_followup: 9
    failed_repair: 19
    fatal_core: 15
    repairable: 9
    summary_status: 12
    unsupported_safe: 3
  final_statuses:
    blocked: 22
    manual_followup_required: 26
    success: 11
    success_with_warnings: 13
    unsupported_safe: 4
  repair_outcomes:
    capability_required: 12
    failure: 8
    not_attempted: 30
    preflight_block: 3
    provider_error: 6
    success: 17
  rejected_ambiguous_cases: []
  omitted_near_duplicate_cases: []
  coverage_gaps:
  - No real SSH, package manager, VM, reboot, or shell execution is represented; tests must use fake audit, repair, executor,
    and facts plumbing.
  - Capability kind names are scenario labels from candidate generation and may need mapping to existing QuickHatch capability
    constants during test implementation.
  - Representative repair commands are intentionally not authoritative install recipes; they model risk boundaries and final-status
    truthfulness.
  - The fixture covers final-audit repair policy, but does not yet assert exact support-bundle/runlog serialization fields.
  notes: Final-audit repair scenarios are policy fixtures only. Representative commands in this file must not be executed
    against the host.
scenarios:
- id: missing-root-fstab
  category: fatal_core
  initial_findings:
  - id: fstab-root-missing
    severity: fatal
    category: fstab
    summary: /etc/fstab has no root filesystem entry, so the installed system may not mount its root volume on boot.
    required_capability_kinds:
    - filesystem_read
    - block_device_inspection
  repair_plan:
    available: false
    command_groups: []
  repair_result:
    outcome: not_attempted
    remaining_findings:
    - severity: fatal
      category: fstab
      summary: Root filesystem entry is still missing from /etc/fstab.
  expected:
    should_attempt_repair: false
    repair_attempts_max: 0
    final_status: blocked
    summary_must_include:
    - root filesystem entry is missing
    - blocked
    summary_must_not_claim:
    - fstab repaired
    - system is bootable
  rationale: A missing root mount is a core boot blocker. Guessing the correct device or UUID is unsafe without explicit validated
    disk mapping.
- id: stale-root-uuid
  category: fatal_core
  initial_findings:
  - id: fstab-root-uuid-not-found
    severity: fatal
    category: fstab
    summary: /etc/fstab references a root UUID that is not present in blkid output.
    required_capability_kinds:
    - filesystem_read
    - block_device_inspection
  repair_plan:
    available: true
    command_groups:
    - title: Verify candidate root volume
      commands:
      - blkid
      - findmnt --target /mnt
      - lsblk -f
      required_capability_kinds:
      - block_device_inspection
    - title: Rewrite fstab only after verified mapping
      commands:
      - mount /dev/disk/by-uuid/<verified-root-uuid> /mnt
      - sed -i 's/UUID=<stale>/UUID=<verified-root-uuid>/' /mnt/etc/fstab
      required_capability_kinds:
      - filesystem_write
      - mount
  repair_result:
    outcome: capability_required
    remaining_findings:
    - severity: fatal
      category: fstab
      summary: Root UUID remains stale because filesystem write and mount capability were unavailable.
  expected:
    should_attempt_repair: false
    repair_attempts_max: 0
    final_status: blocked
    summary_must_include:
    - root UUID is not present
    - requires verified disk mapping
    summary_must_not_claim:
    - UUID corrected
    - repair completed
  rationale: The repair can be safe only with block-device verification and write access to the installed system.
- id: malformed-fstab
  category: fatal_core
  initial_findings:
  - id: fstab-parse-fails
    severity: fatal
    category: fstab
    summary: /etc/fstab contains malformed fields that make systemd-fstab-generator fail.
    required_capability_kinds:
    - filesystem_read
  repair_plan:
    available: false
    command_groups: []
  repair_result:
    outcome: not_attempted
    remaining_findings:
    - severity: fatal
