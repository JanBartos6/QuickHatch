    command_groups:
    - title: Regenerate initramfs
      commands:
      - mount /dev/<root> /mnt
      - mount /dev/<boot> /mnt/boot
      - arch-chroot /mnt mkinitcpio -P
      required_capability_kinds:
      - mount
      - chroot
      - boot_file_write
  repair_result:
    outcome: capability_required
    remaining_findings:
    - severity: fatal
      category: bootability
      summary: initramfs is still missing because target chroot/write capability was unavailable.
  expected:
    should_attempt_repair: false
    repair_attempts_max: 0
    final_status: blocked
    summary_must_include:
    - initramfs image is missing
    - blocked
    summary_must_not_claim:
    - initramfs regenerated
    - bootability restored
  rationale: Regenerating initramfs is repairable in principle, but not without safe access to the mounted target.
- id: grub-not-installed
  category: fatal_core
  initial_findings:
  - id: bootloader-grub-missing
    severity: fatal
    category: bootability
    summary: No installed bootloader was found in the EFI system partition or boot sector.
    required_capability_kinds:
    - filesystem_read
    - firmware_detection
    - block_device_inspection
  repair_plan:
    available: true
    command_groups:
    - title: Install bootloader after firmware and ESP verification
      commands:
      - mount /dev/<root> /mnt
      - mount /dev/<esp> /mnt/boot
      - arch-chroot /mnt grub-install --target=x86_64-efi --efi-directory=/boot --bootloader-id=QuickHatch
      - arch-chroot /mnt grub-mkconfig -o /boot/grub/grub.cfg
      required_capability_kinds:
      - mount
      - chroot
      - bootloader_install
      - firmware_detection
  repair_result:
    outcome: capability_required
    remaining_findings:
    - severity: fatal
      category: bootability
      summary: Bootloader remains absent because bootloader install capability was unavailable.
  expected:
    should_attempt_repair: false
    repair_attempts_max: 0
    final_status: blocked
    summary_must_include:
    - bootloader was not found
    - requires bootloader install capability
    summary_must_not_claim:
    - GRUB installed
    - EFI boot entry created
  rationale: Bootloader installation is too invasive to infer or simulate without explicit capability and target verification.
- id: broken-efi-mount
  category: fatal_core
  initial_findings:
  - id: esp-not-mounted-installed-system
