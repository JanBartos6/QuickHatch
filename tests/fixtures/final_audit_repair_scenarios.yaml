    severity: fatal
    category: fstab
    summary: Root filesystem UUID in /etc/fstab does not match any discovered block device.
    required_capability_kinds:
    - root_shell
    - disk_inspection
  repair_plan:
    available: true
    command_groups:
    - title: Refresh root UUID in fstab
      commands:
      - blkid -s UUID -o value /dev/nvme0n1p2
      - cp /etc/fstab /etc/fstab.quickhatch.bak
      - sed -i 's/UUID=old-root/UUID=new-root/' /etc/fstab
      required_capability_kinds:
      - root_shell
      - disk_write
  repair_result:
    outcome: provider_error
    remaining_findings:
    - severity: fatal
      category: fstab
      summary: Root filesystem UUID remains unresolved because the repair provider failed before commands were produced.
  expected:
    should_attempt_repair: true
    repair_attempts_max: 1
    final_status: blocked
    summary_must_include:
    - provider error
    - root filesystem UUID still unresolved
    summary_must_not_claim:
    - fstab repaired
    - system is bootable
  rationale: A provider failure during a fatal fstab repair must leave the audit blocked, not infer success.
