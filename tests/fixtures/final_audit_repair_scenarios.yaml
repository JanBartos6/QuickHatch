    category: setup
    summary: A non-critical systemd oneshot unit is marked failed from a previous run, but its service goal is already satisfied.
    required_capability_kinds:
    - systemd
  repair_plan:
    available: true
    command_groups:
    - title: Clear stale unit state
      commands:
      - systemctl reset-failed quickhatch-postcheck.service
      - systemctl status quickhatch-postcheck.service --no-pager
      required_capability_kinds:
      - systemd
  repair_result:
    outcome: success
    remaining_findings: []
  expected:
    should_attempt_repair: true
    repair_attempts_max: 1
    final_status: success
    summary_must_include:
    - cleared stale non-critical unit state
    summary_must_not_claim:
    - restarted core services
  rationale: Resetting failed state is bounded when evidence shows the failed unit is non-critical and stale.
