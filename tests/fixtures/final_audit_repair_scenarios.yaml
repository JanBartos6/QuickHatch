    - efi_access
  repair_plan:
    available: true
    command_groups:
    - title: Recreate EFI boot entry
      commands:
      - efibootmgr --create --disk /dev/nvme0n1 --part 1 --label QuickHatch --loader '\\EFI\\systemd\\systemd-bootx64.efi'
      required_capability_kinds:
      - root_shell
      - efi_write
  repair_result:
    outcome: provider_error
    remaining_findings:
    - severity: fatal
      category: bootability
      summary: Repair loop exhausted invalid JSON responses while trying to generate EFI repair commands.
  expected:
    should_attempt_repair: true
    repair_attempts_max: 3
    final_status: blocked
    summary_must_include:
    - invalid repair response
    - EFI boot entry still missing
    summary_must_not_claim:
    - boot entry recreated
    - repair completed
  rationale: Repeated malformed repair output must be bounded and reported as failure with the original fatal finding intact.
- id: pacman-lock-fail
  category: failed_repair
  initial_findings:
  - id: package-db-incomplete
    severity: repairable
    category: package_db
    summary: Package database transaction appears interrupted and requires recovery.
    required_capability_kinds:
    - root_shell
    - package_manager
  repair_plan:
    available: true
    command_groups:
    - title: Recover package database
      commands:
      - rm -f /var/lib/pacman/db.lck
      - pacman -Syu --noconfirm
      required_capability_kinds:
      - root_shell
      - package_manager
      - network
  repair_result:
    outcome: failure
    remaining_findings:
    - severity: repairable
      category: package_db
      summary: Package manager repair failed because the package database remained locked by an active process.
  expected:
    should_attempt_repair: true
    repair_attempts_max: 1
    final_status: manual_followup_required
    summary_must_include:
    - package database still locked
    - manual follow-up required
    summary_must_not_claim:
    - package database recovered
    - updates completed
  rationale: A command failure on a non-fatal package issue should stop short of success and preserve the actionable finding.
- id: preflight-readonly-root
  category: failed_repair
  initial_findings:
  - id: ssh-key-missing
    severity: repairable
    category: ssh_reconnect
    summary: SSH authorized_keys is missing for the configured reconnect user.
    required_capability_kinds:
    - root_shell
    - ssh_config_write
  repair_plan:
    available: true
    command_groups:
    - title: Install reconnect key
      commands:
      - install -d -m 700 /home/alex/.ssh
      - printf '%s\n' 'ssh-ed25519 AAAA...' >> /home/alex/.ssh/authorized_keys
      - chown -R alex:alex /home/alex/.ssh
      required_capability_kinds:
      - root_shell
      - filesystem_write
  repair_result:
    outcome: preflight_block
    remaining_findings:
    - severity: repairable
      category: ssh_reconnect
      summary: SSH key repair was not attempted because the target root filesystem is mounted read-only.
  expected:
    should_attempt_repair: true
    repair_attempts_max: 0
    final_status: manual_followup_required
    summary_must_include:
    - preflight blocked
    - read-only filesystem
    summary_must_not_claim:
    - authorized_keys updated
    - SSH reconnect fixed
  rationale: Preflight must prevent writes on read-only targets and report the repair as not performed.
- id: cap-required-chroot
  category: failed_repair
