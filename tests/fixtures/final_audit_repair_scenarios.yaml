    - filesystem_read
  repair_plan:
    available: true
    command_groups:
    - title: Complete or roll forward transaction
      commands:
      - arch-chroot /mnt pacman -Syu
      - arch-chroot /mnt pacman -Qkk filesystem linux systemd
      required_capability_kinds:
      - chroot
      - package_install
      - network_access
  repair_result:
    outcome: capability_required
    remaining_findings:
    - severity: fatal
      category: package_db
