    summary_must_not_claim:
    - initramfs rebuilt
    - bootability repaired
  rationale: Capability gating must keep fatal boot repairs from pretending to run when the environment cannot support them.
- id: bounded-ssh-retry
  category: failed_repair
  initial_findings:
  - id: sshd-disabled
