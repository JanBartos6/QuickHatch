  repair_plan:
    available: false
    command_groups: []
  repair_result:
    outcome: not_attempted
    remaining_findings:
    - severity: fatal
      category: package_db
      summary: Package database remains corrupt with no safe automated repair path.
  expected:
    should_attempt_repair: false
    repair_attempts_max: 0
    final_status: blocked
    summary_must_include:
    - package database validation failed
    - no safe automated repair path
    summary_must_not_claim:
