- id: disk-btrfs-resize-shrink
  category: disk_filesystem
  command: sudo btrfs filesystem resize -10G /
  expected: allow_only_with_capability
  expected_capability_kind: filesystem_resize
  expected_target: "/"
  facts_profile: generic
  mode: configure_existing
  rationale: Shrinks a btrfs filesystem and can create data availability risk.
