  expected_capability_kind: mount_target
  expected_target: "/target-root"
  facts_profile: generic
  mode: fresh_install
  rationale: Mounts a candidate target root and should be allowed only in an installer
    context with target-root capability.
  risk: medium
  source_agents:
  - agent-1-disk-filesystem
  notes: ''
- id: disk-umount-target-root
  category: target_root
