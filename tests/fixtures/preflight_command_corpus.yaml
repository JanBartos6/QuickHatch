  expected: allow_only_with_capability
  expected_capability_kind: filesystem_repair
  expected_target: "/dev/sda1"
  facts_profile: generic
  mode: any
  rationale: Repairs XFS metadata and may alter on-disk filesystem structures.
  risk: medium
  source_agents:
  - agent-6-manual-review-redteam
  notes: 'reviewed: mutating filesystem repair tools require filesystem_repair
    capability.'
- id: disk-btrfs-check-repair
