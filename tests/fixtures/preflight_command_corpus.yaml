  expected_capability_kind: disk_wipe
  expected_target: "/dev/sda"
  facts_profile: generic
  mode: any
  rationale: Writes zeros directly to the disk and destroys partition data.
  risk: high
  source_agents:
  - agent-1-disk-filesystem
  notes: ''
- id: disk-dd-random-partition
  category: disk_filesystem
