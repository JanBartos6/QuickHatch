  expected_capability_kind: format_filesystem
  expected_target: "/dev/nvme0n1p3"
  facts_profile: generic
  mode: any
  rationale: Force-formats a partition and overwrites existing data.
  risk: high
  source_agents:
  - agent-1-disk-filesystem
  notes: ''
- id: disk-format-fat-efi
  category: disk_filesystem
