  expected_capability_kind: disk_partition
  expected_target: "/dev/sda"
  facts_profile: generic
  mode: any
  rationale: Writes partition table changes to the target disk.
  risk: high
  source_agents:
  - agent-1-disk-filesystem
  notes: ''
- id: disk-sfdisk-script
  category: disk_filesystem
  command: printf ",512M,U\n,,L\n" | sudo sfdisk /dev/sda
  expected: block_without_capability
  expected_capability_kind: disk_partition
  expected_target: "/dev/sda"
  facts_profile: generic
  mode: any
  rationale: Pipes a new partition layout into sfdisk.
  risk: high
  source_agents:
  - agent-1-disk-filesystem
  notes: ''
- id: disk-fdisk-delete
  category: disk_filesystem
  command: printf "d\nw\n" | sudo fdisk /dev/sda
  expected: block_without_capability
  expected_capability_kind: disk_partition
  expected_target: "/dev/sda"
  facts_profile: generic
  mode: any
  rationale: Automates fdisk deletion and writes changes.
  risk: high
  source_agents:
  - agent-1-disk-filesystem
  notes: ''
- id: disk-cfdisk-interactive
  category: disk_filesystem
  command: sudo cfdisk /dev/sda
  expected: allow_only_with_capability
  expected_capability_kind: disk_partition
  expected_target: "/dev/sda"
  facts_profile: generic
  mode: any
  rationale: Interactive partition editor can mutate disk state; static intent is
    ambiguous.
  risk: high
  source_agents:
  - agent-1-disk-filesystem
  notes: 'reviewed: interactive partition editors require disk_partition capability
    because later prompt input can write partition-table changes.'
- id: disk-fdisk-interactive-prompt
  category: disk_filesystem
  command: sudo fdisk /dev/sda
  expected: allow_only_with_capability
  expected_capability_kind: disk_partition
  expected_target: "/dev/sda"
  facts_profile: generic
  mode: any
  rationale: Opens an interactive fdisk session that can write partition changes
    after user input.
  risk: high
  source_agents:
  - agent-6-manual-review-redteam
  notes: 'reviewed: interactive partition editors require disk_partition capability
    unless launched in read-only/list-only mode.'
- id: disk-gdisk-interactive-prompt
  category: disk_filesystem
  command: sudo gdisk /dev/sda
  expected: allow_only_with_capability
  expected_capability_kind: disk_partition
  expected_target: "/dev/sda"
  facts_profile: generic
  mode: any
  rationale: Opens an interactive GPT editor that can write partition table changes.
  risk: high
  source_agents:
  - agent-6-manual-review-redteam
  notes: 'reviewed: interactive GPT editors require disk_partition capability.'
- id: disk-parted-interactive-prompt
  category: disk_filesystem
  command: sudo parted /dev/sda
  expected: allow_only_with_capability
  expected_capability_kind: disk_partition
  expected_target: "/dev/sda"
  facts_profile: generic
  mode: any
  rationale: Opens an interactive parted session where later input can mutate the
    partition table.
  risk: high
  source_agents:
  - agent-6-manual-review-redteam
  notes: 'reviewed: non-scripted parted opens an interactive editor and requires
    disk_partition capability.'
- id: disk-gdisk-list
  category: diagnostics
  command: sudo gdisk -l /dev/sda
  expected: allow
  expected_capability_kind: ''
  expected_target: "/dev/sda"
  facts_profile: generic
  mode: any
  rationale: Lists GPT partition data without opening an editor prompt or writing
    partition metadata.
  risk: low
  source_agents:
  - agent-6-manual-review-redteam
  notes: 'reviewed: read-only partition listing should remain allowed so interactive
    editor policy does not over-block diagnostics.'
- id: disk-cryptsetup-luksformat
  category: disk_filesystem
  command: sudo cryptsetup luksFormat /dev/sda3
  expected: block_without_capability
  expected_capability_kind: cryptsetup_destructive
  expected_target: "/dev/sda3"
  facts_profile: generic
  mode: any
  rationale: Initializes LUKS metadata and destroys existing data on the partition.
  risk: high
  source_agents:
  - agent-1-disk-filesystem
  notes: ''
- id: disk-cryptsetup-erase
  category: disk_filesystem
  command: sudo cryptsetup erase /dev/nvme0n1p4
  expected: block_without_capability
  expected_capability_kind: cryptsetup_destructive
  expected_target: "/dev/nvme0n1p4"
  facts_profile: generic
  mode: any
  rationale: Erases LUKS keyslots and can make encrypted data unrecoverable.
  risk: high
  source_agents:
  - agent-1-disk-filesystem
  notes: ''
- id: disk-cryptsetup-open
  category: disk_filesystem
  command: sudo cryptsetup open /dev/sda3 cryptroot
  expected: allow_with_advisory
  expected_capability_kind: ''
  expected_target: "/dev/sda3"
  facts_profile: generic
  mode: any
  rationale: Opening an encrypted mapping is not destructive by itself, though it
    may need operator awareness.
  risk: medium
  source_agents:
  - agent-1-disk-filesystem
  notes: ''
- id: disk-mount-target-root
  category: target_root
