  command: sudo zpool status tank
  expected: allow
  expected_capability_kind: ''
  expected_target: tank
  facts_profile: generic
  mode: any
  rationale: Reads ZFS pool status without changing topology or data.
  risk: low
  source_agents:
  - agent-6-manual-review-redteam
  notes: 'reviewed: storage topology policy should not block read-only pool status.'
- id: disk-zpool-destroy
  category: disk_filesystem
  command: sudo zpool destroy tank
  expected: block_without_capability
  expected_capability_kind: disk_wipe
  expected_target: tank
  facts_profile: generic
  mode: any
  rationale: Destroys a storage pool and makes contained filesystems unavailable.
  risk: high
  source_agents:
  - agent-1-disk-filesystem
  notes: ''
- id: boot-fstab-tee-replace
