  mode: any
  rationale: Creates a new filesystem and may erase an existing EFI partition.
  risk: high
  source_agents:
  - agent-1-disk-filesystem
  notes: ''
- id: disk-mkswap-partition
  category: disk_filesystem
  command: sudo mkswap /dev/sdb3
