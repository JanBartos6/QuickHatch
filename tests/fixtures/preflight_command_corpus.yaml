  expected: allow_only_with_capability
  expected_capability_kind: mount_target
  expected_target: "/target-root"
  facts_profile: generic
  mode: any
  rationale: Unmounting target-root can disrupt an installation or audit sequence.
  risk: medium
  source_agents:
  - agent-1-disk-filesystem
  notes: 'reviewed: target-root unmount changes installer mount state and is covered
    by the existing mount_target capability.'
- id: disk-rm-target-root
  category: target_root
  command: sudo rm -rf /target-root/*
