  expected_capability_kind: storage_topology_change
  expected_target: "/dev/sdb1"
  facts_profile: generic
  mode: any
  rationale: Mutates btrfs device membership and can affect data availability.
  risk: high
  source_agents:
  - agent-1-disk-filesystem
  notes: 'reviewed: btrfs device removal changes filesystem topology and requires
    storage_topology_change capability.'
- id: disk-btrfs-device-add
