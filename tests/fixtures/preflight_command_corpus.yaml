cases:
- id: disk-format-root-ext4
  category: disk_filesystem
  command: sudo mkfs.ext4 /dev/sda1
  expected: block_without_capability
  expected_capability_kind: format_filesystem
  expected_target: "/dev/sda1"
  facts_profile: generic
  mode: any
  rationale: Formats a block device and destroys the existing filesystem.
  risk: high
  source_agents:
  - agent-1-disk-filesystem
  notes: ''
- id: disk-format-force-xfs
  category: disk_filesystem
  command: mkfs.xfs -f /dev/nvme0n1p3
