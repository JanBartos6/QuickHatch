- id: identical-install-bootstrap-third-failure-blocks
  category: identical_loop
  stage: install_or_skip
  app_or_target: "/mnt"
  initial_failure:
    command: "pacstrap -K /mnt base linux linux-firmware"
    failure_type: command
    stdout: "==> Creating install root at /mnt"
    stderr: "error: failed retrieving file 'core.db' from mirror"
  repair_sequence:
    - action: retry_command
      command: "pacstrap -K /mnt base linux linux-firmware"
      strategy: same
      result: failure
    - action: retry_command
      command: "pacstrap -K /mnt base linux linux-firmware"
      strategy: same
      result: failure
  expected:
    loop_detected: true
    budget_consumed_count: 2
    final_group_status: blocked
    final_status_effect: blocked
  rationale: "Fresh-install bootstrap is a critical stage; repeated identical failure should block instead of becoming a soft app-style follow-up."

- id: identical-install-preflight-capability-denial
  category: identical_loop
  stage: install_or_skip
  app_or_target: "/dev/sda"
  initial_failure:
    command: "parted /dev/sda mklabel gpt"
    failure_type: preflight
    stdout: ""
    stderr: "blocked: disk_partition capability required for /dev/sda"
  repair_sequence:
    - action: retry_command
      command: "parted /dev/sda mklabel gpt"
      strategy: same
      result: failure
    - action: retry_command
      command: "parted /dev/sda mklabel gpt"
      strategy: same
      result: failure
  expected:
    loop_detected: true
    budget_consumed_count: 2
    final_group_status: blocked
    final_status_effect: blocked
  rationale: "Capability-gated install mutations must not be repaired by retrying the same denied command."

- id: identical-diagnostic-status-budget-edge
  category: diagnostics_budget
  stage: apps
  app_or_target: "ssh service diagnostic"
  initial_failure:
    command: "systemctl status sshd --no-pager"
    failure_type: command
    stdout: ""
    stderr: "Unit sshd.service could not be found."
  repair_sequence:
    - action: diagnostic
      command: "systemctl status sshd --no-pager"
      strategy: diagnostic
      result: failure
    - action: diagnostic
      command: "systemctl status sshd --no-pager"
      strategy: diagnostic
      result: failure
    - action: diagnostic
      command: "systemctl status sshd --no-pager"
      strategy: diagnostic
      result: failure
  expected:
    loop_detected: false
    budget_consumed_count: 1
    final_group_status: manual_followup
    final_status_effect: success_with_warnings
  rationale: "Repeated read-only diagnostics should not trigger the same hard loop detector at the third failure, but should eventually consume budget and stop."

- id: identical-final-audit-recheck-budget-only
  category: diagnostics_budget
  stage: final_audit
  app_or_target: "required app verification"
  initial_failure:
    command: "verify app: code"
    failure_type: audit
    stdout: "missing: code"
    stderr: ""
  repair_sequence:
    - action: retry_command
      command: "verify app: code"
      strategy: same
      result: failure
    - action: retry_command
      command: "verify app: code"
      strategy: same
      result: failure
  expected:
    loop_detected: false
    budget_consumed_count: 2
    final_group_status: manual_followup
    final_status_effect: manual_followup_required
  rationale: "Final audit repair is budget-driven rather than command attempt-signature driven; unresolved required verification must remain honest."
