- id: identical-app-repo-package-third-failure
  category: identical_loop
  stage: apps
  app_or_target: "Obsidian"
  initial_failure:
    command: "sudo apt-get install -y obsidian"
    failure_type: command
    stdout: "Reading package lists... Done"
    stderr: "E: Unable to locate package obsidian"
  repair_sequence:
    - action: retry_command
      command: "sudo apt-get install -y obsidian"
      strategy: same
      result: failure
    - action: retry_command
      command: "sudo apt-get install -y obsidian"
      strategy: same
      result: failure
  expected:
    loop_detected: true
    budget_consumed_count: 2
    final_group_status: manual_followup
    final_status_effect: success_with_warnings
  rationale: "An optional app retried with the identical package command and identical missing-package failure should stop as manual follow-up instead of looping."

- id: identical-app-required-third-failure
  category: identical_loop
  stage: apps
  app_or_target: "Company VPN Client"
  initial_failure:
    command: "sudo dnf install -y company-vpn-client"
    failure_type: command
    stdout: "No match for argument: company-vpn-client"
    stderr: "Error: Unable to find a match: company-vpn-client"
  repair_sequence:
    - action: retry_command
      command: "sudo dnf install -y company-vpn-client"
      strategy: same
      result: failure
    - action: retry_command
      command: "sudo dnf install -y company-vpn-client"
      strategy: same
      result: failure
  expected:
    loop_detected: true
    budget_consumed_count: 2
    final_group_status: manual_followup
    final_status_effect: manual_followup_required
  rationale: "A required unresolved app should not be hidden as success, but repeated identical install attempts should resolve to app-specific manual follow-up rather than endless repair."

