- id: gnome-session-theme-icons-cursor-verified
  category: gnome
  facts_profile:
    desktop: gnome
    has_gui_session: true
    display: ":0"
    wayland: true
    target_user: "quickhatch"
    target_home: "/home/quickhatch"
  request:
    theme: "Adwaita-dark"
    icons: "Papirus-Dark"
    cursor: "Bibata-Modern-Ice"
    wallpaper: ""
    effects: []
  command_group:
    stage: desktop
    commands:
      - "gsettings set org.gnome.desktop.interface gtk-theme 'Adwaita-dark'"
      - "gsettings set org.gnome.desktop.interface icon-theme 'Papirus-Dark'"
      - "gsettings set org.gnome.desktop.interface cursor-theme 'Bibata-Modern-Ice'"
  simulated_events:
    - type: command_success
      detail: "GNOME gsettings commands completed in target user GUI session."
    - type: facts_refresh
      detail: "GNOME design facts report requested theme, icons, and cursor."
    - type: verification
      detail: "Requested GNOME interface settings match observed facts."
  expected:
    design_state:
      theme: applied_and_verified
      icons: applied_and_verified
      cursor: applied_and_verified
      wallpaper: not_requested
      effects: not_requested
    group_status: completed
    final_status_effect: none
    should_execute_live_apply: true
    should_allow_persistent_config: true
  rationale: "GNOME design settings are applied through the target user's active GUI session and then verified from refreshed facts."

