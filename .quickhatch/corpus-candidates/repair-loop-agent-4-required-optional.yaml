- id: install-spine-pacstrap-required-blocks
  category: required_optional
  stage: install_or_skip
  app_or_target: "/mnt"
  initial_failure:
    command: "pacstrap -K /mnt base linux linux-firmware"
    failure_type: command
    stdout: "==> Creating install root at /mnt"
    stderr: "error: failed retrieving file 'core.db' from mirror"
  repair_sequence:
    - action: retry_command
      command: "pacstrap -K /mnt base linux linux-firmware"
      strategy: same
      result: failure
    - action: retry_command
      command: "pacstrap -K /mnt base linux linux-firmware"
      strategy: same
      result: failure
  expected:
    loop_detected: true
    budget_consumed_count: 2
    final_group_status: blocked
    final_status_effect: blocked
  rationale: "Fresh-install bootstrap is required install-spine work; repeated failure must block instead of becoming optional follow-up."

- id: install-spine-debootstrap-required-blocks
  category: required_optional
  stage: install_or_skip
  app_or_target: "/mnt"
  initial_failure:
    command: "debootstrap stable /mnt http://deb.debian.org/debian"
    failure_type: command
    stdout: "I: Retrieving InRelease"
    stderr: "E: Failed getting release file"
  repair_sequence:
    - action: retry_command
      command: "debootstrap stable /mnt http://deb.debian.org/debian"
      strategy: same
      result: failure
    - action: manual_followup
      command: ""
      strategy: same
      result: manual_followup
  expected:
    loop_detected: false
    budget_consumed_count: 1
    final_group_status: blocked
    final_status_effect: blocked
  rationale: "A failed required install-root bootstrap cannot be downgraded to a nonfatal app-style warning."

- id: install-spine-preflight-capability-denial-blocks
  category: required_optional
  stage: install_or_skip
  app_or_target: "/dev/sda"
  initial_failure:
    command: "mkfs.ext4 /dev/sda1"
    failure_type: preflight
    stdout: ""
    stderr: "blocked: format_filesystem capability required for /dev/sda1"
  repair_sequence:
    - action: retry_command
      command: "mkfs.ext4 /dev/sda1"
      strategy: same
      result: failure
    - action: manual_followup
      command: ""
      strategy: same
      result: manual_followup
  expected:
    loop_detected: false
    budget_consumed_count: 0
    final_group_status: blocked
    final_status_effect: blocked
  rationale: "Capability-gated disk formatting in the install spine must remain blocked without consent, regardless of repair-loop handling."
