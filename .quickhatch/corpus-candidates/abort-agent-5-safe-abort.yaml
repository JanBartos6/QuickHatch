- id: cap-mismatch-format-target-changed
  category: capability_mismatch
  mode: fresh_install
  stage: capability_check
  state_before:
    completed_groups:
      - disk_probe
    active_group: "Format selected root partition"
    pending_question: false
    reboot_planned: false
    destructive_capability_pending: true
    manual_followups: []
  event:
    type: capability_mismatch
    reason: "format_filesystem capability was granted for /dev/sda1 but command targets /dev/sdb1"
  expected:
    no_new_groups_started: true
    no_new_destructive_work: true
    no_reboot_started: true
    pending_question_cleared_or_marked: false
    logs_preserved: true
    support_bundle_explains_abort: true
    final_status: blocked
    summary_must_include:
      - "capability mismatch"
      - "/dev/sda1"
      - "/dev/sdb1"
    summary_must_not_claim:
      - "setup completed successfully"
      - "formatted target"
  rationale: "A destructive filesystem operation must not proceed when the exact capability target differs from the command target."

