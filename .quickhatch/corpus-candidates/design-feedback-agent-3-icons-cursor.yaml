- id: icons-kde-rc0-still-breeze
  category: icons
  desktop:
    environment: kde
    has_gui_session: true
    target_user: quickhatch
    target_home: /home/quickhatch
  request:
    theme: ""
    icons: Tela-circle
    cursor: ""
    wallpaper: ""
    effects: []
  facts_before:
    active_theme: Breeze
    active_icons: Breeze
    active_cursor: Breeze
    active_wallpaper: /usr/share/wallpapers/Next/contents/images/1920x1080.png
    effects: []
  attempted_commands:
    - "plasma-apply-icons Tela-circle"
  command_result:
    rc: 0
    stdout: "Icon theme set to Tela-circle"
    stderr: ""
  facts_after_attempt:
    active_theme: Breeze
    active_icons: Breeze
    active_cursor: Breeze
    active_wallpaper: /usr/share/wallpapers/Next/contents/images/1920x1080.png
    effects: []
  repair_result:
    action: none
    facts_after_repair:
      active_theme: Breeze
      active_icons: Breeze
      active_cursor: Breeze
      active_wallpaper: /usr/share/wallpapers/Next/contents/images/1920x1080.png
      effects: []
  expected:
    element_status:
      theme: not_requested
      icons: failed_to_apply
      cursor: not_requested
      wallpaper: not_requested
      effects: not_requested
    final_status_effect: manual_followup_required
  rationale: "Stdout claims success, but refreshed icon facts still show the old KDE icon theme."

- id: icons-gnome-install-asset-repair
  category: repair
  desktop:
    environment: gnome
    has_gui_session: true
    target_user: quickhatch
    target_home: /home/quickhatch
  request:
    theme: ""
    icons: Papirus
    cursor: ""
    wallpaper: ""
    effects: []
  facts_before:
    active_theme: Adwaita
    active_icons: Adwaita
    active_cursor: Adwaita
    active_wallpaper: /usr/share/backgrounds/gnome/adwaita-l.jpg
    effects: []
  attempted_commands:
    - "gsettings set org.gnome.desktop.interface icon-theme Papirus"
  command_result:
    rc: 0
    stdout: ""
    stderr: ""
  facts_after_attempt:
    active_theme: Adwaita
    active_icons: Adwaita
    active_cursor: Adwaita
    active_wallpaper: /usr/share/backgrounds/gnome/adwaita-l.jpg
    effects: []
  repair_result:
    action: install_asset
    facts_after_repair:
      active_theme: Adwaita
      active_icons: Papirus
      active_cursor: Adwaita
      active_wallpaper: /usr/share/backgrounds/gnome/adwaita-l.jpg
      effects: []
  expected:
    element_status:
      theme: not_requested
      icons: applied_and_verified
      cursor: not_requested
      wallpaper: not_requested
      effects: not_requested
    final_status_effect: success_with_warnings
  rationale: "The first attempt exposes a missing icon asset; install_asset repair makes the requested icon theme observable."

