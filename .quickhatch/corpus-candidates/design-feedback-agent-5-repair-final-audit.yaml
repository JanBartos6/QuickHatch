- id: repair-gnome-theme-effects-retry
  category: repair
  desktop:
    environment: gnome
    has_gui_session: true
    target_user: quickhatch
    target_home: /home/quickhatch
  request:
    theme: Nordic-darker
    icons: Tela-circle
    cursor: Bibata-Modern-Ice
    wallpaper: /home/quickhatch/Pictures/aurora.png
    effects: ["animations_enabled"]
  facts_before:
    active_theme: Adwaita
    active_icons: Adwaita
    active_cursor: Adwaita
    active_wallpaper: /home/quickhatch/Pictures/default.png
    effects: ["animations_disabled"]
  attempted_commands:
    - "gsettings set org.gnome.desktop.interface gtk-theme Nordic-darker"
    - "gsettings set org.gnome.desktop.interface icon-theme Tela-circle"
    - "gsettings set org.gnome.desktop.interface cursor-theme Bibata-Modern-Ice"
    - "gsettings set org.gnome.desktop.background picture-uri file:///home/quickhatch/Pictures/aurora.png"
    - "gsettings set org.gnome.desktop.interface enable-animations true"
  command_result:
    rc: 0
    stdout: ""
    stderr: ""
  facts_after_attempt:
    active_theme: Adwaita
    active_icons: Tela-circle
    active_cursor: Bibata-Modern-Ice
    active_wallpaper: /home/quickhatch/Pictures/aurora.png
    effects: ["animations_enabled"]
  repair_result:
    action: retry_apply
    facts_after_repair:
      active_theme: Nordic-darker
      active_icons: Tela-circle
      active_cursor: Bibata-Modern-Ice
      active_wallpaper: /home/quickhatch/Pictures/aurora.png
      effects: ["animations_enabled"]
  expected:
    element_status:
      theme: applied_and_verified
      icons: applied_and_verified
      cursor: applied_and_verified
      wallpaper: applied_and_verified
      effects: applied_and_verified
    final_status_effect: none
  rationale: "Only theme lagged after the initial apply, so retry_apply should target the mismatch and final audit should accept all elements after refresh."

