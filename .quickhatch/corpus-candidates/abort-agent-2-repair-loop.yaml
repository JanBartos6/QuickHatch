- id: repair-stop-model-after-app-failure
  category: repair_loop_stop
  mode: configure_existing
  stage: repair
  state_before:
    completed_groups:
      - install-vlc
    active_group: install-obsidian
    pending_question: false
    reboot_planned: false
    destructive_capability_pending: false
    manual_followups: []
  event:
    type: user_stop
    reason: "User stopped setup while model repair was being requested after an app install failure."
  expected:
    no_new_groups_started: true
    no_new_destructive_work: true
    no_reboot_started: true
    pending_question_cleared_or_marked: false
    logs_preserved: true
    support_bundle_explains_abort: true
    final_status: aborted
    summary_must_include:
      - "stopped"
      - "install-obsidian"
      - "repair"
    summary_must_not_claim:
      - "success"
      - "all apps installed"
  rationale: "A user stop during repair planning must prevent repair execution and preserve partial success evidence."

