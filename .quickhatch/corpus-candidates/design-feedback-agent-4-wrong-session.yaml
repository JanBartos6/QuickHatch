    has_gui_session: false
    target_user: quickhatch
    target_home: /home/quickhatch
  request:
    theme: ""
    icons: ""
    cursor: ""
    wallpaper: /home/quickhatch/Pictures/new-wallpaper.jpg
    effects: []
  facts_before:
    active_theme: Adwaita
    active_icons: Adwaita
    active_cursor: Adwaita
    active_wallpaper: /home/quickhatch/Pictures/old-wallpaper.jpg
    effects: ["animations_enabled"]
  attempted_commands:
    - "gsettings set org.gnome.desktop.background picture-uri file:///home/quickhatch/Pictures/new-wallpaper.jpg"
  command_result:
    rc: 1
    stdout: ""
    stderr: "Cannot autolaunch D-Bus without X11 $DISPLAY"
  facts_after_attempt:
    active_theme: Adwaita
    active_icons: Adwaita
    active_cursor: Adwaita
    active_wallpaper: /home/quickhatch/Pictures/old-wallpaper.jpg
    effects: ["animations_enabled"]
  repair_result:
    action: manual_followup
    facts_after_repair:
      active_theme: Adwaita
      active_icons: Adwaita
      active_cursor: Adwaita
      active_wallpaper: /home/quickhatch/Pictures/old-wallpaper.jpg
      effects: ["animations_enabled"]
  expected:
    element_status:
      theme: not_requested
      icons: not_requested
      cursor: not_requested
      wallpaper: no_active_gui_session
      effects: not_requested
    final_status_effect: manual_followup_required
  rationale: "Wallpaper changes need a live session to verify; no-session state should become explicit follow-up."

