- id: wrong-session-root-theme-target-user-unchanged
  category: wrong_user
  desktop:
    environment: gnome
    has_gui_session: true
    target_user: quickhatch
    target_home: /home/quickhatch
  request:
    theme: Adwaita-dark
    icons: ""
    cursor: ""
    wallpaper: ""
    effects: []
  facts_before:
    active_theme: Yaru
    active_icons: Yaru
    active_cursor: Yaru
    active_wallpaper: /home/quickhatch/Pictures/current.jpg
    effects: ["animations_enabled"]
  attempted_commands:
    - "HOME=/root gsettings set org.gnome.desktop.interface gtk-theme Adwaita-dark"
  command_result:
    rc: 0
    stdout: ""
    stderr: ""
  facts_after_attempt:
    active_theme: Yaru
    active_icons: Yaru
    active_cursor: Yaru
    active_wallpaper: /home/quickhatch/Pictures/current.jpg
    effects: ["animations_enabled"]
  repair_result:
    action: retry_apply
    facts_after_repair:
      active_theme: Adwaita-dark
      active_icons: Yaru
      active_cursor: Yaru
      active_wallpaper: /home/quickhatch/Pictures/current.jpg
      effects: ["animations_enabled"]
  expected:
    element_status:
      theme: applied_and_verified
      icons: not_requested
      cursor: not_requested
      wallpaper: not_requested
      effects: not_requested
    final_status_effect: success_with_warnings
  rationale: "The original command wrote root preferences; repair must rerun against the target user's session before claiming success."

