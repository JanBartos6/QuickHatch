- id: blocked-before-final-audit-safe-abort
  category: blocked_run
  status: unknown
  representative_runlog_events:
    - event_type: "setup_started"
      payload:
        profile:
          install_profile: "full_disk_wipe"
          remote_setup_mode: "ssh"
    - event_type: "dangerous_operation_preview"
      payload:
        stage: "install_or_skip"
        group_id: "disk-format"
        preview:
          preview_id: "prev-format-sda1"
          operation:
            kind: "format_partition"
            target: "/dev/sda1"
          confirmation_token: "FORMAT-/dev/sda1"
    - event_type: "blocking_question_timeout"
      payload:
        stage: "install_or_skip"
        question_id: "confirm-format-sda1"
    - event_type: "safe_abort"
      payload:
        stage: "install_or_skip"
        group_id: "disk-format"
        reason: "Dangerous operation was not confirmed with the required token."
  expected_bundle_artifacts:
    - "setup-runlog-redacted.jsonl"
    - "support-summary.json"
    - "replay-summary.json"
    - "dangerous-operation-previews.json"
  required_evidence:
    - "final status is unknown or blocked because no final_audit was reached"
    - "safe_abort reason"
    - "blocking question timeout id"
    - "dangerous preview id, operation kind, target, and confirmation token redacted if needed"
  redaction_expectations:
    - "confirmation token should not be exposed as a reusable secret if future tokens become secret-bearing"
    - "sk-blocked-core-secret"
  current_likely_gap: "early safe_abort has no terminal setup_run_finished event, so support-summary final_status may remain unknown"
  rationale: "A user needs enough evidence to distinguish an intentional safety stop from a crash when a destructive confirmation is not completed."
  risk: high

- id: blocked-final-audit-missing-bootloader
