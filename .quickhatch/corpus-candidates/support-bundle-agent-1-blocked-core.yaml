        group:
          id: "write-fstab"
          title: "Write target fstab"
    - event_type: "command_preflight_blocked"
      payload:
        stage: "install_or_skip"
        group_id: "write-fstab"
        command: "sudo sh -c 'echo UUID=abc / ext4 defaults 0 1 > /mnt/etc/fstab'"
        decision:
          kind: "block"
          category: "fstab"
          reason: "Writing target fstab requires confirmed write_fstab capability."
          capability_kind: "write_fstab"
          target: "/mnt/etc/fstab"
        reason: "Writing target fstab requires confirmed write_fstab capability."
  expected_bundle_artifacts:
    - "setup-runlog-redacted.jsonl"
    - "preflight-events.json"
