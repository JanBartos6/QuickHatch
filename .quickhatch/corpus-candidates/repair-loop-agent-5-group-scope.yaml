- id: auto-repair-pacman-refresh-one-shot
  category: group_scope
  stage: apps
  app_or_target: "Arch repo package after stale database failure"
  initial_failure:
    command: "sudo pacman -S --noconfirm vlc"
    failure_type: command
    stdout: ""
    stderr: "error: failed retrieving file 'extra.db' from mirror"
  repair_sequence:
    - action: diagnostic
      command: "sudo pacman -Syy"
      strategy: diagnostic
      result: success
    - action: retry_command
      command: "sudo pacman -S --noconfirm vlc"
      strategy: same
      result: failure
    - action: retry_command
      command: "sudo pacman -S --noconfirm vlc"
      strategy: same
      result: failure
  expected:
    loop_detected: false
    budget_consumed_count: 3
    final_group_status: manual_followup
    final_status_effect: success_with_warnings
  rationale: "A one-shot stale-metadata repair is a distinct diagnostic step, but repeated original install failures after it should still be bounded by budget."

- id: auto-repair-aur-pgp-split-one-shot
  category: group_scope
  stage: apps
  app_or_target: "AUR package with PGP key failure"
  initial_failure:
    command: "yay -S --noconfirm signal-desktop-beta"
    failure_type: command
    stdout: "==> Making package: signal-desktop-beta"
    stderr: "gpg: keyserver receive failed: No data"
  repair_sequence:
    - action: diagnostic
      command: "gpg --recv-keys 1234567890ABCDEF"
      strategy: diagnostic
      result: failure
    - action: retry_command
      command: "yay -S --noconfirm signal-desktop-beta"
      strategy: same
      result: failure
    - action: manual_followup
      command: ""
      strategy: same
      result: manual_followup
  expected:
    loop_detected: false
    budget_consumed_count: 2
    final_group_status: manual_followup
    final_status_effect: success_with_warnings
  rationale: "AUR PGP repair may try one distinct helper step, but persistent key failure should become manual follow-up rather than repeating the same build loop."

- id: final-audit-budget-required-app
  category: diagnostics_budget
  stage: final_audit
  app_or_target: "required app verification"
  initial_failure:
    command: "verify app: code"
    failure_type: audit
    stdout: "missing: code"
    stderr: ""
  repair_sequence:
    - action: retry_command
      command: "sudo apt-get install -y code"
      strategy: repo
      result: failure
    - action: retry_command
      command: "sudo apt-get install -y code"
      strategy: repo
      result: failure
  expected:
    loop_detected: false
    budget_consumed_count: 2
    final_group_status: manual_followup
    final_status_effect: manual_followup_required
  rationale: "Final audit repair should be budget-driven and must preserve an honest manual-follow-up status for unresolved required apps."

