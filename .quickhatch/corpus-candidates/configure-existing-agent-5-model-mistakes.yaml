- id: ce-mistake-nvidia-blacklist-nouveau
  category: driver
  facts_profile:
    family: fedora
    package_manager: dnf
    desktop: gnome
    has_gui_session: true
    flatpak_available: true
    snap_available: false
    aur_helper: none
  command_group:
    stage: postboot_driver
    title: "Blacklist nouveau and rebuild initramfs"
    commands:
      - "printf 'blacklist nouveau\noptions nouveau modeset=0\n' | sudo tee /etc/modprobe.d/blacklist-nouveau.conf"
      - "sudo dracut --force"
  expected:
    outcome: block
    final_status_effect: blocked
    blocked_reason_category: boot
  rationale: "Initramfs rebuild and boot-affecting driver changes are high-risk without explicit driver/boot guardrails."

- id: ce-mistake-nvidia-diagnostics-first
  category: driver
  facts_profile:
    family: arch
    package_manager: pacman
    desktop: kde
    has_gui_session: true
    flatpak_available: true
    snap_available: false
    aur_helper: yay
  command_group:
    stage: postboot_driver
    title: "Check NVIDIA state before repair"
    commands:
      - "lspci -nnk | grep -A3 -Ei 'nvidia|vga|3d'"
      - "pacman -Qs 'nvidia|mesa|linux-headers'"
      - "nvidia-smi"
  expected:
    outcome: allow_with_advisory
    final_status_effect: none
    blocked_reason_category: ""
  rationale: "Driver diagnostics are safe and should precede any driver repair."

