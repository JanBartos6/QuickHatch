- id: facts-final-vlc-refresh-verifies-success
  category: facts_refresh
  facts_profile:
    family: ubuntu
    package_manager: apt
    installed_apps_before: []
    installed_apps_after:
      - vlc
    flatpak_available: true
    snap_available: true
    aur_helper: none
  plan:
    requested_apps:
      - name: VLC
        package: vlc
        source: repo
        required: true
    command_groups:
      - title: Install media player
        packages:
          - vlc
        commands:
          - "sudo apt-get install -y vlc"
  simulated_events:
    - type: command_success
      app: VLC
      package: vlc
      rc: 0
      stdout: "installed"
      stderr: ""
      repair_strategy: ""
      provider_error: ""
    - type: facts_refresh
      app: VLC
      package: vlc
      rc: 0
      stdout: "INSTALLED: vlc"
      stderr: ""
      repair_strategy: ""
      provider_error: ""
    - type: verification
      app: VLC
      package: vlc
      rc: 0
      stdout: "verified"
      stderr: ""
      repair_strategy: ""
      provider_error: ""
  expected:
    completed_apps:
      - VLC
    manual_followup_apps: []
    failed_apps: []
    alternatives: []
    final_status: success
    must_not_block: true
    invariants:
      - successful_apps_preserved
      - final_status_honest
  rationale: "A fresh facts refresh proving the requested app exists should allow final audit to report success."

- id: facts-final-partial-refresh-manual-followup
  category: final_audit
  facts_profile:
    family: debian
    package_manager: apt
    installed_apps_before: []
    installed_apps_after:
      - vlc
    flatpak_available: false
    snap_available: false
    aur_helper: none
  plan:
    requested_apps:
      - name: VLC
        package: vlc
        source: repo
        required: true
      - name: Required Notes
        package: required-notes
        source: repo
        required: true
    command_groups:
      - title: Install media and required notes
        packages:
          - vlc
          - required-notes
        commands:
          - "sudo apt-get install -y vlc required-notes"
  simulated_events:
    - type: command_failure
      app: ""
      package: ""
      rc: 100
      stdout: "vlc installed"
      stderr: "E: Unable to locate package required-notes"
      repair_strategy: ""
      provider_error: ""
    - type: facts_refresh
      app: ""
      package: ""
      rc: 0
      stdout: "INSTALLED: vlc; MISSING: required-notes"
      stderr: ""
      repair_strategy: ""
      provider_error: ""
  expected:
    completed_apps:
      - VLC
    manual_followup_apps:
      - Required Notes
    failed_apps: []
    alternatives: []
    final_status: manual_followup_required
    must_not_block: true
    invariants:
      - successful_apps_preserved
      - failure_isolated
      - final_status_honest
  rationale: "Final audit must not claim success while a required app remains unresolved after facts refresh."

- id: facts-final-provider-429-preserves-installed
  category: facts_refresh
  facts_profile:
    family: arch
    package_manager: pacman
    installed_apps_before: []
    installed_apps_after:
      - firefox
      - keepassxc
    flatpak_available: true
    snap_available: false
    aur_helper: yay
  plan:
    requested_apps:
      - name: Firefox
        package: firefox
        source: repo
        required: true
      - name: KeePassXC
        package: keepassxc
        source: repo
        required: true
      - name: Teams
        package: teams-for-linux
        source: aur
        required: false
    command_groups:
      - title: Install base and meeting apps
        packages:
          - firefox
          - keepassxc
          - teams-for-linux
        commands:
          - "sudo pacman -S --noconfirm firefox keepassxc teams-for-linux"
  simulated_events:
    - type: command_failure
      app: ""
      package: ""
      rc: 1
      stdout: "firefox keepassxc installed"
      stderr: "teams-for-linux not found"
      repair_strategy: ""
      provider_error: ""
    - type: provider_error
      app: Teams
      package: teams-for-linux
      rc: 0
      stdout: ""
      stderr: ""
      repair_strategy: aur_repair
      provider_error: "429"
    - type: facts_refresh
      app: ""
      package: ""
      rc: 0
      stdout: "INSTALLED: firefox keepassxc; MISSING: teams-for-linux"
      stderr: ""
      repair_strategy: ""
      provider_error: ""
  expected:
    completed_apps:
      - Firefox
      - KeePassXC
    manual_followup_apps:
      - Teams
    failed_apps: []
    alternatives: []
    final_status: success_with_warnings
    must_not_block: true
    invariants:
      - successful_apps_preserved
      - provider_error_preserves_progress
      - final_status_honest
  rationale: "Provider failure plus later facts refresh should preserve installed apps and surface the optional app as follow-up."

- id: facts-final-flatpak-refresh-verifies-after-repo-miss
  category: facts_refresh
  facts_profile:
    family: fedora
    package_manager: dnf
    installed_apps_before: []
    installed_apps_after:
      - com.spotify.Client
    flatpak_available: true
    snap_available: false
    aur_helper: none
  plan:
    requested_apps:
      - name: Spotify
        package: spotify-client
        source: repo
        required: false
    command_groups:
      - title: Install Spotify with fallback
        packages:
          - spotify-client
        commands:
          - "sudo dnf install -y spotify-client"
  simulated_events:
    - type: command_failure
      app: Spotify
      package: spotify-client
      rc: 1
      stdout: ""
      stderr: "No match for argument"
      repair_strategy: ""
      provider_error: ""
    - type: repair_response
      app: Spotify
      package: com.spotify.Client
      rc: 0
      stdout: "Use Flatpak"
      stderr: ""
      repair_strategy: repo_to_flatpak
      provider_error: ""
    - type: command_success
      app: Spotify
      package: com.spotify.Client
      rc: 0
      stdout: "installed"
      stderr: ""
      repair_strategy: repo_to_flatpak
      provider_error: ""
    - type: facts_refresh
      app: Spotify
      package: com.spotify.Client
      rc: 0
      stdout: "FLATPAK: com.spotify.Client"
      stderr: ""
      repair_strategy: ""
      provider_error: ""
  expected:
    completed_apps:
      - Spotify
    manual_followup_apps: []
    failed_apps: []
    alternatives: []
    final_status: success
    must_not_block: true
    invariants:
      - successful_apps_preserved
      - final_status_honest
  rationale: "Final audit should accept verified Flatpak fallback when the original repo package was unavailable."

