      - "plasma-apply-colorscheme BreezeDark"
      - "plasma-apply-icons Nonexistent-Icons"
      - "kwriteconfig6 --file kcminputrc --group Mouse --key cursorTheme Breeze"
      - "plasma-apply-wallpaperimage /home/quickhatch/Pictures/wallpaper.png"
