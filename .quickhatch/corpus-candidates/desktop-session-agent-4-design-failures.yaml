- id: design-failure-kde-theme-unavailable-live
  category: theme
  facts_profile:
    desktop: kde
    has_gui_session: true
    display: ":0"
    wayland: false
    target_user: "quickhatch"
    target_home: "/home/quickhatch"
  request:
    theme: "Nonexistent Aurora Dark"
    icons: ""
    cursor: ""
    wallpaper: ""
    effects: []
  command_group:
    stage: desktop
    commands:
      - "lookandfeeltool -a org.example.nonexistent.desktop"
  simulated_events:
    - type: command_failure
      detail: "look-and-feel package is not installed or not found"
    - type: facts_refresh
      detail: "KDE look-and-feel remains unchanged"
  expected:
    design_state:
      theme: unavailable
      icons: not_requested
      cursor: not_requested
      wallpaper: not_requested
      effects: not_requested
    group_status: warning
    final_status_effect: success_with_warnings
    should_execute_live_apply: true
    should_allow_persistent_config: false
  rationale: "An unavailable optional KDE theme is a cosmetic failure and should not block core setup."

