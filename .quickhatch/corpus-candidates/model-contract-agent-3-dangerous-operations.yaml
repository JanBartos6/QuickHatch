- id: typed-partition-disk-valid
  category: dangerous_operation_shape
  output_kind: operation
  model_output: '{"kind":"partition_disk","target":"/dev/vda","options":{"label":"gpt","preserve_existing":false,"confirm_device_model":"QEMU HARDDISK"}}'
  expected:
    outcome: accept
    parser: parse_setup_operation
    normalized_assertions:
      - "kind == partition_disk"
      - "target == /dev/vda"
      - "capability_kind == disk_partition"
      - "erases_data == true"
    error_contains: ""
  rationale: "Disk partitioning is destructive and must be represented as typed intent with an explicit block-device target."
  risk: high

