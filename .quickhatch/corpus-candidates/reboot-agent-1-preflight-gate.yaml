- id: preflight-all-clear-harness-reboot
  category: pre_reboot_gate
  mode: fresh_install
  facts_before:
    is_live: true
    ssh_ready: true
    fstab_ok: true
    bootloader_ok: true
    kernel_ok: true
    initramfs_ok: true
    package_db_healthy: true
  stage_state_before:
    completed_groups: ["disk", "base", "bootloader"]
    manual_followups: []
    repair_attempts: {}
    pending_questions: []
  reboot_request:
    source: typed_operation
    command: "controlled_reboot"
    controlled: true
  reconnect_sequence:
    - state: disconnected
    - state: connected
  facts_after:
    is_live: false
    ssh_ready: true
    same_target: true
  expected:
    should_reboot: true
    should_checkpoint_before_reboot: true
    should_resume: true
    final_status_effect: none
    reason: "all pre-reboot guard checks passed and reboot is harness-controlled"
  rationale: "A fresh install may cross the reboot boundary only after boot, fstab, kernel, initramfs, and SSH continuity checks pass."

- id: preflight-missing-fstab-blocks
