- id: preflight-raw-reboot-deferred-then-guarded
  category: pre_reboot_gate
  mode: fresh_install
  facts_before:
    is_live: true
    ssh_ready: true
    fstab_ok: true
    bootloader_ok: true
    kernel_ok: true
    initramfs_ok: true
    package_db_healthy: true
  stage_state_before:
    completed_groups: ["disk", "base", "bootloader"]
    manual_followups: []
    repair_attempts: {}
    pending_questions: []
  reboot_request:
    source: model_raw_command
    command: "umount -R /mnt && reboot"
    controlled: false
  reconnect_sequence:
    - state: disconnected
    - state: connected
  facts_after:
    is_live: false
    ssh_ready: true
    same_target: true
  expected:
    should_reboot: true
    should_checkpoint_before_reboot: true
    should_resume: true
    final_status_effect: none
    reason: "raw reboot is deferred and replaced by harness guarded reboot"
  rationale: "The model may mention reboot, but the harness should own the actual unmount/reboot/reconnect sequence."

