    pending_questions: []
  reboot_request:
    source: typed_operation
    command: "controlled_reboot"
    controlled: true
  reconnect_sequence: []
  facts_after:
    is_live: unknown
    ssh_ready: unknown
    same_target: unknown
  expected:
