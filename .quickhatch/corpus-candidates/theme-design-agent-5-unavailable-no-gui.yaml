- id: no-gui-persistent-config-only
  category: no_active_gui_session
  facts_profile:
    desktop: kde
    has_gui_session: false
    display: ""
    package_manager: pacman
  user_request:
    desktop_look: macos_like
    icon_style: rounded
    wallpaper_style: abstract
    additional_notes: "make it look like macOS"
  expected:
    should_execute_live_apply: false
    should_allow_persistent_config: true
    final_status_if_unverified: manual_followup_required
  rationale: No active GUI should allow safe persistent config but not claim live visual success.

- id: unavailable-theme-manual-followup
  category: theme_unavailable
  facts_profile:
    desktop: kde
    has_gui_session: true
    display: ":0"
    package_manager: pacman
  user_request:
    desktop_look: custom
    icon_style: colorful
    wallpaper_style: ""
    additional_notes: "Use Sweet Mars KDE theme and Candy icons."
  simulated_failure:
    command: yay -S --noconfirm sweet-mars-kde-theme-git candy-icons-git
    stderr: "error: target not found: sweet-mars-kde-theme-git"
  expected:
    failed_element: theme
    final_status_if_unverified: manual_followup_required
    reason_contains: sweet-mars-kde-theme-git
  rationale: Unavailable cosmetic packages should be follow-up/warning, not fake visual success or core block.

- id: command-success-but-unverified-not-success
  category: verification
  facts_profile:
    desktop: gnome
    has_gui_session: true
    display: ":0"
    package_manager: apt
  user_request:
    desktop_look: dark_minimal
    icon_style: flat
    wallpaper_style: dark
    additional_notes: "dark minimal setup"
  simulated_result:
    command_rc: 0
    observed_theme: ""
    observed_icons: ""
    observed_wallpaper: ""
  expected:
    final_status_if_unverified: manual_followup_required
    no_fake_visual_success: true
  rationale: Successful commands are not proof of visual/design success without refreshed facts.
