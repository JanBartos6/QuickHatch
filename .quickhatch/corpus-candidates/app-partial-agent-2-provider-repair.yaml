- id: strategy-change-repo-to-flatpak-not-loop
  category: repair_loop
  facts_profile:
    family: fedora
    package_manager: dnf
    installed_apps_before: []
    installed_apps_after:
      - com.discordapp.Discord
    flatpak_available: true
    snap_available: false
    aur_helper: none
  plan:
    requested_apps:
      - name: Discord
        package: discord
        source: repo
        required: false
    command_groups:
      - title: Install chat app
        packages:
          - discord
        commands:
          - "sudo dnf install -y discord"
  simulated_events:
    - type: command_failure
      app: Discord
      package: discord
      rc: 1
      stdout: ""
      stderr: "No match for argument: discord"
      repair_strategy: ""
      provider_error: ""
    - type: repair_response
      app: Discord
      package: com.discordapp.Discord
      rc: 0
      stdout: "Use Flatpak"
      stderr: ""
      repair_strategy: repo_to_flatpak
      provider_error: ""
    - type: command_success
      app: Discord
      package: com.discordapp.Discord
