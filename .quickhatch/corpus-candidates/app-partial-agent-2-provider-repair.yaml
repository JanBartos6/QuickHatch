- id: provider-429-after-repo-partial
  category: provider_repair_failure
  facts_profile:
    family: ubuntu
    package_manager: apt
    installed_apps_before: []
    installed_apps_after:
      - vlc
      - git
    flatpak_available: true
    snap_available: true
    aur_helper: none
  plan:
    requested_apps:
      - name: VLC
        package: vlc
        source: repo
        required: true
      - name: Git
        package: git
        source: repo
        required: true
      - name: Obsidian
        package: obsidian
        source: repo
        required: false
    command_groups:
      - title: Install base apps and notes app
        packages:
          - vlc
          - git
          - obsidian
        commands:
          - "sudo apt-get install -y vlc git obsidian"
  simulated_events:
    - type: command_failure
      app: ""
      package: ""
      rc: 100
      stdout: "vlc and git installed"
      stderr: "E: Unable to locate package obsidian"
      repair_strategy: ""
      provider_error: ""
    - type: provider_error
      app: Obsidian
      package: obsidian
      rc: 0
      stdout: ""
      stderr: ""
      repair_strategy: repo_to_flatpak
      provider_error: "429"
    - type: verification
      app: VLC
      package: vlc
      rc: 0
      stdout: "verified"
      stderr: ""
      repair_strategy: ""
      provider_error: ""
  expected:
    completed_apps:
      - VLC
      - Git
    manual_followup_apps:
      - Obsidian
    failed_apps: []
    alternatives: []
    final_status: success_with_warnings
    must_not_block: true
    invariants:
      - successful_apps_preserved
      - failure_isolated
      - provider_error_preserves_progress
      - final_status_honest
  rationale: "A provider 429 during repair for one optional app must not erase already completed repo apps."

- id: provider-timeout-required-unresolved
  category: provider_repair_failure
  facts_profile:
    family: fedora
    package_manager: dnf
    installed_apps_before: []
    installed_apps_after:
      - firefox
    flatpak_available: true
    snap_available: false
    aur_helper: none
  plan:
    requested_apps:
      - name: Firefox
        package: firefox
        source: repo
        required: true
      - name: Required CAD
        package: required-cad
        source: repo
        required: true
    command_groups:
      - title: Install browser and CAD package
        packages:
          - firefox
          - required-cad
        commands:
          - "sudo dnf install -y firefox required-cad"
  simulated_events:
    - type: command_failure
      app: ""
      package: ""
      rc: 1
      stdout: "firefox installed"
      stderr: "No match for argument: required-cad"
      repair_strategy: ""
      provider_error: ""
    - type: provider_error
      app: Required CAD
      package: required-cad
      rc: 0
      stdout: ""
      stderr: ""
      repair_strategy: repo_to_flatpak
      provider_error: timeout
    - type: facts_refresh
      app: ""
      package: ""
      rc: 0
      stdout: "INSTALLED: firefox; MISSING: required-cad"
      stderr: ""
      repair_strategy: ""
      provider_error: ""
  expected:
    completed_apps:
      - Firefox
    manual_followup_apps:
      - Required CAD
    failed_apps: []
    alternatives: []
    final_status: manual_followup_required
    must_not_block: true
    invariants:
      - successful_apps_preserved
      - failure_isolated
      - provider_error_preserves_progress
      - final_status_honest
  rationale: "A provider timeout cannot hide an unresolved required app as success, but it should preserve unrelated progress."

