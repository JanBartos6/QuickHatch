  facts_profile:
    family: ubuntu
    package_manager: apt
    installed_apps_before: []
    installed_apps_after: []
    flatpak_available: true
    snap_available: true
    aur_helper: none
  plan:
    requested_apps:
      - name: Signal
        package: signal-desktop
        source: repo
        required: false
    command_groups:
      - title: Install Signal with stale apt hint
        packages:
          - signal-desktop
        commands:
          - "sudo apt-get install -y signal-desktop"
  simulated_events:
    - type: command_failure
      app: Signal
      package: signal-desktop
      rc: 100
      stdout: ""
      stderr: "E: Unable to locate package signal-desktop"
      repair_strategy: ""
      provider_error: ""
    - type: repair_response
      app: Signal
      package: signal-desktop
      rc: 0
      stdout: "Retry same apt package"
      stderr: ""
      repair_strategy: retry_identical_repo
      provider_error: ""
    - type: command_failure
      app: Signal
      package: signal-desktop
      rc: 100
      stdout: ""
      stderr: "E: Unable to locate package signal-desktop"
      repair_strategy: retry_identical_repo
      provider_error: ""
