- id: pq-disk-confirm-stop-01
  category: pending_question_stop
  mode: fresh_install
  stage: pending_question
  state_before:
    completed_groups: []
    active_group: "confirm target disk"
    pending_question: true
    reboot_planned: false
    destructive_capability_pending: true
    manual_followups: []
  event:
    type: user_stop
    reason: "User stopped while target disk confirmation was pending."
  expected:
    no_new_groups_started: true
    no_new_destructive_work: true
    no_reboot_started: true
    pending_question_cleared_or_marked: true
    logs_preserved: true
    support_bundle_explains_abort: true
    final_status: aborted
    summary_must_include:
      - "stopped"
      - "target disk confirmation"
    summary_must_not_claim:
      - "disk confirmed"
      - "install completed"
      - "success"
  rationale: "A missing destructive disk confirmation must never be treated as implicit consent after stop."

- id: pq-disk-confirm-after-probe-stop-02
  category: pending_question_stop
  mode: fresh_install
  stage: pending_question
  state_before:
    completed_groups:
      - "hardware probe"
      - "disk inventory"
    active_group: "select install target"
    pending_question: true
    reboot_planned: false
    destructive_capability_pending: true
    manual_followups: []
  event:
    type: user_stop
    reason: "User stopped after disk inventory while waiting to confirm the selected disk."
  expected:
    no_new_groups_started: true
    no_new_destructive_work: true
    no_reboot_started: true
    pending_question_cleared_or_marked: true
    logs_preserved: true
    support_bundle_explains_abort: true
    final_status: aborted
    summary_must_include:
      - "stopped"
      - "selected disk was not confirmed"
    summary_must_not_claim:
      - "partitioning started"
      - "formatting started"
      - "success"
  rationale: "Read-only discovery may be preserved, but partitioning or formatting must not start without the unanswered disk confirmation."

