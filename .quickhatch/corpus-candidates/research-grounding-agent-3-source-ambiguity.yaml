- schema_note: candidate cases only; generated locally as simulated agents for the research-grounding lane
  id: flatpak-id-changed
  category: stale_package
  mode: repair
  facts_profile:
    family: fedora
    package_manager: dnf
    flatpak_available: true
  requested_apps:
  - LocalSend
  failed_command: flatpak install -y flathub org.localsend.localsend_app
