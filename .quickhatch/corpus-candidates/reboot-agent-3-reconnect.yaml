- id: reconnect-immediate-success-new-user
  category: reconnect_success
  mode: fresh_install
  facts_before:
    is_live: true
    ssh_ready: true
    fstab_ok: true
    bootloader_ok: true
    kernel_ok: true
    initramfs_ok: true
    package_db_healthy: true
  stage_state_before:
    completed_groups: ["install_or_skip"]
    manual_followups: []
    repair_attempts: {}
    pending_questions: []
  reboot_request:
    source: typed_operation
    command: "controlled_reboot"
    controlled: true
  reconnect_sequence:
    - state: connected
  facts_after:
    is_live: false
    ssh_ready: true
    same_target: true
  expected:
    should_reboot: true
    should_checkpoint_before_reboot: true
    should_resume: true
    final_status_effect: none
    reason: "installed target accepts SSH as expected user"
  rationale: "The happy path should resume postboot stages after facts refresh."

