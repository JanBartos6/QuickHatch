- id: user-stop-app-install-first-command
  category: user_stop
  mode: configure_existing
  stage: apps
  state_before:
    completed_groups: []
    active_group: "Install requested apps"
    pending_question: false
    reboot_planned: false
    destructive_capability_pending: false
    manual_followups: []
  event:
    type: user_stop
    reason: "User clicked stop while the first app install command was active"
  expected:
    no_new_groups_started: true
    no_new_destructive_work: true
    no_reboot_started: true
    pending_question_cleared_or_marked: false
    logs_preserved: true
    support_bundle_explains_abort: true
    final_status: aborted
    summary_must_include:
      - "user stop"
      - "Install requested apps"
    summary_must_not_claim:
      - "setup completed successfully"
      - "all requested apps installed"
  rationale: "A user stop during an app command may let the active command settle, but no later app or desktop groups should begin and the final summary must not be success."

