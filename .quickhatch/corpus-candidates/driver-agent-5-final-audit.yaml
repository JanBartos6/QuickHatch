- id: final-nvidia-installed-module-missing
  category: final_audit
  facts_profile:
    gpu_vendors:
      - nvidia
    gpu_models:
      - "NVIDIA GeForce RTX 3060"
    secure_boot: disabled
    is_vm: false
    has_gui_session: true
    kernel_module_loaded: false
    nouveau_loaded: false
    nvidia_driver_installed: true
    amd_firmware_present: unknown
    package_manager: pacman
  driver_strategy:
    requested: true
    source: repo
    packages:
      - nvidia-open
      - nvidia-utils
    confidence: high
    notes: "Repo packages installed, but runtime module verification did not pass."
  simulated_events:
    - type: command_success
      detail: "Installed NVIDIA packages from distro repository."
      rc: 0
      stdout: "nvidia-open nvidia-utils installed"
      stderr: ""
    - type: module_probe
      detail: "nvidia module not loaded after package installation."
      rc: 1
      stdout: ""
      stderr: "modprobe: FATAL: Module nvidia not found"
  expected:
    driver_status: installed_unverified
    final_status_effect: manual_followup_required
    should_reboot_verify: true
    should_continue_unrelated_setup: true
  rationale: "Final audit must distinguish package success from verified driver success and preserve unrelated completed setup work."

