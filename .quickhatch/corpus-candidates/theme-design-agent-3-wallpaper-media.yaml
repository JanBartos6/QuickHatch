- id: wallpaper-kde-persistent-and-live
  category: wallpaper
  facts_profile:
    desktop: kde
    has_gui_session: true
    display: ":0"
    package_manager: pacman
  user_request:
    desktop_look: custom
    icon_style: ""
    wallpaper_style: custom
    additional_notes: "Use /home/quickhatch/Pictures/mountain.jpg as the wallpaper."
  expected:
    required_elements: [wallpaper]
    persistent_markers:
      - wallpaper
    live_apply_markers:
      - plasma-apply-wallpaperimage
    verification_markers:
      - wallpaper
    final_status_if_unverified: manual_followup_required
  rationale: Wallpaper requests need persisted target-user state and verification, not just a download.

- id: wallpaper-gnome-dark-uri-light-uri
  category: wallpaper
  facts_profile:
    desktop: gnome
    has_gui_session: true
    display: ":0"
    package_manager: apt
  user_request:
    desktop_look: minimal
    icon_style: ""
    wallpaper_style: dark
    additional_notes: "Use a dark abstract wallpaper."
  expected:
    required_elements: [wallpaper]
    persistent_markers:
      - picture-uri
    verification_markers:
      - gsettings get org.gnome.desktop.background
    final_status_if_unverified: manual_followup_required
  rationale: GNOME wallpaper mapping should handle the actual background keys and verify them.

- id: wallpaper-download-only-not-success
  category: wallpaper
  facts_profile:
    desktop: kde
    has_gui_session: false
    display: ""
    package_manager: pacman
  user_request:
    desktop_look: custom
    icon_style: ""
    wallpaper_style: custom
    additional_notes: "Download and use this wallpaper URL."
  expected:
    should_execute_live_apply: false
    final_status_if_unverified: manual_followup_required
  rationale: Downloading an image alone is not applying wallpaper and no GUI prevents live verification.
