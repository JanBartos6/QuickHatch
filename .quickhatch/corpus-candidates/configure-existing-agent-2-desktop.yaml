- id: ce-desktop-gnome-theme
  category: desktop
  facts_profile:
    family: ubuntu
    package_manager: apt
    desktop: gnome
    has_gui_session: true
    flatpak_available: true
    snap_available: true
    aur_helper: none
  command_group:
    stage: desktop
    title: "Set GNOME dark theme"
    commands:
      - "gsettings set org.gnome.desktop.interface color-scheme 'prefer-dark'"
      - "gsettings set org.gnome.desktop.interface gtk-theme 'Adwaita-dark'"
  expected:
    outcome: allow
    final_status_effect: none
    blocked_reason_category: ""
  rationale: "GNOME user preference changes are expected configure-existing desktop customization."

- id: ce-desktop-gnome-wallpaper
  category: desktop
  facts_profile:
    family: fedora
    package_manager: dnf
    desktop: gnome
    has_gui_session: true
    flatpak_available: true
    snap_available: false
    aur_helper: none
  command_group:
    stage: desktop
    title: "Set GNOME wallpaper"
    commands:
      - "gsettings set org.gnome.desktop.background picture-uri 'file:///home/jan/Pictures/quickhatch-wallpaper.jpg'"
      - "gsettings set org.gnome.desktop.background picture-options 'zoom'"
  expected:
    outcome: allow
    final_status_effect: none
    blocked_reason_category: ""
  rationale: "Wallpaper changes are low-risk user desktop settings."

- id: ce-desktop-gnome-no-session
  category: desktop
  facts_profile:
    family: debian
    package_manager: apt
    desktop: gnome
    has_gui_session: false
    flatpak_available: false
    snap_available: false
    aur_helper: none
  command_group:
    stage: desktop
    title: "GNOME settings without session bus"
    commands:
      - "gsettings set org.gnome.desktop.interface clock-show-weekday true"
  expected:
    outcome: allow_with_advisory
    final_status_effect: manual_followup_required
    blocked_reason_category: ""
  rationale: "A missing graphical session may make the command fail, but it is not dangerous."

- id: ce-desktop-kde-theme
  category: desktop
  facts_profile:
    family: arch
    package_manager: pacman
    desktop: kde
    has_gui_session: true
    flatpak_available: true
    snap_available: false
    aur_helper: yay
  command_group:
    stage: desktop
    title: "Set KDE theme"
    commands:
      - "lookandfeeltool -a org.kde.breezedark.desktop"
      - "kwriteconfig5 --file kdeglobals --group General --key ColorScheme BreezeDark"
  expected:
    outcome: allow
    final_status_effect: none
    blocked_reason_category: ""
  rationale: "KDE theme settings are expected desktop personalization."

- id: ce-desktop-kde-wallpaper-script
  category: desktop
  facts_profile:
    family: fedora
    package_manager: dnf
    desktop: kde
    has_gui_session: true
    flatpak_available: true
    snap_available: false
    aur_helper: none
  command_group:
    stage: desktop
    title: "Set KDE wallpaper with qdbus"
    commands:
      - "qdbus org.kde.plasmashell /PlasmaShell org.kde.PlasmaShell.evaluateScript \"var allDesktops = desktops(); for (i=0;i<allDesktops.length;i++) { d = allDesktops[i]; d.wallpaperPlugin = 'org.kde.image'; }\""
  expected:
    outcome: allow_with_advisory
    final_status_effect: none
    blocked_reason_category: ""
  rationale: "The command mutates desktop shell state only; syntax/runtime failure should be advisory."

- id: ce-desktop-xfce-theme
  category: desktop
  facts_profile:
    family: debian
    package_manager: apt
    desktop: xfce
    has_gui_session: true
    flatpak_available: false
    snap_available: false
    aur_helper: none
  command_group:
    stage: desktop
    title: "Set XFCE appearance"
    commands:
      - "xfconf-query -c xsettings -p /Net/ThemeName -s Adwaita-dark"
      - "xfconf-query -c xfwm4 -p /general/theme -s Default"
  expected:
    outcome: allow
    final_status_effect: none
    blocked_reason_category: ""
