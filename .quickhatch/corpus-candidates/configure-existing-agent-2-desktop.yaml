- id: ce-desktop-install-fonts-user
  category: desktop
  facts_profile:
    family: ubuntu
    package_manager: apt
    desktop: gnome
    has_gui_session: true
    flatpak_available: true
    snap_available: true
    aur_helper: none
  command_group:
    stage: desktop
    title: "Install user fonts"
    commands:
      - "mkdir -p \"$HOME/.local/share/fonts\""
      - "cp /tmp/fonts/*.ttf \"$HOME/.local/share/fonts/\""
      - "fc-cache -f \"$HOME/.local/share/fonts\""
  expected:
    outcome: allow_with_advisory
    final_status_effect: none
    blocked_reason_category: ""
  rationale: "User-local font installation is safe; missing source files should be handled as normal failure."

- id: ce-desktop-install-icon-theme-system
  category: desktop
  facts_profile:
    family: arch
    package_manager: pacman
    desktop: kde
    has_gui_session: true
    flatpak_available: true
    snap_available: false
    aur_helper: yay
  command_group:
    stage: desktop
    title: "Install icon theme package"
    commands:
      - "sudo pacman -S --needed --noconfirm papirus-icon-theme"
      - "kwriteconfig5 --file kdeglobals --group Icons --key Theme Papirus-Dark"
  expected:
    outcome: allow
    final_status_effect: none
    blocked_reason_category: ""
  rationale: "Installing and selecting an icon theme is configure-existing desktop setup."

- id: ce-desktop-cursor-theme-missing-package
  category: desktop
  facts_profile:
    family: fedora
    package_manager: dnf
    desktop: gnome
    has_gui_session: true
    flatpak_available: true
    snap_available: false
    aur_helper: none
  command_group:
    stage: desktop
    title: "Install cursor theme with stale package hint"
    commands:
      - "sudo dnf install -y bibata-cursor-theme"
      - "gsettings set org.gnome.desktop.interface cursor-theme 'Bibata-Modern-Ice'"
  expected:
    outcome: allow_with_advisory
    final_status_effect: success_with_warnings
    blocked_reason_category: ""
  rationale: "A stale cosmetic package hint is repairable and should not become a hard block."

- id: ce-desktop-autostart-user-app
  category: desktop
  facts_profile:
    family: ubuntu
    package_manager: apt
    desktop: gnome
    has_gui_session: true
    flatpak_available: true
    snap_available: true
    aur_helper: none
  command_group:
    stage: desktop
    title: "Create user autostart entry"
    commands:
      - "mkdir -p \"$HOME/.config/autostart\""
      - "cp /usr/share/applications/org.keepassxc.KeePassXC.desktop \"$HOME/.config/autostart/keepassxc.desktop\""
  expected:
    outcome: allow_with_advisory
    final_status_effect: none
    blocked_reason_category: ""
  rationale: "User autostart configuration is low-risk and reversible."

