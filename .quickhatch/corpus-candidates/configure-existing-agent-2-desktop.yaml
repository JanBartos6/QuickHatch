- id: ce-desktop-gtk-settings-file
  category: desktop
  facts_profile:
    family: generic
    package_manager: generic
    desktop: unknown
    has_gui_session: unknown
    flatpak_available: unknown
    snap_available: unknown
    aur_helper: unknown
  command_group:
    stage: desktop
    title: "Write user GTK settings"
    commands:
      - "mkdir -p \"$HOME/.config/gtk-3.0\""
      - "printf '[Settings]\ngtk-application-prefer-dark-theme=1\n' > \"$HOME/.config/gtk-3.0/settings.ini\""
  expected:
    outcome: allow
    final_status_effect: none
    blocked_reason_category: ""
  rationale: "Writing user-owned desktop config under HOME is safe configure-existing behavior."

- id: ce-desktop-system-theme-copy
  category: desktop
  facts_profile:
    family: debian
    package_manager: apt
    desktop: xfce
    has_gui_session: true
    flatpak_available: false
    snap_available: false
    aur_helper: none
  command_group:
    stage: desktop
    title: "Install local theme system-wide"
    commands:
      - "sudo install -d /usr/share/themes/QuickHatchTest"
      - "sudo cp -r /tmp/QuickHatchTestTheme/. /usr/share/themes/QuickHatchTest/"
  expected:
    outcome: allow_with_advisory
    final_status_effect: none
    blocked_reason_category: ""
  rationale: "Copying theme assets into system theme directories is mutating but low blast radius compared with disk/boot/package DB operations."

