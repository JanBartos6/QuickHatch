- id: ce-forbid-parted-mklabel
  category: forbidden_install_leakage
  facts_profile:
    family: arch
    package_manager: pacman
    desktop: kde
    has_gui_session: true
    flatpak_available: true
    snap_available: false
    aur_helper: yay
  command_group:
    stage: generic
    title: "Fresh install partitioning leaked into configure-existing"
    commands:
      - "sudo parted -s /dev/sda mklabel gpt mkpart ESP fat32 1MiB 513MiB"
  expected:
    outcome: block
    final_status_effect: blocked
    blocked_reason_category: disk
  rationale: "Configure-existing must not partition disks."

