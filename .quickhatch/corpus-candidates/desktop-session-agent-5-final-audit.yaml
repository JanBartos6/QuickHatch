- id: final-persisted-kde-theme-unverified
  category: final_audit
  facts_profile:
    desktop: kde
    has_gui_session: false
    display: ""
    wayland: false
    target_user: "quickhatch"
    target_home: "/home/quickhatch"
  request:
    theme: "Breeze Dark"
    icons: ""
    cursor: ""
    wallpaper: ""
    effects: []
  command_group:
    stage: desktop
    commands:
      - "kwriteconfig6 --file kdeglobals --group General --key ColorScheme BreezeDark"
  simulated_events:
    - type: command_success
      detail: "Persistent KDE color scheme config written for target user, but no active GUI session exists."
    - type: facts_refresh
      detail: "Desktop runtime remains pending relogin with no verified KDE color scheme signal."
    - type: verification
      detail: "Final audit cannot prove live visual result."
  expected:
    design_state:
      theme: persisted_but_not_live_verified
      icons: not_requested
      cursor: not_requested
      wallpaper: not_requested
      effects: not_requested
    group_status: manual_followup
    final_status_effect: manual_followup_required
    should_execute_live_apply: false
    should_allow_persistent_config: true
  rationale: "A requested theme persisted to config is progress, but final audit must not report plain success until verified or explicitly handed off as manual follow-up."

