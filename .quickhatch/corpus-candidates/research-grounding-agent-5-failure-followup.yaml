- schema_note: candidate cases only; generated locally as simulated agents for the research-grounding lane
  id: planning-provider-429-blocks-not-success
  category: provider_error
  mode: planning
  facts_profile:
    family: generic
    package_manager: generic
  provider_error: 429 from planning model
  expected:
    final_status: blocked
    must_not_claim_success: true
  rationale: If the planner provider itself is unavailable, no setup plan exists; blocked is honest and success is illegal.
