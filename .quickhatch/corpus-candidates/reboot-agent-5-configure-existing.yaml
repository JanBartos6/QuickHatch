- id: configure-existing-raw-reboot-blocks
  category: configure_existing
  mode: configure_existing
  facts_before:
    is_live: false
    ssh_ready: true
    fstab_ok: true
    bootloader_ok: true
    kernel_ok: true
    initramfs_ok: true
    package_db_healthy: true
  stage_state_before:
    completed_groups: []
    manual_followups: []
    repair_attempts: {}
    pending_questions: []
  reboot_request:
    source: model_raw_command
    command: "sudo reboot"
    controlled: false
  reconnect_sequence: []
  facts_after:
    is_live: false
    ssh_ready: true
    same_target: true
  expected:
    should_reboot: false
    should_checkpoint_before_reboot: false
    should_resume: false
    final_status_effect: blocked
    reason: "configure-existing raw reboot must not execute silently"
  rationale: "Already-installed configuration should not reboot unless the user explicitly approves a controlled boundary."

