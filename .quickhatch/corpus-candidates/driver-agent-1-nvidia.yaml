- id: nvidia-unknown-generation-arch-open-unverified
  category: nvidia
  facts_profile:
    gpu_vendors:
      - nvidia
    gpu_models:
      - "NVIDIA Corporation Device 28ff"
    secure_boot: disabled
    is_vm: false
    has_gui_session: true
    kernel_module_loaded: unknown
    nouveau_loaded: unknown
    nvidia_driver_installed: unknown
    amd_firmware_present: unknown
    package_manager: pacman
  driver_strategy:
    requested: true
    source: repo
    packages:
      - nvidia-open
      - nvidia-utils
      - linux-headers
    confidence: low
    notes: "PCI ID is NVIDIA but generation is unknown, so open kernel module suitability is not proven."
  simulated_events:
    - type: command_success
      detail: "Repo NVIDIA packages appear to install cleanly."
      rc: 0
      stdout: "installed nvidia-open nvidia-utils"
      stderr: ""
    - type: facts_refresh
      detail: "Refreshed facts still do not prove nvidia_smi or the loaded kernel module."
      rc: 0
      stdout: "nvidia_smi_state=unknown nvidia_kernel_driver=unknown"
      stderr: ""
  expected:
    driver_status: installed_unverified
    final_status_effect: manual_followup_required
    should_reboot_verify: true
    should_continue_unrelated_setup: true
  rationale: "Unknown NVIDIA generation may be repairable, but command success alone must not certify the driver."

