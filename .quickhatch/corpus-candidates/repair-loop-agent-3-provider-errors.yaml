- id: provider-429-app-optional-soft-followup
  category: provider_error
  stage: apps
  app_or_target: "Obsidian"
  initial_failure:
    command: "sudo apt-get install -y obsidian"
    failure_type: command
    stdout: "Reading package lists... Done"
    stderr: "E: Unable to locate package obsidian"
  repair_sequence:
    - action: provider_error
      command: ""
      strategy: same
      result: provider_429
    - action: manual_followup
      command: ""
      strategy: same
      result: manual_followup
  expected:
    loop_detected: false
    budget_consumed_count: 1
    final_group_status: manual_followup
    final_status_effect: success_with_warnings
  rationale: "A provider rate limit during optional app repair should preserve progress and become a soft manual follow-up, not a hard block or retry loop."

