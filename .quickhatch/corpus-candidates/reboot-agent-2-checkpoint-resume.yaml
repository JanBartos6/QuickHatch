- id: checkpoint-before-controlled-install-reboot
  category: checkpoint
  mode: fresh_install
  facts_before:
    is_live: true
    ssh_ready: true
    fstab_ok: true
    bootloader_ok: true
    kernel_ok: true
    initramfs_ok: true
    package_db_healthy: true
  stage_state_before:
    completed_groups: ["disk", "base", "user", "bootloader"]
    manual_followups: ["optional wallpaper deferred"]
    repair_attempts:
      apps: 1
    pending_questions: []
  reboot_request:
    source: typed_operation
    command: "controlled_reboot"
    controlled: true
  reconnect_sequence:
    - state: disconnected
    - state: connected
  facts_after:
    is_live: false
    ssh_ready: true
    same_target: true
  expected:
    should_reboot: true
    should_checkpoint_before_reboot: true
    should_resume: true
    final_status_effect: none
    reason: "state must be persisted before crossing reboot boundary"
  rationale: "Completed work and manual follow-ups should survive an expected SSH disconnect."

