- id: redact-api-key-command-env
  category: redaction
  status: blocked
  representative_runlog_events:
    - event_type: "command"
      payload:
        stage: "apps"
        group_id: "apps-browser"
        command: "OPENAI_API_KEY=sk-redact curl --token fake-cli-token https://provider.example/v1"
        rc: 1
        stderr_tail: "Authorization: Bearer fake-provider-bearer-token-abcdef"
  expected_bundle_artifacts:
    - "setup-runlog-redacted.jsonl"
    - "executed-commands.sh"
    - "support-summary.json"
  required_evidence:
    - "failed command is present in redacted runlog with stage and group_id"
    - "executed command script comments failed command instead of replaying it"
    - "support summary preserves blocked/unknown status without leaking provider credentials"
  redaction_expectations:
    - "sk-redact"
    - "fake-cli-token"
    - "fake-provider-bearer-token-abcdef"
  current_likely_gap: "none"
  rationale: "Command payloads are the highest-risk support evidence because they are useful for debugging and likely to contain provider or CLI credentials."
  risk: high

- id: redact-provider-payload-error
  category: redaction
  status: manual_followup_required
  representative_runlog_events:
    - event_type: "repair_model_unavailable_manual_followup"
      payload:
        stage: "apps"
        group_id: "apps-chat"
        app: "Chat Client"
        provider_error: "429 rate limit"
        request_payload:
          model: "gpt-fake"
          api_key: "sk-redact"
          messages:
            - role: "user"
              content: "Install Chat Client; bearer_token=payload-bearer-secret"
  expected_bundle_artifacts:
    - "setup-runlog-redacted.jsonl"
    - "manual-followups.json"
    - "support-summary.json"
  required_evidence:
    - "provider error category is visible"
    - "manual follow-up item names the affected app/group"
    - "raw provider request body is redacted if included"
  redaction_expectations:
    - "sk-redact"
    - "payload-bearer-secret"
  current_likely_gap: "provider/model errors are not extracted into a dedicated artifact"
  rationale: "Support needs to know the provider failed without receiving raw prompt payloads or API keys."
  risk: high

