- id: redact-ssh-public-key-comment
  category: redaction
  status: success_with_warnings
  representative_runlog_events:
    - event_type: "facts_refresh"
      payload:
        facts:
          current_user: "jan"
          authorized_keys_preview:
            - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFakeKeyData user@private-laptop"
  expected_bundle_artifacts:
    - "setup-runlog-redacted.jsonl"
    - "setup-facts-summary.json"
  required_evidence:
    - "runlog remains useful without exposing SSH key material or identifying comments"
    - "facts summary excludes authorized_keys-style raw data"
  redaction_expectations:
    - "AAAAC3NzaC1lZDI1NTE5AAAAIFakeKeyData"
    - "user@private-laptop"
  current_likely_gap: "none"
  rationale: "SSH public key comments can identify the owner or device even when the public key itself is not secret."
  risk: medium

