- id: boot-fstab-tee-replace
  category: boot_fstab_efi
  command: 'printf "UUID=abc / ext4 defaults 0 1\n" | sudo tee /etc/fstab'
  expected: block_without_capability
  expected_capability_kind: 'write_fstab'
  expected_target: '/etc/fstab'
  facts_profile: generic
  mode: any
  rationale: 'Replaces the live fstab and can make the system unbootable.'
  risk: high
- id: boot-target-fstab-replace
  category: boot_fstab_efi
  command: 'sudo cp /tmp/new-fstab /target-root/etc/fstab'
