        - "desktop_settings_write"
  repair_plan:
    available: true
    command_groups:
      - title: "Set GTK theme"
        commands:
          - "gsettings set org.gnome.desktop.interface gtk-theme 'Adwaita-dark'"
        required_capability_kinds:
          - "desktop_settings_write"
  repair_result:
    outcome: not_attempted
    remaining_findings:
      - severity: manual_followup
        category: desktop
