- id: wallpaper-file-missing
  category: desktop_followup
  initial_findings:
    - id: "wallpaper_missing"
      severity: manual_followup
      category: desktop
      summary: "Configured wallpaper file is missing from the expected path."
      required_capability_kinds:
        - "asset_restore"
        - "desktop_settings_write"
  repair_plan:
    available: true
    command_groups:
      - title: "Restore and apply wallpaper"
        commands:
          - "install -m 0644 ./assets/wallpaper.jpg \"$HOME/Pictures/QuickHatch/wallpaper.jpg\""
          - "gsettings set org.gnome.desktop.background picture-uri \"file://$HOME/Pictures/QuickHatch/wallpaper.jpg\""
        required_capability_kinds:
          - "asset_restore"
          - "desktop_settings_write"
  repair_result:
    outcome: not_attempted
    remaining_findings:
      - severity: manual_followup
        category: desktop
        summary: "Wallpaper asset still needs to be restored and applied."
  expected:
    should_attempt_repair: false
    repair_attempts_max: 0
    final_status: manual_followup_required
    summary_must_include:
      - "wallpaper asset is missing"
    summary_must_not_claim:
      - "wallpaper was applied"
      - "fatal"
  rationale: "Missing visual assets should be clear manual follow-up, not a core setup failure."

