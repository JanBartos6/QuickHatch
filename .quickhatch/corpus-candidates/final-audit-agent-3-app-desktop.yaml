- id: desktop-font-warning
  category: desktop_followup
  initial_findings:
    - id: "preferred_font_missing"
      severity: warning
      category: desktop
      summary: "Preferred interface font Inter is not installed; system default font is in use."
      required_capability_kinds:
        - "package_install"
        - "desktop_settings_write"
  repair_plan:
    available: true
    command_groups:
      - title: "Install and set preferred font"
        commands:
          - "sudo apt-get install -y fonts-inter"
          - "gsettings set org.gnome.desktop.interface font-name 'Inter 11'"
        required_capability_kinds:
          - "package_install"
          - "desktop_settings_write"
  repair_result:
    outcome: not_attempted
    remaining_findings:
      - severity: warning
        category: desktop
        summary: "Preferred interface font Inter remains missing."
  expected:
    should_attempt_repair: false
    repair_attempts_max: 0
    final_status: success_with_warnings
    summary_must_include:
      - "system default font is in use"
    summary_must_not_claim:
      - "Inter was installed"
      - "manual follow-up is blocking setup"
  rationale: "Font preference drift is a non-fatal desktop warning and should be summarized without repair claims."
