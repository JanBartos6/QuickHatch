- id: stale-package-cache-hint
  category: app_followup
  initial_findings:
    - id: "apt_cache_stale"
      severity: warning
      category: package_db
      summary: "Package metadata appears stale; app availability checks may be out of date."
      required_capability_kinds:
        - "package_metadata_refresh"
  repair_plan:
    available: true
    command_groups:
      - title: "Refresh package metadata"
        commands:
          - "sudo apt-get update"
        required_capability_kinds:
          - "package_metadata_refresh"
  repair_result:
    outcome: not_attempted
    remaining_findings:
      - severity: warning
        category: package_db
        summary: "Package metadata remains stale."
  expected:
    should_attempt_repair: false
    repair_attempts_max: 0
    final_status: success_with_warnings
    summary_must_include:
      - "package metadata may be stale"
    summary_must_not_claim:
      - "package metadata was refreshed"
      - "blocked"
  rationale: "A stale package hint is advisory in final audit and should not be promoted to failure."

