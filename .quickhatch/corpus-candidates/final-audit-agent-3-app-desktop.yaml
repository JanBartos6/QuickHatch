- id: flatpak-app-manual-remote
  category: app_followup
  initial_findings:
    - id: "flatpak_remote_missing"
      severity: manual_followup
      category: apps
      summary: "Required Flatpak app is missing because the Flathub remote is not configured."
      required_capability_kinds:
        - "flatpak_remote_config"
  repair_plan:
    available: true
    command_groups:
      - title: "Add Flathub and install app"
        commands:
          - "flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo"
          - "flatpak install -y flathub com.slack.Slack"
        required_capability_kinds:
          - "flatpak_remote_config"
          - "flatpak_install"
  repair_result:
    outcome: capability_required
    remaining_findings:
      - severity: manual_followup
        category: apps
        summary: "Slack Flatpak still needs Flathub remote configuration."
  expected:
    should_attempt_repair: false
    repair_attempts_max: 0
    final_status: manual_followup_required
    summary_must_include:
      - "Flathub remote configuration is required"
    summary_must_not_claim:
      - "Slack Flatpak was installed"
      - "blocked"
  rationale: "Missing app plus missing remote is actionable, but final audit should leave it as manual follow-up when capability is unavailable."

- id: theme-missing
