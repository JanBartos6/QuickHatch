- id: optional-app-missing-browser
  category: app_followup
  initial_findings:
    - id: "missing_optional_browser"
      severity: warning
      category: apps
      summary: "Optional browser Brave is not installed; core setup remains usable."
      required_capability_kinds: []
  repair_plan:
    available: false
    command_groups: []
  repair_result:
    outcome: not_attempted
    remaining_findings:
      - severity: warning
        category: apps
        summary: "Optional browser Brave is still missing."
  expected:
    should_attempt_repair: false
    repair_attempts_max: 0
    final_status: success_with_warnings
    summary_must_include:
      - "Optional app Brave is missing"
    summary_must_not_claim:
      - "Brave was installed"
      - "Setup failed"
  rationale: "Optional app absence should be reported as a warning without triggering a repair loop."

- id: optional-app-missing-media
  category: app_followup
  initial_findings:
    - id: "missing_optional_vlc"
      severity: warning
      category: apps
      summary: "Optional media player VLC is not installed."
      required_capability_kinds: []
  repair_plan:
    available: true
    command_groups:
      - title: "Install optional VLC"
        commands:
          - "sudo apt-get install -y vlc"
        required_capability_kinds:
          - "package_install"
  repair_result:
    outcome: not_attempted
    remaining_findings:
      - severity: warning
        category: apps
        summary: "Optional media player VLC is not installed."
  expected:
    should_attempt_repair: false
    repair_attempts_max: 0
    final_status: success_with_warnings
    summary_must_include:
      - "VLC is optional"
    summary_must_not_claim:
      - "attempted to install VLC"
      - "fatal"
  rationale: "Even when a representative install command exists, optional app warnings should not be auto-repaired."

