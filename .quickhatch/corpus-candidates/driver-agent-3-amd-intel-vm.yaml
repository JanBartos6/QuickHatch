- id: amd-mesa-firmware-normal
  category: amd
  facts_profile:
    gpu_vendors:
      - amd
    gpu_models:
      - "AMD Radeon RX 6600"
    secure_boot: disabled
    is_vm: false
    has_gui_session: true
    kernel_module_loaded: true
    nouveau_loaded: false
    nvidia_driver_installed: false
    amd_firmware_present: true
    package_manager: apt
  driver_strategy:
    requested: true
    source: repo
    packages:
      - mesa-vulkan-drivers
      - firmware-amd-graphics
    confidence: high
    notes: "Normal AMD Mesa and firmware path; no proprietary driver expectation."
  simulated_events:
    - type: command_success
      detail: "Mesa and AMD firmware package check completed"
      rc: 0
      stdout: "mesa-vulkan-drivers firmware-amd-graphics installed"
      stderr: ""
    - type: facts_refresh
      detail: "amdgpu module present after refresh"
      rc: 0
      stdout: "amdgpu"
      stderr: ""
  expected:
    driver_status: verified
    final_status_effect: none
    should_reboot_verify: false
    should_continue_unrelated_setup: true
  rationale: "AMD with amdgpu loaded and firmware present should verify through normal Mesa/firmware facts without overblocking."

