- id: common-vlc-ubuntu-repo
  category: common_app
  facts_profile:
    family: ubuntu
    package_manager: apt
    community_helper: none
  requested_apps:
    - VLC
  catalog_hint:
    compatibility: native
    source_hint: repo
    active_install_hint:
      family: ubuntu
      source: repo
      packages: [vlc]
  expected:
    package_name: vlc
    source: repo
    status: pending
    evidence_source: repo_search
  rationale: Common app with target repo evidence should resolve to the known distro package.

