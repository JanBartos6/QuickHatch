- id: stale-lm-studio-arch-community
  category: stale_package
  facts_profile:
    family: arch
    package_manager: pacman
    community_helper: yay
  requested_apps:
    - LM Studio
  initial_package: lm-studio-bin
  search_results:
    repo_search:
      lm-studio-bin: ""
      LM Studio: ""
    community_search:
      lm-studio-bin: "aur/lmstudio-bin 0.3.0\n    LM Studio desktop package"
  expected:
    package_name: lmstudio-bin
    source: community
    status: pending
    retry_command: yay -S --noconfirm lmstudio-bin
  rationale: Stale package spelling should be repaired from target community search, not treated as catalog truth.

- id: stale-github-desktop-arch-community
  category: stale_package
  facts_profile:
    family: arch
    package_manager: pacman
    community_helper: yay
  requested_apps:
    - GitHub Desktop
  initial_package: github-desktop-bin
  search_results:
    repo_search:
      github-desktop-bin: ""
      GitHub Desktop: ""
    community_search:
      github-desktop-bin: "aur/github-desktop 3.4.0\n    GitHub Desktop for Linux"
  expected:
    package_name: github-desktop
    source: community
    status: pending
    retry_command: yay -S --noconfirm github-desktop
  rationale: App names with changing community packages should prefer current target search evidence.
