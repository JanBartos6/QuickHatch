- id: drv4-nvidia-installed-module-pending-reboot
  category: reboot_required
  facts_profile:
    gpu_vendors:
      - nvidia
    gpu_models:
      - "NVIDIA GeForce RTX 3060"
    secure_boot: disabled
    is_vm: false
    has_gui_session: true
    kernel_module_loaded: false
    nouveau_loaded: false
    nvidia_driver_installed: true
    amd_firmware_present: unknown
    package_manager: pacman
  driver_strategy:
    requested: true
    source: repo
    packages:
      - nvidia-open
      - nvidia-utils
      - linux-headers
    confidence: high
    notes: "Packages installed but the NVIDIA kernel module is not loaded until reboot."
  simulated_events:
    - type: command_success
      detail: "repo driver packages installed and initramfs hook completed"
      rc: 0
      stdout: "installed nvidia-open nvidia-utils linux-headers"
      stderr: ""
    - type: facts_refresh
      detail: "pre-reboot facts still show no loaded NVIDIA module"
      rc: 0
      stdout: "nvidia_smi=missing kernel_driver=missing"
      stderr: ""
    - type: reboot_required
      detail: "driver stage requires reboot before verification"
      rc: 0
      stdout: ""
      stderr: ""
  expected:
    driver_status: installed_unverified
    final_status_effect: manual_followup_required
    should_reboot_verify: true
    should_continue_unrelated_setup: true
  rationale: "Successful package installation is not driver success until a reboot and refreshed facts prove the module loaded."

