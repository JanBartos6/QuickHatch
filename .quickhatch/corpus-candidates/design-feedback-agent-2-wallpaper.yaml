- id: wallpaper-xfce-no-session-live-only
  category: no_session
  desktop:
    environment: xfce
    has_gui_session: false
    target_user: quickhatch
    target_home: /home/quickhatch
  request:
    theme: ""
    icons: ""
    cursor: ""
    wallpaper: /home/quickhatch/Pictures/forest.png
    effects: []
  facts_before:
    active_theme: Greybird
    active_icons: elementary-xfce
    active_cursor: Adwaita
    active_wallpaper: ""
    effects: []
  attempted_commands:
    - "xfconf-query -c xfce4-desktop -p /backdrop/screen0/monitor0/workspace0/last-image -s /home/quickhatch/Pictures/forest.png"
  command_result:
    rc: 1
    stdout: ""
    stderr: "Cannot open display."
  facts_after_attempt:
    active_theme: Greybird
    active_icons: elementary-xfce
    active_cursor: Adwaita
    active_wallpaper: ""
    effects: []
  repair_result:
    action: manual_followup
    facts_after_repair:
      active_theme: Greybird
      active_icons: elementary-xfce
      active_cursor: Adwaita
      active_wallpaper: ""
      effects: []
  expected:
    element_status:
      theme: not_requested
      icons: not_requested
      cursor: not_requested
      wallpaper: no_active_gui_session
      effects: not_requested
    final_status_effect: manual_followup_required
  rationale: "Live XFCE wallpaper application cannot be verified without an active desktop session."

