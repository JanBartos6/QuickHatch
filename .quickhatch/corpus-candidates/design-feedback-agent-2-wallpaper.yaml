- id: wallpaper-kde-missing-asset
  category: wallpaper
  desktop:
    environment: kde
    has_gui_session: true
    target_user: quickhatch
    target_home: /home/quickhatch
  request:
    theme: ""
    icons: ""
    cursor: ""
    wallpaper: /home/quickhatch/Pictures/wallpapers/aurora.png
    effects: []
  facts_before:
    active_theme: Breeze
    active_icons: Breeze
    active_cursor: Breeze
    active_wallpaper: /home/quickhatch/Pictures/wallpapers/old.png
    effects: []
  attempted_commands:
    - "plasma-apply-wallpaperimage /home/quickhatch/Pictures/wallpapers/aurora.png"
  command_result:
    rc: 1
    stdout: ""
    stderr: "The file does not exist."
  facts_after_attempt:
    active_theme: Breeze
    active_icons: Breeze
    active_cursor: Breeze
    active_wallpaper: /home/quickhatch/Pictures/wallpapers/old.png
    effects: []
  repair_result:
    action: none
    facts_after_repair:
      active_theme: Breeze
      active_icons: Breeze
      active_cursor: Breeze
      active_wallpaper: /home/quickhatch/Pictures/wallpapers/old.png
      effects: []
  expected:
    element_status:
      theme: not_requested
      icons: not_requested
      cursor: not_requested
      wallpaper: asset_missing
      effects: not_requested
    final_status_effect: blocked
  rationale: "The wallpaper path is missing, so neither command success nor repair can verify the requested asset."

