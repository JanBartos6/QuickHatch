- id: required-empty-group-rejects
  category: command_group_contract
  output_kind: research_plan
  model_output: '{"plan":[{"stage":"verification","title":"Run mandatory checks","commands":[],"rationale":"Tests must pass before completion.","required":true,"evidence":["The project has a test suite."],"verification_commands":[]}]}'
