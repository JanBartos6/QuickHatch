  model_output: "```json\n{\"plan\":[{\"stage\":\"setup\",\"title\":\"Install dependencies\",\"commands\":[\"npm ci\"],\"rationale\":\"Install dependencies exactly from the lockfile.\",\"required\":true,\"evidence\":[\"package-lock.json is present.\"],\"verification_commands\":[\"npm test\"]}]}\n```"
  expected:
