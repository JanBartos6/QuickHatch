- id: prompt-contract-demands-command-groups
  category: prompt_contract
  output_kind: prompt_contract
  model_output: "Return only JSON. Each command group must include stage, title or id, commands or operations, rationale, required status, evidence, and verification_commands. Do not include heredocs, prose commands, or harness-owned executable stages."
  expected:
    outcome: accept
    parser: prompt_text
    normalized_assertions:
      - "prompt mentions stage"
      - "prompt mentions title or id"
      - "prompt distinguishes commands or operations"
      - "prompt prohibits heredocs and harness-owned executable stages"
    error_contains: ""
  rationale: "The prompt contract itself should state the command group structure and key forbidden shapes."
  risk: low
