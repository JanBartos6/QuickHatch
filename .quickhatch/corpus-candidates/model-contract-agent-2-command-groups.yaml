  output_kind: research_plan
  model_output: '{"plan":[{"stage":"verification","id":"unit-test-pass","commands":["pytest -q"],"rationale":"Run the unit test suite.","required":true,"evidence":["pyproject.toml configures pytest."],"verification_commands":["pytest -q"]}]}'
