- id: command-groups-minimal-valid
  category: command_group_contract
  output_kind: research_plan
  model_output: '{"plan":[{"stage":"system","title":"Inspect environment","commands":["python --version"],"rationale":"Confirm the local interpreter before selecting setup steps.","source":"runtime","required":true,"evidence":["Python version is needed to choose compatible commands."],"verification_commands":["python --version"]}]}'
  expected:
    outcome: accept
    parser: extract_research_plan
    normalized_assertions:
      - "one command group is present"
      - "stage is system"
      - "required is true"
      - "commands and verification_commands are arrays"
    error_contains: ""
  rationale: "Baseline valid command group with all expected fields represented as bounded JSON."
  risk: low

- id: stage-alias-dependencies-normalizes
  category: command_group_contract
  output_kind: research_plan
  model_output: '{"plan":[{"stage":"deps","id":"install-packages","title":"Install packages","commands":["npm ci"],"reason":"Install lockfile-pinned dependencies.","packages":["package-lock.json"],"status":"required","evidence":["package-lock.json exists in the project root."],"verification_commands":["npm test -- --runInBand"]}]}'
  expected:
    outcome: normalize
    parser: extract_research_plan
    normalized_assertions:
      - "stage alias deps normalizes to dependencies"
      - "reason normalizes to rationale"
      - "status required normalizes to required true"
      - "packages are preserved as source/package evidence"
    error_contains: ""
  rationale: "Models often use short stage aliases and status strings; the contract should normalize common safe aliases."
  risk: medium

- id: stage-alias-verify-normalizes
  category: command_group_contract
  output_kind: research_plan
  model_output: '{"command_groups":[{"stage":"verify","title":"Run checks","commands":["npm run lint","npm test"],"rationale":"Validate the proposed change before delivery.","required":true,"evidence":["Project scripts expose lint and test commands."],"verification_commands":["npm run lint","npm test"]}]}'
  expected:
    outcome: normalize
    parser: extract_research_plan
    normalized_assertions:
      - "command_groups key is accepted as plan groups"
      - "stage alias verify normalizes to verification"
      - "verification commands are preserved in order"
    error_contains: ""
  rationale: "Accepts a common alternate top-level key and a common verification stage alias without losing command order."
  risk: medium

- id: harness-owned-stage-rejects-command
  category: command_group_contract
  output_kind: research_plan
  model_output: '{"plan":[{"stage":"harness","title":"Run release smoke","commands":["./release-smoke/run.sh"],"rationale":"The harness should validate the package.","required":true,"evidence":["Release smoke exists."],"verification_commands":["./release-smoke/run.sh"]}]}'
  expected:
    outcome: reject
    parser: extract_research_plan
    normalized_assertions: []
    error_contains: "harness-owned"
  rationale: "Harness-owned stages should not be emitted as executable model command groups."
  risk: high

- id: harness-owned-stage-no-commands-manual
  category: manual_followup
  output_kind: research_plan
  model_output: '{"plan":[{"stage":"harness","title":"Harness validation","operations":[],"rationale":"The external harness should run its managed validations.","required":false,"evidence":["No local command should be executed by the model."],"verification_commands":[]}]}'
  expected:
    outcome: manual_followup
    parser: extract_research_plan
    normalized_assertions:
      - "harness-owned stage without commands becomes manual follow-up"
      - "required false is preserved"
    error_contains: ""
  rationale: "A harness-owned stage may be useful as a non-executable handoff, but it must not become a runnable command group."
  risk: medium

- id: missing-title-and-id-rejects
  category: command_group_contract
  output_kind: research_plan
  model_output: '{"plan":[{"stage":"dependencies","commands":["npm ci"],"rationale":"Install dependencies.","required":true,"evidence":["package-lock.json"],"verification_commands":["npm test"]}]}'
  expected:
    outcome: reject
