- id: prose-command-rejects
  category: command_group_contract
  output_kind: research_plan
  model_output: '{"plan":[{"stage":"setup","title":"Install dependencies","commands":["Install the Node packages and then run the tests."],"rationale":"Dependencies must be installed.","required":true,"evidence":["package.json"],"verification_commands":["npm test"]}]}'
  expected:
    outcome: reject
    parser: extract_research_plan
    normalized_assertions: []
    error_contains: "command"
  rationale: "Executable command slots must contain commands, not prose instructions that require interpretation."
  risk: high

- id: heredoc-command-rejects
  category: command_group_contract
  output_kind: research_plan
  model_output: '{"plan":[{"stage":"setup","title":"Write config","commands":["cat <<EOF > config.json\n{\"debug\":true}\nEOF"],"rationale":"Create a temporary config file.","required":true,"evidence":["A config file is needed."],"verification_commands":["cat config.json"]}]}'
  expected:
    outcome: reject
    parser: extract_research_plan
    normalized_assertions: []
    error_contains: "heredoc"
  rationale: "Heredoc commands can hide multi-line file writes and should be rejected by the model contract."
  risk: high

- id: optional-empty-group-accepts
  category: command_group_contract
  output_kind: research_plan
  model_output: '{"plan":[{"stage":"optional","title":"Browser screenshot check","commands":[],"rationale":"A visual check is useful only when a browser plugin is available.","required":false,"evidence":["Frontend changes may need visual confirmation."],"verification_commands":[]}]}'
