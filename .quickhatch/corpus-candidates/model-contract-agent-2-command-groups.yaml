- id: blank-command-string-rejects
  category: command_group_contract
  output_kind: research_plan
  model_output: '{"plan":[{"stage":"setup","title":"Prepare workspace","commands":[""],"rationale":"Prepare the repository.","required":true,"evidence":["Setup is needed."],"verification_commands":["npm test"]}]}'
