  risk: low

- id: prose-preface-with-json-normalizes
  category: json_parseability
  output_kind: research_plan
  model_output: "Here is the bounded plan:\n{\"plan\":[{\"stage\":\"verification\",\"title\":\"Run lint\",\"commands\":[\"npm run lint\"],\"rationale\":\"Lint catches style and static issues.\",\"required\":true,\"evidence\":[\"package.json defines lint.\"],\"verification_commands\":[\"npm run lint\"]}]}"
  expected:
