- id: pre-reboot-stop-after-checkpoint-before-reboot-command
  category: pre_reboot_stop
  mode: fresh_install
  stage: reboot
  state_before:
    completed_groups:
      - bootstrap
      - fstab
      - bootloader
      - pre_reboot_audit
    active_group: "controlled reboot"
    pending_question: false
    reboot_planned: true
    destructive_capability_pending: false
    manual_followups:
      - "optional wallpaper not verified"
  event:
    type: user_stop
