- id: pre-reboot-stop-after-checks-pass
  category: pre_reboot_stop
  mode: fresh_install
  stage: pre_reboot
  state_before:
    completed_groups:
      - partition
      - format
      - bootstrap
      - fstab
      - bootloader
      - ssh_continuity_check
    active_group: "pre-reboot gate"
    pending_question: false
    reboot_planned: true
    destructive_capability_pending: false
    manual_followups: []
  event:
    type: user_stop
    reason: "User clicked stop after pre-reboot checks passed but before controlled reboot was issued."
  expected:
    no_new_groups_started: true
    no_new_destructive_work: true
    no_reboot_started: true
    pending_question_cleared_or_marked: true
    logs_preserved: true
    support_bundle_explains_abort: true
    final_status: aborted
    summary_must_include:
      - "user stopped setup"
      - "before reboot"
      - "pre-reboot checks passed"
    summary_must_not_claim:
      - "reboot completed"
      - "post-reboot verification passed"
      - "success"
  rationale: "A user stop after a safe pre-reboot gate must prevent the harness-owned reboot and preserve checkpoint evidence."

