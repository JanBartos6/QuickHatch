- id: reboot-queued-stop-before-dispatch
  category: pre_reboot_stop
  mode: fresh_install
  stage: reboot
  state_before:
    completed_groups:
      - install
      - pre_reboot_audit
    active_group: "queued controlled reboot"
    pending_question: false
    reboot_planned: true
    destructive_capability_pending: false
    manual_followups: []
  event:
    type: user_stop
    reason: "Stop requested while controlled reboot operation was queued but not yet dispatched."
  expected:
    no_new_groups_started: true
    no_new_destructive_work: true
    no_reboot_started: true
    pending_question_cleared_or_marked: true
    logs_preserved: true
    support_bundle_explains_abort: true
    final_status: aborted
    summary_must_include:
      - "user stopped setup"
      - "queued reboot cancelled"
    summary_must_not_claim:
      - "reboot started"
      - "target reconnected"
      - "success"
  rationale: "Queued reboot work is still future work and must be cancelled by a stop request."

