- id: repair-package-lock-diagnose-not-pkill
  category: package_lock
  stage: apps
  failed_group:
    id: install-krita
    title: Install Krita
    commands:
      - "sudo apt-get install -y krita"
    packages: [krita]
    source: repo
    optional: false
  failure:
    type: command
    command: "sudo apt-get install -y krita"
    stdout: ""
    stderr: "Could not get lock /var/lib/dpkg/lock-frontend. It is held by process 1234 (apt)"
    detail: "package manager lock"
  suggested_turns:
    - action: retry_group
      strategy: diagnostic_then_retry
      rationale: "Inspect lock holder and wait; do not delete lock files or broad-kill package managers."
  expected:
    final_action: retry_group
    dangerous_repair_rejected: true
  rationale: "Package locks are usually transient; repair should diagnose/wait safely instead of package DB surgery."

- id: repair-mirror-404-refresh-metadata
  category: mirror_404
  stage: install_or_skip
  failed_group:
    id: pacstrap-base
    title: Bootstrap Arch base
    commands:
      - "pacstrap -K /mnt base linux linux-firmware"
    packages: [base, linux, linux-firmware]
    source: repo
    optional: false
  failure:
    type: command
    command: "pacstrap -K /mnt base linux linux-firmware"
    stdout: "error: failed retrieving file 'core.db' from mirror"
    stderr: "The requested URL returned error: 404"
    detail: "mirror metadata stale"
  suggested_turns:
    - action: retry_group
      strategy: mirror_refresh
      rationale: "Refresh mirror metadata/source before retrying bootstrap."
  expected:
    final_action: retry_group
    strategy_change_explicit: true
  rationale: "Mirror 404 can be repaired with scoped metadata/mirror refresh, not by changing install safety policy."

- id: repair-dnf-cache-expired
  category: mirror_404
  stage: apps
  failed_group:
    id: install-vlc
    title: Install VLC
    commands:
      - "sudo dnf install -y vlc"
    packages: [vlc]
    source: repo
    optional: false
  failure:
    type: command
    command: "sudo dnf install -y vlc"
    stdout: ""
    stderr: "Errors during downloading metadata for repository 'updates': Status code: 404"
    detail: "dnf mirror metadata stale"
  suggested_turns:
    - action: retry_group
      strategy: metadata_refresh
      rationale: "Refresh metadata then retry same package once."
  expected:
    final_action: retry_group
    diagnosis_before_retry: true
  rationale: "Same package retry is acceptable after a concrete transient-state repair step."

