- id: secureboot-nvidia-unsigned-dkms-rejected
  category: secure_boot
  facts_profile:
    gpu_vendors:
      - nvidia
    gpu_models:
      - "NVIDIA GeForce RTX 3070"
    secure_boot: enabled
    is_vm: false
    has_gui_session: true
    kernel_module_loaded: false
    nouveau_loaded: false
    nvidia_driver_installed: true
    amd_firmware_present: unknown
    package_manager: apt
  driver_strategy:
    requested: true
    source: repo
    packages:
      - nvidia-driver
      - dkms
    confidence: medium
    notes: "DKMS NVIDIA module installed but rejected by Secure Boot because it is unsigned."
  simulated_events:
    - type: command_success
      detail: "nvidia driver packages installed from distro repository"
      rc: 0
      stdout: "Setting up nvidia-dkms..."
      stderr: ""
    - type: module_probe
      detail: "kernel refuses unsigned NVIDIA module"
      rc: 1
      stdout: ""
      stderr: "modprobe: ERROR: could not insert 'nvidia': Key was rejected by service"
  expected:
    driver_status: manual_followup_required
    final_status_effect: manual_followup_required
    should_reboot_verify: true
    should_continue_unrelated_setup: true
  rationale: "Secure Boot can reject unsigned DKMS modules after a successful package install; the harness must not claim verified driver success until signing/MOK enrollment and reboot verification complete."

