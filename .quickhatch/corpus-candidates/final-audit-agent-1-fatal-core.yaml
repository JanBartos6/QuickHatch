- id: missing-root-fstab
  category: fatal_core
  initial_findings:
    - id: "fstab-root-missing"
      severity: fatal
      category: fstab
      summary: "/etc/fstab has no root filesystem entry, so the installed system may not mount its root volume on boot."
      required_capability_kinds: ["filesystem_read", "block_device_inspection"]
  repair_plan:
    available: false
    command_groups: []
  repair_result:
    outcome: not_attempted
    remaining_findings:
      - severity: fatal
        category: fstab
        summary: "Root filesystem entry is still missing from /etc/fstab."
  expected:
    should_attempt_repair: false
    repair_attempts_max: 0
    final_status: blocked
    summary_must_include:
      - "root filesystem entry is missing"
      - "blocked"
    summary_must_not_claim:
      - "fstab repaired"
      - "system is bootable"
  rationale: "A missing root mount is a core boot blocker. Guessing the correct device or UUID is unsafe without explicit validated disk mapping."

- id: stale-root-uuid
  category: fatal_core
  initial_findings:
    - id: "fstab-root-uuid-not-found"
      severity: fatal
      category: fstab
      summary: "/etc/fstab references a root UUID that is not present in blkid output."
      required_capability_kinds: ["filesystem_read", "block_device_inspection"]
  repair_plan:
    available: true
    command_groups:
      - title: "Verify candidate root volume"
        commands:
          - "blkid"
          - "findmnt --target /mnt"
          - "lsblk -f"
        required_capability_kinds: ["block_device_inspection"]
      - title: "Rewrite fstab only after verified mapping"
        commands:
          - "mount /dev/disk/by-uuid/<verified-root-uuid> /mnt"
          - "sed -i 's/UUID=<stale>/UUID=<verified-root-uuid>/' /mnt/etc/fstab"
        required_capability_kinds: ["filesystem_write", "mount"]
  repair_result:
    outcome: capability_required
    remaining_findings:
      - severity: fatal
        category: fstab
        summary: "Root UUID remains stale because filesystem write and mount capability were unavailable."
  expected:
    should_attempt_repair: false
    repair_attempts_max: 0
    final_status: blocked
    summary_must_include:
      - "root UUID is not present"
      - "requires verified disk mapping"
    summary_must_not_claim:
      - "UUID corrected"
      - "repair completed"
  rationale: "The repair can be safe only with block-device verification and write access to the installed system."

- id: malformed-fstab
  category: fatal_core
  initial_findings:
