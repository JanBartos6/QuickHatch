- id: pacman-db-partial-transaction
  category: fatal_core
  initial_findings:
    - id: "package-partial-upgrade"
      severity: fatal
      category: package_db
      summary: "Package database shows an interrupted transaction with partially installed core packages."
      required_capability_kinds: ["package_query", "filesystem_read"]
  repair_plan:
    available: true
    command_groups:
      - title: "Complete or roll forward transaction"
        commands:
          - "arch-chroot /mnt pacman -Syu"
          - "arch-chroot /mnt pacman -Qkk filesystem linux systemd"
        required_capability_kinds: ["chroot", "package_install", "network_access"]
  repair_result:
    outcome: capability_required
    remaining_findings:
      - severity: fatal
        category: package_db
        summary: "Interrupted package transaction remains unresolved because package install capability was unavailable."
  expected:
    should_attempt_repair: false
    repair_attempts_max: 0
    final_status: blocked
    summary_must_include:
      - "interrupted transaction"
      - "requires package repair capability"
    summary_must_not_claim:
      - "transaction completed"
      - "core packages are consistent"
  rationale: "Partial core package state is fatal, but fixing it needs controlled package operations inside the verified target system."

