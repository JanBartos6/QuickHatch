          - "arch-chroot /mnt pacman -S linux grub"
          - "arch-chroot /mnt mkinitcpio -P"
          - "arch-chroot /mnt grub-mkconfig -o /boot/grub/grub.cfg"
        required_capability_kinds: ["mount", "chroot", "package_install", "bootloader_install"]
  repair_result:
    outcome: capability_required
    remaining_findings:
      - severity: fatal
        category: bootability
        summary: "Boot partition remains empty because boot repair capabilities were unavailable."
  expected:
    should_attempt_repair: false
    repair_attempts_max: 0
    final_status: blocked
    summary_must_include:
      - "boot partition is empty"
      - "blocked"
    summary_must_not_claim:
      - "boot partition populated"
      - "bootloader configured"
  rationale: "An empty boot partition is repairable only after mounting the right target volumes and regenerating boot artifacts safely."
