- id: catalog-advisory-not-authoritative
  category: prompt_contract
  output_kind: prompt_contract
  model_output: "Treat the selected app catalog as advisory metadata only. Use it to form candidate package names, then verify package availability and source trust through the OS repository or vendor documentation before producing install operations."
