  model_output: '{"summary":"Use provider-native search to find current setup docs, but do not cite a URL until the result is opened and verified.","steps":[{"kind":"provider_search","query":"official install guide package signing secure boot","purpose":"Locate current provider documentation."},{"kind":"open_result","result_ref":"search_result_1","purpose":"Verify the URL and extract the relevant installation constraint."}],"evidence":[],"unresolved_questions":["The authoritative URL is not known until a search result is opened."]}'
