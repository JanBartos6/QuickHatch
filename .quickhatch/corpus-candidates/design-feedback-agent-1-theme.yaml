- id: theme-kde-rc0-unchanged
  category: theme
  desktop:
    environment: kde
    has_gui_session: true
    target_user: quickhatch
    target_home: /home/quickhatch
  request:
    theme: Sweet-Dark
    icons: ""
    cursor: ""
    wallpaper: ""
    effects: []
  facts_before:
    active_theme: Breeze
    active_icons: Breeze
    active_cursor: Breeze
    active_wallpaper: /usr/share/wallpapers/Next/contents/images/1920x1080.png
    effects: []
  attempted_commands:
    - "lookandfeeltool -a org.kde.sweet-dark.desktop"
  command_result:
    rc: 0
    stdout: "Look and feel package successfully applied."
    stderr: ""
  facts_after_attempt:
    active_theme: Breeze
    active_icons: Breeze
    active_cursor: Breeze
    active_wallpaper: /usr/share/wallpapers/Next/contents/images/1920x1080.png
    effects: []
  repair_result:
    action: none
    facts_after_repair:
      active_theme: Breeze
      active_icons: Breeze
      active_cursor: Breeze
      active_wallpaper: /usr/share/wallpapers/Next/contents/images/1920x1080.png
      effects: []
  expected:
    element_status:
      theme: failed_to_apply
      icons: not_requested
      cursor: not_requested
      wallpaper: not_requested
      effects: not_requested
    final_status_effect: manual_followup_required
  rationale: "Command success is not enough; refreshed KDE facts still report the old theme."

