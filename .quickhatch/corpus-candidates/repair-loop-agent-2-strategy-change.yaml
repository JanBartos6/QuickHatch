- id: strategy-app-all-sources-exhausted-manual-followup
  category: strategy_change
  stage: apps
  app_or_target: "Fictional CAD Tool"
  initial_failure:
    command: "sudo apt install -y fictional-cad"
    failure_type: command
    stdout: "Reading package lists... Done"
    stderr: "E: Unable to locate package fictional-cad"
  repair_sequence:
    - action: search
      command: "flatpak search fictional-cad"
      strategy: diagnostic
      result: failure
    - action: strategy_change
      command: "flatpak install -y flathub com.example.FictionalCAD"
      strategy: flatpak
      result: failure
    - action: search
      command: "snap find fictional-cad"
      strategy: diagnostic
      result: failure
    - action: strategy_change
      command: "sudo snap install fictional-cad"
      strategy: snap
      result: failure
    - action: manual_followup
      command: ""
      strategy: same
      result: manual_followup
  expected:
    loop_detected: false
    budget_consumed_count: 4
    final_group_status: manual_followup
    final_status_effect: success_with_warnings
  rationale: "Exhausting different sources should end in explicit manual follow-up, but should not be misclassified as an identical retry loop."
