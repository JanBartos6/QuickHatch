- id: strategy-app-repo-to-flatpak-obsidian
  category: strategy_change
  stage: apps
  app_or_target: "Obsidian"
  initial_failure:
    command: "sudo apt-get install -y obsidian"
    failure_type: command
    stdout: "Reading package lists... Done"
    stderr: "E: Unable to locate package obsidian"
  repair_sequence:
    - action: search
      command: "flatpak search obsidian"
      strategy: diagnostic
      result: success
    - action: strategy_change
      command: "flatpak install -y flathub md.obsidian.Obsidian"
      strategy: flatpak
      result: success
  expected:
    loop_detected: false
    budget_consumed_count: 1
    final_group_status: completed
    final_status_effect: none
  rationale: "Changing from a missing repo package to a Flatpak source is a distinct repair strategy and should not count as an identical retry loop."

