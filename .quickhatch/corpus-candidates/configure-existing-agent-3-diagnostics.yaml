- id: ce-diag-lsblk-readonly
  category: diagnostics
  facts_profile:
    family: generic
    package_manager: generic
    desktop: unknown
    has_gui_session: unknown
    flatpak_available: unknown
    snap_available: unknown
    aur_helper: unknown
  command_group:
    stage: final_audit
    title: "Inspect block devices"
    commands:
      - "lsblk -o NAME,SIZE,TYPE,FSTYPE,MOUNTPOINTS"
      - "findmnt -R /"
  expected:
    outcome: allow
    final_status_effect: none
    blocked_reason_category: ""
  rationale: "Read-only disk and mount inspection must remain allowed in configure-existing mode."

