- id: ce-diag-ssh-readonly
  category: network_ssh
  facts_profile:
    family: ubuntu
    package_manager: apt
    desktop: none
    has_gui_session: false
    flatpak_available: false
    snap_available: true
    aur_helper: none
  command_group:
    stage: final_audit
    title: "Inspect SSH service"
    commands:
      - "ss -tlnp | grep ':22 ' || true"
      - "systemctl status ssh --no-pager"
      - "grep -E '^(Port|PermitRootLogin|PasswordAuthentication)' /etc/ssh/sshd_config || true"
  expected:
    outcome: allow
    final_status_effect: none
    blocked_reason_category: ""
  rationale: "SSH diagnostics are allowed; only continuity-breaking mutations should block."

