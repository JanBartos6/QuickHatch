- id: req-opt-optional-theme-failure-nonfatal
  category: required_optional
  facts_profile:
    family: arch
    package_manager: pacman
    installed_apps_before: []
    installed_apps_after:
      - firefox
      - kate
    flatpak_available: false
    snap_available: false
    aur_helper: yay
  plan:
    requested_apps:
      - name: Firefox
        package: firefox
        source: repo
        required: true
      - name: Kate
        package: kate
        source: repo
        required: true
      - name: Sweet KDE Theme
        package: sweet-kde-theme
        source: aur
        required: false
    command_groups:
      - title: Install apps and optional theme
        packages:
          - firefox
          - kate
          - sweet-kde-theme
        commands:
          - "sudo pacman -S --noconfirm firefox kate sweet-kde-theme"
  simulated_events:
    - type: command_failure
      app: ""
      package: ""
      rc: 1
      stdout: "firefox kate installed"
      stderr: "error: target not found: sweet-kde-theme"
      repair_strategy: ""
      provider_error: ""
    - type: verification
      app: Firefox
      package: firefox
      rc: 0
      stdout: "verified"
      stderr: ""
      repair_strategy: ""
      provider_error: ""
  expected:
    completed_apps:
      - Firefox
      - Kate
    manual_followup_apps:
      - Sweet KDE Theme
    failed_apps: []
    alternatives: []
    final_status: success_with_warnings
    must_not_block: true
    invariants:
      - successful_apps_preserved
      - failure_isolated
      - final_status_honest
  rationale: "Optional cosmetic failure should be warning/follow-up, not a blocked setup."

- id: req-opt-required-browser-unresolved-honest
  category: required_optional
  facts_profile:
    family: debian
    package_manager: apt
    installed_apps_before: []
    installed_apps_after:
      - vlc
    flatpak_available: true
    snap_available: false
    aur_helper: none
  plan:
    requested_apps:
      - name: VLC
        package: vlc
        source: repo
        required: true
      - name: Work Browser
        package: work-browser
        source: repo
        required: true
    command_groups:
      - title: Install required work apps
        packages:
          - vlc
          - work-browser
        commands:
          - "sudo apt-get install -y vlc work-browser"
  simulated_events:
    - type: command_failure
      app: ""
      package: ""
      rc: 100
      stdout: "vlc installed"
      stderr: "E: Unable to locate package work-browser"
      repair_strategy: ""
      provider_error: ""
    - type: verification
      app: Work Browser
      package: work-browser
      rc: 1
      stdout: ""
      stderr: "not installed"
      repair_strategy: ""
      provider_error: ""
  expected:
    completed_apps:
      - VLC
    manual_followup_apps:
      - Work Browser
    failed_apps: []
    alternatives: []
    final_status: manual_followup_required
    must_not_block: true
    invariants:
      - successful_apps_preserved
      - failure_isolated
      - final_status_honest
  rationale: "A required unresolved app cannot be hidden as success, but a missing package is not itself a safety block."

- id: alt-chromium-does-not-satisfy-google-chrome
  category: alternative_app
  facts_profile:
    family: fedora
    package_manager: dnf
    installed_apps_before: []
    installed_apps_after:
      - chromium
    flatpak_available: true
    snap_available: false
    aur_helper: none
  plan:
    requested_apps:
      - name: Google Chrome
        package: google-chrome-stable
        source: repo
        required: true
    command_groups:
      - title: Install Chrome or browser fallback
        packages:
          - google-chrome-stable
        commands:
          - "sudo dnf install -y google-chrome-stable"
  simulated_events:
    - type: command_failure
      app: Google Chrome
      package: google-chrome-stable
      rc: 1
      stdout: ""
      stderr: "No match for argument: google-chrome-stable"
      repair_strategy: ""
      provider_error: ""
    - type: repair_response
      app: Google Chrome
      package: chromium
      rc: 0
      stdout: "Install Chromium as alternative"
      stderr: ""
      repair_strategy: alternative_repo
      provider_error: ""
    - type: command_success
      app: Chromium
      package: chromium
      rc: 0
      stdout: "installed"
      stderr: ""
      repair_strategy: alternative_repo
      provider_error: ""
  expected:
    completed_apps: []
    manual_followup_apps:
      - Google Chrome
    failed_apps: []
    alternatives:
      - Chromium
    final_status: manual_followup_required
    must_not_block: true
    invariants:
      - failure_isolated
      - final_status_honest
  rationale: "Installing an alternative browser must not silently mark the originally requested required app complete."

