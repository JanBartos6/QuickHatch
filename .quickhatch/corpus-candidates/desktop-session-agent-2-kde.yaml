    - type: verification
      detail: "Target user's KDE color scheme remains unchanged."
  expected:
    design_state:
      theme: attempted_but_failed
      icons: not_requested
      cursor: not_requested
      wallpaper: not_requested
      effects: not_requested
    group_status: manual_followup
    final_status_effect: manual_followup_required
    should_execute_live_apply: false
    should_allow_persistent_config: false
  rationale: "Writing root KDE config does not satisfy a target-user desktop request and should be detected or surfaced as follow-up."

