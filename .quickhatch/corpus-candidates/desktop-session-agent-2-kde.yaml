- id: kde-theme-persist-no-gui
  category: theme
  facts_profile:
    desktop: kde
    has_gui_session: false
    display: ""
    wayland: unknown
    target_user: "quickhatch"
    target_home: "/home/quickhatch"
  request:
    theme: "Breeze Dark"
    icons: ""
    cursor: ""
    wallpaper: ""
    effects: []
  command_group:
    stage: desktop
    commands:
      - "kwriteconfig6 --file kdeglobals --group General --key ColorScheme BreezeDark"
  simulated_events:
    - type: command_success
      detail: "Persistent KDE color scheme config write succeeds without active GUI session."
    - type: facts_refresh
      detail: "No active display is discovered after the write."
  expected:
    design_state:
      theme: persisted_but_not_live_verified
      icons: not_requested
      cursor: not_requested
      wallpaper: not_requested
      effects: not_requested
    group_status: warning
    final_status_effect: success_with_warnings
    should_execute_live_apply: false
    should_allow_persistent_config: true
  rationale: "Safe persistent KDE config may proceed without a live GUI, but the harness must not claim live visual verification."

