- id: repo-to-aur-stale-package-hint
  category: source_fallback
  facts_profile:
    family: arch
    package_manager: pacman
    installed_apps_before: []
    installed_apps_after:
      - visual-studio-code-bin
    flatpak_available: true
    snap_available: false
    aur_helper: yay
  plan:
    requested_apps:
      - name: Visual Studio Code
        package: code
        source: repo
        required: true
    command_groups:
      - title: Install editor from repo hint
        packages:
          - code
        commands:
          - "sudo pacman -S --noconfirm code"
  simulated_events:
    - type: command_failure
      app: Visual Studio Code
      package: code
      rc: 1
      stdout: ""
      stderr: "error: target not found: code"
      repair_strategy: ""
      provider_error: ""
    - type: repair_response
      app: Visual Studio Code
      package: visual-studio-code-bin
      rc: 0
      stdout: "Switching source from repo to AUR"
      stderr: ""
      repair_strategy: repo_to_aur
      provider_error: ""
    - type: command_success
      app: Visual Studio Code
      package: visual-studio-code-bin
      rc: 0
      stdout: "installed"
      stderr: ""
      repair_strategy: repo_to_aur
      provider_error: ""
  expected:
    completed_apps:
      - Visual Studio Code
    manual_followup_apps: []
    failed_apps: []
    alternatives: []
    final_status: success
    must_not_block: true
    invariants:
      - successful_apps_preserved
      - final_status_honest
  rationale: "A stale repo hint on Arch should be repairable by switching to AUR instead of looping the failed pacman command."

