- id: mixed-group-source-fallback-isolated
  category: source_fallback
  facts_profile:
    family: arch
    package_manager: pacman
    installed_apps_before: []
    installed_apps_after:
      - firefox
      - discord
    flatpak_available: true
    snap_available: false
    aur_helper: yay
  plan:
    requested_apps:
      - name: Firefox
        package: firefox
        source: repo
        required: true
      - name: Discord
        package: discord
        source: repo
        required: false
      - name: Figma
        package: figma-linux
        source: aur
        required: false
    command_groups:
      - title: Install browser and chat apps
        packages:
          - firefox
          - discord
          - figma-linux
        commands:
          - "sudo pacman -S --noconfirm firefox discord figma-linux"
  simulated_events:
    - type: command_failure
      app: ""
      package: ""
      rc: 1
      stdout: "firefox installed"
      stderr: "discord and figma-linux not found"
      repair_strategy: ""
      provider_error: ""
    - type: repair_response
      app: Discord
      package: com.discordapp.Discord
      rc: 0
      stdout: "Use Flatpak"
      stderr: ""
      repair_strategy: repo_to_flatpak
      provider_error: ""
    - type: command_success
      app: Discord
      package: com.discordapp.Discord
      rc: 0
      stdout: "installed"
      stderr: ""
      repair_strategy: repo_to_flatpak
      provider_error: ""
    - type: provider_error
      app: Figma
      package: figma-linux
      rc: 0
      stdout: ""
      stderr: ""
      repair_strategy: aur_retry
      provider_error: "429"
  expected:
    completed_apps:
      - Firefox
      - Discord
    manual_followup_apps:
      - Figma
    failed_apps: []
    alternatives: []
    final_status: success_with_warnings
    must_not_block: true
    invariants:
      - successful_apps_preserved
      - failure_isolated
      - provider_error_preserves_progress
      - final_status_honest
  rationale: "Mixed source fallback should preserve completed apps while isolating the provider failure to optional Figma."

