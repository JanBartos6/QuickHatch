      provider_error: ""
    - type: repair_response
      app: Slack
      package: slack
      rc: 0
      stdout: "Try snap package slack"
      stderr: ""
      repair_strategy: repo_to_snap
      provider_error: ""
    - type: command_success
      app: Slack
      package: slack
      rc: 0
      stdout: "installed"
      stderr: ""
      repair_strategy: repo_to_snap
      provider_error: ""
  expected:
    completed_apps:
      - Slack
    manual_followup_apps: []
