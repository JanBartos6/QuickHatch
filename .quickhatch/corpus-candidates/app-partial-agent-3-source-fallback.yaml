      stderr: ""
      repair_strategy: flatpak_to_repo
      provider_error: ""
    - type: command_success
      app: GIMP
      package: gimp
      rc: 0
      stdout: "installed"
      stderr: ""
      repair_strategy: flatpak_to_repo
      provider_error: ""
  expected:
    completed_apps:
      - GIMP
    manual_followup_apps: []
