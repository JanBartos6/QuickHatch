- id: multi-app-apt-required-editor-optional-chat-fails
  category: multi_app_partial
  facts_profile:
    family: ubuntu
    package_manager: apt
    installed_apps_before: []
    installed_apps_after:
      - vlc
      - libreoffice
    flatpak_available: true
    snap_available: false
    aur_helper: none
  plan:
    requested_apps:
      - name: VLC
        package: vlc
        source: repo
        required: true
      - name: LibreOffice
        package: libreoffice
        source: repo
        required: true
      - name: ChatThing
        package: chatthing-desktop
        source: repo
        required: false
    command_groups:
      - title: Install requested desktop apps
        packages:
          - vlc
          - libreoffice
          - chatthing-desktop
        commands:
          - "sudo apt-get install -y vlc libreoffice chatthing-desktop"
  simulated_events:
    - type: command_failure
      app: ""
      package: ""
      rc: 100
      stdout: "vlc and libreoffice installed"
      stderr: "E: Unable to locate package chatthing-desktop"
      repair_strategy: ""
      provider_error: ""
    - type: facts_refresh
      app: ""
      package: ""
      rc: 0
      stdout: "INSTALLED: vlc libreoffice; MISSING: chatthing-desktop"
      stderr: ""
      repair_strategy: ""
      provider_error: ""
    - type: verification
      app: VLC
      package: vlc
      rc: 0
      stdout: "verified"
      stderr: ""
      repair_strategy: ""
      provider_error: ""
    - type: verification
      app: LibreOffice
      package: libreoffice
      rc: 0
      stdout: "verified"
      stderr: ""
      repair_strategy: ""
      provider_error: ""
  expected:
    completed_apps:
      - VLC
      - LibreOffice
    manual_followup_apps:
      - ChatThing
    failed_apps: []
    alternatives: []
    final_status: success_with_warnings
    must_not_block: true
    invariants:
      - successful_apps_preserved
      - failure_isolated
      - final_status_honest
  rationale: "A missing optional package in a mixed apt group must not regress required apps that are verified installed."

