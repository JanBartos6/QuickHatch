      payload:
        run_id: "status-enum-warnings"
        result:
          passed: true
          final_status: "FinalSetupStatus.SUCCESS_WITH_WARNINGS"
          findings:
            - severity: "warning"
              category: "apps"
              summary: "Alternative package was installed for one requested app."
  expected_bundle_artifacts:
