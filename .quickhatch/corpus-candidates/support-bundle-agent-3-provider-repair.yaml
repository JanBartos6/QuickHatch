- id: provider-planning-429-blocked
  category: provider_error
  status: blocked
  representative_runlog_events:
    - event_type: "run_started"
      payload:
        host: "192.0.2.10"
        user: "quickhatch"
    - event_type: "model_call_failed"
      payload:
        context: "planning"
        attempt: 1
        elapsed_seconds: 2.4
        timeout_seconds: 180
        error: "HTTP 429 rate_limit_exceeded for Bearer sk-provider-secret"
    - event_type: "model_call_failed"
      payload:
        context: "planning"
        attempt: 2
        elapsed_seconds: 2.7
        timeout_seconds: 180
        error: "HTTP 429 rate_limit_exceeded for Bearer sk-provider-secret"
    - event_type: "model_call_failed"
      payload:
        context: "planning"
        attempt: 3
        elapsed_seconds: 3.1
        timeout_seconds: 180
        error: "HTTP 429 rate_limit_exceeded for Bearer sk-provider-secret"
  expected_bundle_artifacts:
    - "setup-runlog-redacted.jsonl"
    - "support-summary.json"
    - "replay-summary.json"
    - "manifest.json"
    - "README.txt"
  required_evidence:
    - "model_call_failed context=planning"
    - "attempt count 3"
    - "provider error category or rate-limit marker"
    - "terminal status or blocker explaining planning could not continue"
  redaction_expectations:
    - "sk-provider-secret must be redacted"
    - "Bearer token must be redacted"
  current_likely_gap: "pre-final model failure may leave support-summary final_status unknown unless a terminal run_failed/setup_blocked event exists"
  rationale: "A setup that cannot even produce a plan due to provider 429 needs enough evidence to distinguish quota/rate-limit from a harness safety block."
  risk: high

- id: provider-repair-429-app-manual-followup
  category: provider_error
  status: manual_followup_required
  representative_runlog_events:
    - event_type: "command_group_started"
      payload:
        stage: "apps"
        group:
          id: "apps-chat"
          title: "Install chat apps"
    - event_type: "command"
      payload:
        stage: "apps"
        group_id: "apps-chat"
        command: "apt install definitely-missing-chat-app"
        visible_command: "apt install definitely-missing-chat-app"
        rc: 100
        stdout_tail: ""
        stderr_tail: "E: Unable to locate package definitely-missing-chat-app"
    - event_type: "repair_prompt"
      payload:
        stage: "apps"
        group_id: "apps-chat"
        repair_attempt: 1
        prompt: "repair failed app install; api_key=sk-repair-secret"
    - event_type: "model_call_failed"
      payload:
        context: "repair"
        attempt: 1
        elapsed_seconds: 1.9
        timeout_seconds: 180
        error: "HTTP 429 insufficient_quota sk-repair-secret"
    - event_type: "model_call_failed"
      payload:
        context: "repair"
        attempt: 2
        elapsed_seconds: 2.2
        timeout_seconds: 180
        error: "HTTP 429 insufficient_quota sk-repair-secret"
    - event_type: "model_call_failed"
      payload:
        context: "repair"
        attempt: 3
        elapsed_seconds: 2.5
        timeout_seconds: 180
        error: "HTTP 429 insufficient_quota sk-repair-secret"
    - event_type: "repair_model_unavailable_manual_followup"
      payload:
        stage: "apps"
        group_id: "apps-chat"
        repair_attempt: 1
        repair_turn: 1
        error: "Repair LLM call failed after 3 attempts: HTTP 429 insufficient_quota sk-repair-secret"
        reason: "Repair LLM unavailable for 'Install chat apps': provider 429. Leaving this non-install group as manual follow-up."
    - event_type: "group_manual_followup"
      payload:
        stage: "apps"
        group_id: "apps-chat"
        reason: "Repair LLM unavailable for 'Install chat apps': provider 429. Leaving this non-install group as manual follow-up."
    - event_type: "final_audit"
      payload:
        result:
          final_status: "manual_followup_required"
          findings:
            - severity: "manual_followup"
              category: "apps"
              summary: "Chat app install needs manual follow-up after provider 429."
  expected_bundle_artifacts:
    - "setup-runlog-redacted.jsonl"
    - "manual-followups.json"
    - "final-audit.json"
    - "support-summary.json"
  required_evidence:
    - "failed app group id apps-chat"
    - "repair model unavailable reason"
    - "provider error category 429"
    - "manual follow-up item and reason"
  redaction_expectations:
    - "sk-repair-secret must be redacted in prompt and errors"
  current_likely_gap: "provider failures are preserved in runlog but not extracted into a dedicated provider-errors diagnostic artifact"
  rationale: "Provider rate limiting during non-critical app repair should not erase progress, and the support bundle should make the manual follow-up cause obvious."
  risk: medium

