- id: plan-extra-top-level-reject
  category: plan_schema
  output_kind: research_plan
  model_output: "{\"plan_id\":\"rp-schema-005\",\"summary\":\"Extra field present.\",\"steps\":[],\"commands\":[],\"risks\":[],\"requires_manual_followup\":false,\"notes\":\"I will be careful.\"}"
  expected:
