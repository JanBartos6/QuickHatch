- id: operation-single-object-accept
  category: dangerous_operation_shape
  output_kind: operation
  model_output: "{\"operation_id\":\"op-001\",\"kind\":\"file_read\",\"target\":\"README.md\",\"args\":{},\"requires_confirmation\":false}"
  expected:
    outcome: accept
    parser: parse_setup_operation
    normalized_assertions:
      - "parsed value is a single JSON object"
      - "kind equals file_read"
      - "requires_confirmation is false"
    error_contains: ""
  rationale: "A harmless setup operation represented as one bounded object should parse cleanly."
  risk: low

- id: operation-dangerous-missing-confirmation-reject
  category: dangerous_operation_shape
  output_kind: operation
  model_output: "{\"operation_id\":\"op-002\",\"kind\":\"delete\",\"target\":\".quickhatch/cache\",\"args\":{\"recursive\":true}}"
  expected:
