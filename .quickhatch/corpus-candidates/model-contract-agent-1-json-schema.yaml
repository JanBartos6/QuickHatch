- id: json-object-minimal-valid
  category: json_parseability
  output_kind: research_plan
  model_output: "{\"plan_id\":\"rp-json-001\",\"summary\":\"Inspect configuration loading boundaries.\",\"steps\":[{\"id\":\"s1\",\"action\":\"read\",\"target\":\"pyproject.toml\"}],\"commands\":[],\"risks\":[],\"requires_manual_followup\":false}"
  expected:
    outcome: accept
    parser: model_json_loads
    normalized_assertions:
      - "parsed value is a single JSON object"
      - "plan_id equals rp-json-001"
      - "requires_manual_followup is false"
    error_contains: ""
  rationale: "Baseline compact single-object JSON should parse without repair or extraction."
  risk: low

- id: json-fenced-object-normalize
  category: json_parseability
  output_kind: research_plan
  model_output: "```json\n{\"plan_id\":\"rp-json-002\",\"summary\":\"Check schema validation paths.\",\"steps\":[{\"id\":\"s1\",\"action\":\"inspect\",\"target\":\"quickhatch/schema.py\"}],\"commands\":[],\"risks\":[\"schema drift\"],\"requires_manual_followup\":false}\n```"
  expected:
    outcome: normalize
    parser: model_json_loads
    normalized_assertions:
      - "outer markdown fence is stripped"
      - "parsed value is a single JSON object"
      - "summary equals Check schema validation paths."
    error_contains: ""
  rationale: "Model output often arrives in a fenced JSON block; parser should tolerate the wrapper while preserving object content."
  risk: medium

- id: json-prose-prefix-normalize
  category: json_parseability
  output_kind: research_plan
  model_output: "Here is the plan:\n{\"plan_id\":\"rp-json-003\",\"summary\":\"Trace command grouping behavior.\",\"steps\":[{\"id\":\"s1\",\"action\":\"trace\",\"target\":\"command grouping\"}],\"commands\":[],\"risks\":[],\"requires_manual_followup\":false}"
  expected:
    outcome: normalize
    parser: extract_research_plan
    normalized_assertions:
      - "leading prose is ignored"
      - "parsed value is a single JSON object"
      - "steps length is 1"
    error_contains: ""
  rationale: "Extractor should recover a bounded plan object from harmless leading prose."
  risk: medium

- id: json-prose-suffix-normalize
  category: json_parseability
  output_kind: research_plan
  model_output: "{\"plan_id\":\"rp-json-004\",\"summary\":\"Review repair action boundaries.\",\"steps\":[{\"id\":\"s1\",\"action\":\"review\",\"target\":\"repair contract\"}],\"commands\":[],\"risks\":[],\"requires_manual_followup\":false}\nI can proceed after validation."
  expected:
    outcome: normalize
    parser: extract_research_plan
    normalized_assertions:
      - "trailing prose is ignored"
      - "parsed value is a single JSON object"
      - "plan_id equals rp-json-004"
    error_contains: ""
  rationale: "Extractor should accept a valid object followed by non-JSON commentary only when a single object can be unambiguously isolated."
  risk: medium

- id: json-array-root-reject
  category: json_parseability
  output_kind: research_plan
  model_output: "[{\"plan_id\":\"rp-json-005\",\"summary\":\"First plan\",\"steps\":[],\"commands\":[],\"risks\":[],\"requires_manual_followup\":false}]"
  expected:
    outcome: reject
    parser: model_json_loads
    normalized_assertions: []
    error_contains: "single JSON object"
  rationale: "A root array is parseable JSON but violates the single-object contract."
  risk: high

- id: json-two-objects-reject
  category: json_parseability
  output_kind: research_plan
  model_output: "{\"plan_id\":\"rp-json-006a\",\"summary\":\"First\",\"steps\":[],\"commands\":[],\"risks\":[],\"requires_manual_followup\":false}\n{\"plan_id\":\"rp-json-006b\",\"summary\":\"Second\",\"steps\":[],\"commands\":[],\"risks\":[],\"requires_manual_followup\":false}"
  expected:
    outcome: reject
    parser: extract_research_plan
    normalized_assertions: []
    error_contains: "multiple JSON objects"
  rationale: "Multiple adjacent objects are ambiguous and should not be silently merged or first-picked."
  risk: high

- id: json-invalid-trailing-comma-reject
  category: json_parseability
  output_kind: research_plan
  model_output: "{\"plan_id\":\"rp-json-007\",\"summary\":\"Invalid comma\",\"steps\":[],\"commands\":[],\"risks\":[],\"requires_manual_followup\":false,}"
  expected:
    outcome: reject
    parser: model_json_loads
    normalized_assertions: []
    error_contains: "invalid JSON"
  rationale: "Strict JSON parsing should reject common JavaScript-like trailing commas."
  risk: high

- id: json-invalid-single-quotes-reject
  category: json_parseability
  output_kind: research_plan
  model_output: "{'plan_id':'rp-json-008','summary':'Single quotes','steps':[],'commands':[],'risks':[],'requires_manual_followup':false}"
  expected:
    outcome: reject
    parser: model_json_loads
    normalized_assertions: []
    error_contains: "invalid JSON"
  rationale: "Python literal syntax must not be accepted as JSON."
  risk: high

- id: json-invalid-comment-reject
  category: json_parseability
  output_kind: research_plan
  model_output: "{\"plan_id\":\"rp-json-009\",\"summary\":\"Has comment\",// explain\n\"steps\":[],\"commands\":[],\"risks\":[],\"requires_manual_followup\":false}"
  expected:
    outcome: reject
    parser: model_json_loads
    normalized_assertions: []
    error_contains: "invalid JSON"
  rationale: "JSON with comments should be rejected rather than normalized, avoiding permissive parser drift."
  risk: high

- id: thought-block-prefix-strip-normalize
  category: prompt_contract
  output_kind: research_plan
  model_output: "<thought>I should inspect the repository first and decide what to do.</thought>\n{\"plan_id\":\"rp-json-010\",\"summary\":\"Inspect prompt contracts.\",\"steps\":[{\"id\":\"s1\",\"action\":\"inspect\",\"target\":\"prompt contract\"}],\"commands\":[],\"risks\":[],\"requires_manual_followup\":false}"
  expected:
    outcome: normalize
    parser: extract_research_plan
    normalized_assertions:
      - "thought block is stripped"
      - "parsed value is a single JSON object"
      - "summary equals Inspect prompt contracts."
    error_contains: ""
  rationale: "Private reasoning wrappers should not contaminate the accepted plan when a valid bounded object follows."
  risk: medium

- id: thought-block-inside-json-reject
  category: prompt_contract
  output_kind: research_plan
  model_output: "{\"plan_id\":\"rp-json-011\",\"summary\":\"<thought>hidden</thought>Inspect contracts.\",\"steps\":[],\"commands\":[],\"risks\":[],\"requires_manual_followup\":false}"
  expected:
    outcome: reject
    parser: extract_research_plan
    normalized_assertions: []
    error_contains: "thought"
  rationale: "Thought markup embedded inside accepted JSON fields should be rejected, not quietly preserved as user-visible plan text."
  risk: high

- id: plan-required-fields-accept
  category: plan_schema
  output_kind: research_plan
  model_output: "{\"plan_id\":\"rp-schema-001\",\"summary\":\"Validate top-level required fields.\",\"steps\":[{\"id\":\"s1\",\"action\":\"validate\",\"target\":\"required fields\"}],\"commands\":[],\"risks\":[\"missing top-level fields\"],\"requires_manual_followup\":false}"
  expected:
    outcome: accept
    parser: extract_research_plan
    normalized_assertions:
      - "top-level field plan_id is present"
      - "top-level field summary is present"
      - "top-level field steps is present"
      - "top-level field commands is present"
      - "top-level field risks is present"
      - "top-level field requires_manual_followup is present"
    error_contains: ""
  rationale: "A complete research plan with all required top-level fields should pass schema validation."
  risk: low

- id: plan-missing-summary-reject
  category: plan_schema
  output_kind: research_plan
  model_output: "{\"plan_id\":\"rp-schema-002\",\"steps\":[{\"id\":\"s1\",\"action\":\"validate\",\"target\":\"summary\"}],\"commands\":[],\"risks\":[],\"requires_manual_followup\":false}"
  expected:
    outcome: reject
    parser: extract_research_plan
