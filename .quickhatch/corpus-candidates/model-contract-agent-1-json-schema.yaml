- id: command-group-empty-accept
  category: command_group_contract
  output_kind: research_plan
  model_output: "{\"plan_id\":\"rp-cmd-001\",\"summary\":\"No command execution required.\",\"steps\":[{\"id\":\"s1\",\"action\":\"read\",\"target\":\"provided context\"}],\"commands\":[],\"risks\":[],\"requires_manual_followup\":false}"
