  category: plan_schema
  output_kind: research_plan
  model_output: "{\"plan_id\":\"rp-schema-004\",\"summary\":\"Steps as text.\",\"steps\":\"Read the files, then decide.\",\"commands\":[],\"risks\":[],\"requires_manual_followup\":false}"
