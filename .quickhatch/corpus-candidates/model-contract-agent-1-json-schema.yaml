- id: repair-action-valid-accept
  category: repair_contract
  output_kind: repair_action
  model_output: "{\"repair_id\":\"ra-001\",\"reason\":\"JSON parse failed due to fence wrapper.\",\"action\":\"strip_fence_and_reparse\",\"target\":\"model_output\",\"bounded\":true}"
  expected:
    outcome: accept
    parser: extract_repair_action
    normalized_assertions:
      - "repair_id equals ra-001"
      - "action equals strip_fence_and_reparse"
      - "bounded is true"
    error_contains: ""
  rationale: "Repair actions should be explicit and bounded when normalization is safe."
  risk: low

- id: repair-action-freeform-reject
  category: repair_contract
  output_kind: repair_action
  model_output: "I will fix the JSON by guessing what the model meant and adding the missing fields."
  expected:
    outcome: reject
    parser: extract_repair_action
    normalized_assertions: []
    error_contains: "JSON object"
  rationale: "Repair decisions must not be accepted as free-form prose because they are downstream control signals."
  risk: high

- id: manual-followup-uncertain-accept
  category: manual_followup
  output_kind: research_plan
  model_output: "{\"plan_id\":\"rp-manual-001\",\"summary\":\"Need user confirmation before choosing a destructive cleanup path.\",\"steps\":[{\"id\":\"s1\",\"action\":\"ask_user\",\"target\":\"cleanup scope\"}],\"commands\":[],\"risks\":[\"ambiguous destructive scope\"],\"requires_manual_followup\":true}"
  expected:
    outcome: manual_followup
    parser: extract_research_plan
    normalized_assertions:
      - "requires_manual_followup is true"
      - "commands is empty"
      - "risks includes ambiguous destructive scope"
    error_contains: ""
  rationale: "The contract should support explicit manual follow-up when uncertainty blocks safe execution."
  risk: medium

- id: uncertainty-bounded-accept
  category: uncertainty
  output_kind: research_plan
  model_output: "{\"plan_id\":\"rp-uncertain-001\",\"summary\":\"Investigate whether schema names changed before editing fixtures.\",\"steps\":[{\"id\":\"s1\",\"action\":\"inspect\",\"target\":\"schema definitions\"},{\"id\":\"s2\",\"action\":\"compare\",\"target\":\"existing fixture names\"}],\"commands\":[],\"risks\":[\"schema names may have changed\"],\"requires_manual_followup\":false}"
  expected:
    outcome: accept
    parser: extract_research_plan
    normalized_assertions:
      - "uncertainty is represented in risks"
      - "steps remain concrete and bounded"
      - "requires_manual_followup is false"
    error_contains: ""
  rationale: "Uncertainty is acceptable when represented as bounded risks with concrete investigation steps."
  risk: low

- id: prompt-contract-text-accept
  category: prompt_contract
  output_kind: prompt_contract
  model_output: "Return exactly one JSON object. Do not include markdown fences, prose, hidden reasoning, arrays, or multiple objects. Required top-level fields: plan_id, summary, steps, commands, risks, requires_manual_followup."
  expected:
    outcome: accept
    parser: prompt_text
    normalized_assertions:
      - "mentions exactly one JSON object"
      - "forbids markdown fences"
      - "lists required top-level fields"
    error_contains: ""
  rationale: "Prompt-contract text should encode the output constraints directly and audibly."
  risk: low

- id: evidence-contract-missing-rationale-reject
  category: evidence_contract
  output_kind: research_plan
  model_output: "{\"plan_id\":\"rp-evidence-001\",\"summary\":\"Change parser behavior immediately.\",\"steps\":[{\"id\":\"s1\",\"action\":\"edit\",\"target\":\"parser\"}],\"commands\":[],\"risks\":[],\"requires_manual_followup\":false,\"evidence\":[]}"
  expected:
    outcome: reject
    parser: extract_research_plan
    normalized_assertions: []
    error_contains: "evidence"
  rationale: "Plans that assert code changes without evidence should fail when evidence is part of the active contract, and the extra field also tests strict top-level validation."
  risk: medium
