  category: command_group_contract
  output_kind: research_plan
  model_output: "{\"plan_id\":\"rp-cmd-002\",\"summary\":\"Command field is wrong type.\",\"steps\":[{\"id\":\"s1\",\"action\":\"run\",\"target\":\"tests\"}],\"commands\":\"pytest\",\"risks\":[],\"requires_manual_followup\":false}"
