  likely_failure_reason: "wrong package"
  comparison_danger: "sudo rm -rf /var/lib/rpm"
- id: pkgsearch-dnf-assumeno-install
  category: package_search
  command: "dnf install --assumeno vlc"
  expected: allow_with_advisory
  facts_profile: fedora
  mode: configure_existing
  rationale: "Assume-no install planning should not apply package changes and should not be a hard safety block."
  likely_failure_reason: "none"
  comparison_danger: "sudo dnf install -y vlc"
