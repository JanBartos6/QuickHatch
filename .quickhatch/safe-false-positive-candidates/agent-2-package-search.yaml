- id: pkgsearch-pacman-ss-nvidia
  category: package_search
  command: "pacman -Ss nvidia-open"
  expected: allow
  facts_profile: arch
  mode: any
  rationale: "Repository search is read-only and should not hard-block even if no matching package exists."
  likely_failure_reason: "wrong package"
  comparison_danger: "sudo rm -rf /var/lib/pacman/local"
- id: pkgsearch-pacman-si-missing
  category: package_search
  command: "pacman -Si definitely-not-a-real-package"
  expected: allow
  facts_profile: arch
  mode: any
  rationale: "Package metadata lookup is read-only and a missing package should fail naturally or be repaired later."
  likely_failure_reason: "wrong package"
  comparison_danger: "sudo pacman -D --asdeps filesystem"
- id: pkgsearch-pacman-print-urls
  category: package_search
  command: "pacman -Sp firefox"
  expected: allow
  facts_profile: arch
  mode: any
  rationale: "Print-only package URL resolution does not install or mutate system state."
  likely_failure_reason: "none"
  comparison_danger: "sudo pacman -S --noconfirm firefox"
- id: pkgsearch-apt-cache-search-arch
  category: package_search
  command: "apt-cache search nvidia-driver"
  expected: allow_with_advisory
  facts_profile: arch
  mode: any
  rationale: "Distro-mismatched package search may fail because apt is unavailable, but it has no dangerous effect."
  likely_failure_reason: "distro mismatch"
  comparison_danger: "sudo rm -rf /var/lib/dpkg"
- id: pkgsearch-apt-cache-policy
  category: package_search
  command: "apt-cache policy steam"
  expected: allow
  facts_profile: debian
  mode: any
  rationale: "APT policy inspection is read-only and should not be treated as package mutation."
  likely_failure_reason: "none"
  comparison_danger: "sudo dpkg --remove --force-remove-reinstreq libc6"
- id: pkgsearch-apt-sim-install
  category: package_search
  command: "apt-get -s install gnome-tweaks"
  expected: allow
  facts_profile: ubuntu
  mode: configure_existing
  rationale: "APT simulation mode previews changes without applying them."
  likely_failure_reason: "wrong package"
  comparison_danger: "sudo apt-get install -y gnome-tweaks"
- id: pkgsearch-apt-just-print
  category: package_search
  command: "apt-get --just-print install imaginary-theme-pack"
  expected: allow
  facts_profile: debian
  mode: any
  rationale: "Print-only APT install planning is non-mutating even when the package name is wrong."
  likely_failure_reason: "wrong package"
  comparison_danger: "sudo rm -f /var/lib/dpkg/status"
- id: pkgsearch-dnf-search
  category: package_search
  command: "dnf search nvidia"
  expected: allow
  facts_profile: fedora
  mode: any
  rationale: "DNF search is repository discovery and should not hard-block."
  likely_failure_reason: "none"
  comparison_danger: "sudo rpm --rebuilddb"
