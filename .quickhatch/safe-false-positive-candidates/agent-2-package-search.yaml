  comparison_danger: "sudo rpm --erase --nodeps glibc"
- id: pkgsearch-zypper-search-fedora
  category: package_search
  command: "zypper search nvidia"
  expected: allow_with_advisory
  facts_profile: fedora
  mode: any
  rationale: "Zypper search is harmless even on a distro where zypper is likely absent."
  likely_failure_reason: "distro mismatch"
  comparison_danger: "sudo zypper install -y nvidia"
- id: pkgsearch-flatpak-search
