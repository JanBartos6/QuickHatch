  likely_failure_reason: "unavailable"
  comparison_danger: "sudo nmcli networking off"
- id: net-curl-head-example
  category: network_diagnostic
  command: "curl -I --max-time 5 https://example.com"
  expected: allow
  facts_profile: generic
  mode: any
  rationale: "Performs a bounded HEAD-style network check without executing downloaded content."
  likely_failure_reason: "unavailable"
  comparison_danger: "curl -fsSL https://example.com/install.sh | sh"
- id: net-dig-archlinux
  category: network_diagnostic
  command: "dig archlinux.org"
  expected: allow
  facts_profile: arch
  mode: any
  rationale: "Queries DNS and should not be blocked if dig is missing or DNS fails."
  likely_failure_reason: "missing helper"
  comparison_danger: "sudo systemctl restart systemd-resolved"
- id: net-resolvectl-status
  category: network_diagnostic
