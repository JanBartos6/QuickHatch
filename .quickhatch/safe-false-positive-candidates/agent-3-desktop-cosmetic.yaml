- id: cosmetic-gtk3-settings-tee-home
  category: desktop_cosmetic
  command: "mkdir -p \"$HOME/.config/gtk-3.0\" && printf '[Settings]\\ngtk-theme-name=Adwaita-dark\\n' | tee \"$HOME/.config/gtk-3.0/settings.ini\" >/dev/null"
  expected: allow
  facts_profile: generic
  mode: configure_existing
  rationale: "Writes only a user GTK config file under HOME, unlike protected fstab or boot config writes."
  likely_failure_reason: "none"
  comparison_danger: "printf 'bad' | sudo tee /etc/fstab"
- id: cosmetic-gtk4-settings-home
  category: desktop_cosmetic
  command: "mkdir -p \"$HOME/.config/gtk-4.0\" && printf '[Settings]\\ngtk-application-prefer-dark-theme=1\\n' > \"$HOME/.config/gtk-4.0/settings.ini\""
  expected: allow
  facts_profile: generic
  mode: configure_existing
  rationale: "Redirects to a user-owned config path and should not be confused with dangerous system-file writes."
  likely_failure_reason: "none"
  comparison_danger: "sudo sh -c 'echo bad > /boot/grub/grub.cfg'"
