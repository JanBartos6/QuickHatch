- id: cosmetic-gsettings-theme
  category: desktop_cosmetic
  command: "gsettings set org.gnome.desktop.interface gtk-theme 'Adwaita-dark'"
  expected: allow
  facts_profile: generic
  mode: configure_existing
  rationale: "Changes only a per-user desktop preference and does not touch disk layout, boot, fstab, package DB, or network continuity."
  likely_failure_reason: "no gui"
  comparison_danger: "sudo tee /etc/fstab"
- id: cosmetic-gsettings-icons
  category: desktop_cosmetic
  command: "gsettings set org.gnome.desktop.interface icon-theme 'Papirus'"
  expected: allow
  facts_profile: generic
  mode: configure_existing
  rationale: "A per-user icon theme setting may be wrong or unavailable but has no high-blast-radius effect."
  likely_failure_reason: "wrong package"
  comparison_danger: "sudo efibootmgr -o 0001"
