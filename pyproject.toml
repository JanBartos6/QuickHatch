[project]
name = "quickhatch"
version = "0.1.0"
description = "Windows-to-Linux migration wizard powered by AI"
requires-python = ">=3.10"
dependencies = [
    "rich>=13.0",
    "questionary>=2.0",
    "pyyaml>=6.0",
    "requests>=2.28",
    "psutil>=5.9",
    "ddgs>=7.0",
]

[project.scripts]
quickhatch = "quickhatch.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quickhatch"]
