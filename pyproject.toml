[project]
name = "quickhatch"
version = "0.1.0"
description = "Windows-to-Linux migration wizard powered by AI"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Jan Bartos"}]
requires-python = ">=3.10"
keywords = [
    "linux", "migration", "windows", "ai", "llm", "agent",
    "wizard", "arch", "ubuntu", "fedora", "ssh", "automation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Installation/Setup",
    "Topic :: System :: Operating System",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "rich>=13.0",
    "questionary>=2.0",
    "pyyaml>=6.0",
    "requests>=2.28",
    "psutil>=5.9",
    "ddgs>=7.0",
    "Pillow>=10.0",
    "imagehash>=4.3",
    "keyring>=25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
    "build>=1.0",
    "pre-commit>=3.0",
]

[project.scripts]
quickhatch = "quickhatch.cli:main"

[project.urls]
Homepage = "https://github.com/JanBartos6/QuickHatch"
Documentation = "https://github.com/JanBartos6/QuickHatch/tree/main/docs"
Issues = "https://github.com/JanBartos6/QuickHatch/issues"
Changelog = "https://github.com/JanBartos6/QuickHatch/blob/main/CHANGELOG.md"
Source = "https://github.com/JanBartos6/QuickHatch"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = [
    "src/quickhatch/data/app_catalog.agent_suggestions*.json",
    "src/quickhatch/data/app_catalog.research_batch*.json",
]

[tool.hatch.build.targets.wheel]
packages = ["src/quickhatch"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]  # line length handled by formatter
